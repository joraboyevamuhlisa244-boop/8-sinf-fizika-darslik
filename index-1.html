003c/span>\n                        \u003cdiv class=\"flex gap-2\">\n                            \u003cbutton onclick=\"setResistorPreset(10)\" class=\"px-3 py-1.5 text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 transition active:scale-95\">10 Ω\u003c/button>\n                            \u003cbutton onclick=\"setResistorPreset(50)\" class=\"px-3 py-1.5 text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 transition active:scale-95\">50 Ω\u003c/button>\n                            \u003cbutton onclick=\"setResistorPreset(100)\" class=\"px-3 py-1.5 text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 transition active:scale-95\">100 Ω\u003c/button>\n                        \u003c/div>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Observations Data Table -->\n                \u003cdiv class=\"bg-slate-950 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between\">\n                    \u003cdiv>\n                        \u003ch3 class=\"text-lg font-bold text-slate-100 mb-3 border-b border-slate-800 pb-2 flex items-center justify-between\">\n                            \u003cspan>\u003ci class=\"fa-solid fa-table text-emerald-400\">\u003c/i> Kuzatuv Jadvali\u003c/span>\n                            \u003cbutton onclick=\"recordDataRow()\" class=\"px-2.5 py-1 text-xs bg-emerald-600/30 border border-emerald-500/40 text-emerald-300 rounded-md hover:bg-emerald-600/50\">\n                                \u003ci class=\"fa-solid fa-plus\">\u003c/i> Yozib olish\n                            \u003c/button>\n                        \u003c/h3>\n\n                        \u003cdiv class=\"overflow-x-auto\">\n                            \u003ctable class=\"w-full text-left text-xs border-collapse\">\n                                \u003cthead>\n                                    \u003ctr class=\"border-b border-slate-800 text-slate-400\">\n                                        \u003cth class=\"py-2 px-1\">Qarshilik (R)\u003c/th>\n                                        \u003cth class=\"py-2 px-1\">Tok (I)\u003c/th>\n                                        \u003cth class=\"py-2 px-1\">Yorqinlik\u003c/th>\n                                    \u003c/tr>\n                                \u003c/thead>\n                                \u003ctbody id=\"observationTableBody\" class=\"divide-y divide-slate-800/60 text-slate-300\">\n                                    \u003ctr>\n                                        \u003ctd class=\"py-2 px-1 font-bold text-blue-400\">10 Ω\u003c/td>\n                                        \u003ctd class=\"py-2 px-1 text-emerald-400\">0.90 A\u003c/td>\n                                        \u003ctd class=\"py-2 px-1 text-amber-300\">Juda Yorqin\u003c/td>\n                                    \u003c/tr>\n                                    \u003ctr>\n                                        \u003ctd class=\"py-2 px-1 font-bold text-blue-400\">50 Ω\u003c/td>\n                                        \u003ctd class=\"py-2 px-1 text-emerald-400\">0.18 A\u003c/td>\n                                        \u003ctd class=\"py-2 px-1 text-amber-400\">O'rtacha\u003c/td>\n                                    \u003c/tr>\n                                    \u003ctr>\n                                        \u003ctd class=\"py-2 px-1 font-bold text-blue-400\">100 Ω\u003c/td>\n                                        \u003ctd class=\"py-2 px-1 text-emerald-400\">0.09 A\u003c/td>\n                                        \u003ctd class=\"py-2 px-1 text-amber-600\">Xira\u003c/td>\n                                    \u003c/tr>\n                                \u003c/tbody>\n                            \u003c/table>\n                        \u003c/div>\n                    \u003c/div>\n\n                    \u003c!-- Lab Conclusion -->\n                    \u003cdiv class=\"bg-slate-900 border border-slate-800 p-4 rounded-xl mt-4\">\n                        \u003ch4 class=\"font-bold text-slate-200 text-xs mb-1 text-emerald-400 flex items-center gap-1\">\n                            \u003ci class=\"fa-solid fa-graduation-cap\">\u003c/i> Laboratoriya Xulosasi:\n                        \u003c/h4>\n                        \u003cp class=\"text-xs text-slate-300 leading-relaxed\">\n                            Kuchlanish o'zgarmas bo'lganda, rezistorning qarshiligi $R$ ortgani sari zanjirdagi tok kuchi $I$ proportsional ravishda kamayadi va lampochka yorqinligi susayadi.\n                        \u003c/p>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n        \u003c!-- SECTION 3: Reostat vs Potensiometr -->\n        \u003csection id=\"tab3\" class=\"tab-content hidden space-y-6\">\n            \u003c!-- Mode Switcher Header -->\n            \u003cdiv class=\"bg-slate-950 border border-slate-800 p-4 rounded-2xl flex flex-wrap justify-between items-center gap-4\">\n                \u003cdiv>\n                    \u003ch2 class=\"text-xl font-bold text-slate-100\">Reostat va Potensiometr Taqqoslamasi\u003c/h2>\n                    \u003cp class=\"text-xs text-slate-400\">2-terminal va 3-terminal ulash usullari o'rtasidagi farqni o'rganing\u003c/p>\n                \u003c/div>\n                \u003cdiv class=\"flex bg-slate-900 p-1 rounded-xl border border-slate-800\">\n                    \u003cbutton onclick=\"setCompareMode('rheostat')\" id=\"modeRheostatBtn\" class=\"px-4 py-2 text-xs font-bold rounded-lg bg-blue-600 text-white transition\">\n                        Reostat Rejimi (2-terminal)\n                    \u003c/button>\n                    \u003cbutton onclick=\"setCompareMode('potentiometer')\" id=\"modePotentiometerBtn\" class=\"px-4 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition\">\n                        Potensiometr Rejimi (3-terminal)\n                    \u003c/button>\n                \u003c/div>\n            \u003c/div>\n\n            \u003cdiv class=\"grid grid-cols-1 lg:grid-cols-3 gap-6\">\n                \u003c!-- Interactive Component Canvas -->\n                \u003cdiv class=\"lg:col-span-2 bg-slate-950 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between shadow-2xl space-y-4\">\n                    \u003cdiv class=\"flex justify-between items-center\">\n                        \u003cspan id=\"modeBadge\" class=\"px-3 py-1 text-xs font-bold bg-blue-500/20 text-blue-400 border border-blue-500/30 rounded-full\">\n                            Reostat (Tokni boshqarish)\n                        \u003c/span>\n                        \u003cspan class=\"text-xs text-slate-400\">Surgichni (wiper) surib ko'ring!\u003c/span>\n                    \u003c/div>\n\n                    \u003c!-- SVG Visual representation -->\n                    \u003cdiv class=\"relative w-full h-[280px] bg-slate-900 rounded-xl overflow-hidden border border-slate-800 flex items-center justify-center p-4\">\n                        \u003csvg id=\"rheostatSvg\" width=\"100%\" height=\"100%\" viewBox=\"0 0 500 240\">\n                            \u003c!-- Main Resistive Coil Coil track -->\n                            \u003crect x=\"80\" y=\"110\" width=\"340\" height=\"20\" rx=\"4\" fill=\"#334155\" stroke=\"#64748b\" stroke-width=\"2\"/>\n\n                            \u003c!-- Coils pattern -->\n                            \u003cg stroke=\"#94a3b8\" stroke-width=\"2\">\n                                \u003cline x1=\"100\" y1=\"110\" x2=\"100\" y2=\"130\"/>\n                                \u003cline x1=\"120\" y1=\"110\" x2=\"120\" y2=\"130\"/>\n                                \u003cline x1=\"140\" y1=\"110\" x2=\"140\" y2=\"130\"/>\n                                \u003cline x1=\"160\" y1=\"110\" x2=\"160\" y2=\"130\"/>\n                                \u003cline x1=\"180\" y1=\"110\" x2=\"180\" y2=\"130\"/>\n                                \u003cline x1=\"200\" y1=\"110\" x2=\"200\" y2=\"130\"/>\n                                \u003cline x1=\"220\" y1=\"110\" x2=\"220\" y2=\"130\"/>\n                                \u003cline x1=\"240\" y1=\"110\" x2=\"240\" y2=\"130\"/>\n                                \u003cline x1=\"260\" y1=\"110\" x2=\"260\" y2=\"130\"/>\n                                \u003cline x1=\"280\" y1=\"110\" x2=\"280\" y2=\"130\"/>\n                                \u003cline x1=\"300\" y1=\"110\" x2=\"300\" y2=\"130\"/>\n                                \u003cline x1=\"320\" y1=\"110\" x2=\"320\" y2=\"130\"/>\n                                \u003cline x1=\"340\" y1=\"110\" x2=\"340\" y2=\"130\"/>\n                                \u003cline x1=\"360\" y1=\"110\" x2=\"360\" y2=\"130\"/>\n                                \u003cline x1=\"380\" y1=\"110\" x2=\"380\" y2=\"130\"/>\n                                \u003cline x1=\"400\" y1=\"110\" x2=\"400\" y2=\"130\"/>\n                            \u003c/g>\n\n                            \u003c!-- Active Length Highlight -->\n                            \u003crect id=\"activeCoilRect\" x=\"80\" y=\"110\" width=\"170\" height=\"20\" rx=\"2\" fill=\"#3b82f6\" opacity=\"0.6\"/>\n\n                            \u003c!-- Terminals A, B, C -->\n                            \u003c!-- Terminal A -->\n                            \u003ccircle cx=\"80\" cy=\"120\" r=\"7\" fill=\"#ef4444\"/>\n                            \u003ctext x=\"80\" y=\"150\" font-size=\"12\" font-weight=\"bold\" fill=\"#ef4444\" text-anchor=\"middle\">A\u003c/text>\n\n                            \u003c!-- Terminal B -->\n                            \u003ccircle cx=\"420\" cy=\"120\" r=\"7\" fill=\"#38bdf8\"/>\n                            \u003ctext x=\"420\" y=\"150\" font-size=\"12\" font-weight=\"bold\" fill=\"#38bdf8\" text-anchor=\"middle\">B\u003c/text>\n\n                            \u003c!-- Wiper / Slider C -->\n                            \u003cg id=\"wiperGroup\" transform=\"translate(250, 0)\">\n                                \u003cpath d=\"M 0 50 L 0 108\" stroke=\"#f59e0b\" stroke-width=\"4\" stroke-linecap=\"round\"/>\n                                \u003cpolygon points=\"-10,50 10,50 0,65\" fill=\"#f59e0b\"/>\n                                \u003ccircle cx=\"0\" cy=\"45\" r=\"8\" fill=\"#f59e0b\"/>\n                                \u003ctext x=\"0\" y=\"32\" font-size=\"12\" font-weight=\"bold\" fill=\"#f59e0b\" text-anchor=\"middle\">C (Surgich)\u003c/text>\n                            \u003c/g>\n\n                            \u003c!-- Length Indicator L -->\n                            \u003cline id=\"lengthLine\" x1=\"80\" y1=\"180\" x2=\"250\" y2=\"180\" stroke=\"#f59e0b\" stroke-width=\"2\" marker-end=\"url(#arrow)\"/>\n                            \u003ctext id=\"lengthText\" x=\"165\" y=\"198\" font-size=\"12\" font-weight=\"bold\" fill=\"#f59e0b\" text-anchor=\"middle\">Uzunlik L = 50%\u003c/text>\n\n                            \u003c!-- Load / Bulb -->\n                            \u003cg transform=\"translate(450, 50)\">\n                                \u003ccircle id=\"rheoBulbGlow\" cx=\"0\" cy=\"0\" r=\"25\" fill=\"#f59e0b\" opacity=\"0.4\"/>\n                                \u003ccircle cx=\"0\" cy=\"0\" r=\"16\" fill=\"#1e293b\" stroke=\"#f59e0b\" stroke-width=\"2\"/>\n                                \u003ctext x=\"0\" y=\"30\" font-size=\"10\" fill=\"#cbd5e1\" text-anchor=\"middle\">Iste'molchi\u003c/text>\n                            \u003c/g>\n                        \u003c/svg>\n                    \u003c/div>\n\n                    \u003c!-- Wiper Slider Control -->\n                    \u003cdiv class=\"space-y-2\">\n                        \u003cdiv class=\"flex justify-between text-sm\">\n                            \u003cspan class=\"text-slate-300 font-medium\">Surgich O'rni (Wiper Position):\u003c/span>\n                            \u003cspan id=\"wiperPosVal\" class=\"text-amber-400 font-bold\">50%\u003c/span>\n                        \u003c/div>\n                        \u003cinput type=\"range\" id=\"wiperSlider\" min=\"0\" max=\"100\" value=\"50\" class=\"custom-slider w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer\">\n                    \u003c/div>\n\n                    \u003c!-- Formula & Mode Description Card -->\n                    \u003cdiv id=\"modeDescription\" class=\"bg-slate-900 border border-slate-800 p-4 rounded-xl text-xs text-slate-300\">\n                        \u003c!-- Dynamic content injected via JavaScript -->\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Mini Challenge Quiz Card -->\n                \u003cdiv class=\"bg-slate-950 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between space-y-4\">\n                    \u003cdiv>\n                        \u003cdiv class=\"flex items-center gap-2 mb-3 border-b border-slate-800 pb-2\">\n                            \u003cdiv class=\"p-2 bg-amber-500/20 text-amber-400 rounded-lg\">\n                                \u003ci class=\"fa-solid fa-lightbulb\">\u003c/i>\n                            \u003c/div>\n                            \u003cdiv>\n                                \u003ch3 class=\"font-bold text-slate-100 text-sm\">Amaliy Topshiriq\u003c/h3>\n                                \u003cp class=\"text-[11px] text-slate-400\">\"Uy yoritgichini (Dimmer / LED) loyihalash\"\u003c/p>\n                            \u003c/div>\n                        \u003c/div>\n\n                        \u003cdiv class=\"bg-slate-900 border border-slate-800 p-3.5 rounded-xl text-xs space-y-2 mb-4\">\n                            \u003cp class=\"text-slate-300\">\u003cstrong class=\"text-amber-400\">Muammo:\u003c/strong> $12\\text{ V}$ manbaga $6\\text{ V}$ li LED chiroq ulanishi kerak. Ishchi tok $I = 0.2\\text{ A}$. LED yonib ketmasligi uchun zanjirga necha Om rezistor ulash zarur?\u003c/p>\n                        \u003c/div>\n\n                        \u003c!-- Interactive Inputs for Challenge -->\n                        \u003cdiv class=\"space-y-3\">\n                            \u003cdiv>\n                                \u003clabel class=\"text-xs text-slate-400 block mb-1\">Ortiqcha kuchlanish ($U_R$):\u003c/label>\n                                \u003cinput type=\"number\" id=\"quizVoltageInput\" placeholder=\"12V - 6V = ?\" class=\"w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-slate-100 focus:outline-none focus:border-blue-500\">\n                            \u003c/div>\n                            \u003cdiv>\n                                \u003clabel class=\"text-xs text-slate-400 block mb-1\">Kerakli Rezistor ($R = U_R / I$):\u003c/label>\n                                \u003cinput type=\"number\" id=\"quizResistorInput\" placeholder=\"Necha Om (Ω)?\" class=\"w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-slate-100 focus:outline-none focus:border-blue-500\">\n                            \u003c/div>\n\n                            \u003cbutton onclick=\"checkChallenge()\" class=\"w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl transition flex justify-center items-center gap-2\">\n                                \u003ci class=\"fa-solid fa-circle-check\">\u003c/i> Javobni Tekshirish\n                            \u003c/button>\n                        \u003c/div>\n\n                        \u003c!-- Feedback Message -->\n                        \u003cdiv id=\"quizFeedback\" class=\"mt-3 p-3 rounded-xl text-xs hidden\">\u003c/div>\n                    \u003c/div>\n\n                    \u003c!-- Summary Tip -->\n                    \u003cdiv class=\"text-[11px] text-slate-500 italic\">\n                        Maslahat: Ovetni $R = \\frac{12 - 6}{0.2}$ formulasi orqali hisoblang!\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n    \u003c/main>\n\n    \u003c!-- Footer -->\n    \u003cfooter class=\"border-t border-slate-800 bg-slate-950 py-3 text-center text-xs text-slate-500\">\n        \u003cp>8-sinf Fizika fanidan interaktiv ko'rgazmali dars vositasi © 2026\u003c/p>\n    \u003c/footer>\n\n    \u003cscript>\n        // State variables\n        let currentTab = 'tab1';\n        let voltage = 9; // Volts\n        let resistance = 50; // Ohms\n        let switchOn = true;\n        let compareMode = 'rheostat'; // 'rheostat' or 'potentiometer'\n        let wiperPos = 50; // percentage\n        let isWaterAnalogy = false;\n\n        // Canvas animation variables\n        let animationFrameId;\n        const electrons = [];\n        const numElectrons = 35;\n\n        // Initialize App\n        window.addEventListener('load', () => {\n            initElectronCanvas();\n            setupEventListeners();\n            updateAllCalculations();\n            renderModeDescription();\n        });\n\n        function switchTab(tabId) {\n            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));\n            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));\n\n            document.getElementById(tabId).classList.remove('hidden');\n            document.getElementById(`btn-${tabId}`).classList.add('active');\n            currentTab = tabId;\n\n            if (tabId === 'tab1') {\n                cancelAnimationFrame(animationFrameId);\n                animateElectrons();\n            }\n        }\n\n        function setupEventListeners() {\n            // Tab 1 Sliders\n            const vSlider = document.getElementById('voltageSlider');\n            const rSlider = document.getElementById('resistanceSlider');\n\n            vSlider.addEventListener('input', (e) => {\n                voltage = parseFloat(e.target.value);\n                document.getElementById('voltageVal').innerText = `${voltage} V`;\n                updateAllCalculations();\n            });\n\n            rSlider.addEventListener('input', (e) => {\n                resistance = parseFloat(e.target.value);\n                document.getElementById('resistanceVal').innerText = `${resistance} Ω`;\n                updateAllCalculations();\n            });\n\n            // Tab 3 Wiper Slider\n            const wSlider = document.getElementById('wiperSlider');\n            wSlider.addEventListener('input', (e) => {\n                wiperPos = parseFloat(e.target.value);\n                document.getElementById('wiperPosVal').innerText = `${wiperPos}%`;\n                updateRheostatVisuals();\n            });\n        }\n\n        function initElectronCanvas() {\n            const canvas = document.getElementById('electronCanvas');\n            const ctx = canvas.getContext('2d');\n\n            // Responsive canvas resolution\n            canvas.width = canvas.parentElement.clientWidth;\n            canvas.height = canvas.parentElement.clientHeight;\n\n            electrons.length = 0;\n            for (let i = 0; i \u003c numElectrons; i++) {\n                electrons.push({\n                    x: Math.random() * canvas.width,\n                    y: 40 + Math.random() * (canvas.height - 80),\n                    vx: 1 + Math.random() * 2,\n                    radius: 5\n                });\n            }\n\n            animateElectrons();\n        }\n\n        function animateElectrons() {\n            const canvas = document.getElementById('electronCanvas');\n            if (!canvas) return;\n            const ctx = canvas.getContext('2d');\n\n            ctx.clearRect(0, 0, canvas.width, canvas.height);\n\n            const current = voltage / resistance; // Amperes\n            const speedMultiplier = Math.min(Math.max(current * 8, 0.5), 15);\n\n            // Resistor Zone boundaries\n            const rLeft = canvas.width * 0.35;\n            const rRight = canvas.width * 0.65;\n            const rWidth = rRight - rLeft;\n\n            // Draw Wire background\n            ctx.fillStyle = '#1e293b';\n            ctx.fillRect(0, canvas.height / 2 - 40, canvas.width, 80);\n\n            // Draw Resistor Lattice Box\n            ctx.fillStyle = '#334155';\n            ctx.strokeStyle = '#3b82f6';\n            ctx.lineWidth = 3;\n            ctx.fillRect(rLeft, canvas.height / 2 - 50, rWidth, 100);\n            ctx.strokeRect(rLeft, canvas.height / 2 - 50, rWidth, 100);\n\n            // Draw Atomic Lattice inside Resistor (Red Nodes)\n            const rows = 4;\n            const cols = Math.floor(resistance / 15) + 3;\n            ctx.fillStyle = '#ef4444';\n\n            for (let r = 0; r \u003c rows; r++) {\n                for (let c = 0; c \u003c cols; c++) {\n                    const lx = rLeft + 20 + (c * (rWidth - 40) / Math.max(cols - 1, 1));\n                    const ly = (canvas.height / 2 - 35) + (r * 70 / (rows - 1));\n\n                    ctx.beginPath();\n                    ctx.arc(lx, ly, 6, 0, Math.PI * 2);\n                    ctx.fill();\n\n                    // Collision glow / thermal vibration effect\n                    if (Math.random() \u003c current * 0.2) {\n                        ctx.strokeStyle = 'rgba(239, 68, 68, 0.5)';\n                        ctx.lineWidth = 2;\n                        ctx.stroke();\n                    }\n                }\n            }\n\n            // Move and render Electrons\n            electrons.forEach(e => {\n                let currentSpeed = speedMultiplier;\n\n                // Slow down inside resistor due to resistance\n                if (e.x >= rLeft && e.x \u003c= rRight) {\n                    currentSpeed *= Math.max(0.2, 100 / (resistance + 50));\n\n                    // Collision particle effect\n                    if (Math.random() \u003c 0.05) {\n                        ctx.fillStyle = '#f59e0b';\n                        ctx.fillRect(e.x + (Math.random() * 10 - 5), e.y + (Math.random() * 10 - 5), 3, 3);\n                    }\n                }\n\n                e.x += currentSpeed;\n                if (e.x > canvas.width) {\n                    e.x = 0;\n                    e.y = (canvas.height / 2 - 35) + Math.random() * 70;\n                }\n\n                // Render Electron\n                ctx.beginPath();\n                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);\n                ctx.fillStyle = '#38bdf8';\n                ctx.shadowColor = '#0284c7';\n                ctx.shadowBlur = 8;\n                ctx.fill();\n                ctx.shadowBlur = 0;\n            });\n\n            // Resistor Heat Pulsing Aura based on Power\n            const power = current * current * resistance;\n            const heatIntensity = Math.min(power / 10, 0.8);\n            ctx.fillStyle = `rgba(239, 68, 68, ${heatIntensity * 0.3})`;\n            ctx.fillRect(rLeft, canvas.height / 2 - 50, rWidth, 100);\n\n            if (currentTab === 'tab1') {\n                animationFrameId = requestAnimationFrame(animateElectrons);\n            }\n        }\n\n        function toggleWaterAnalogy() {\n            isWaterAnalogy = !isWaterAnalogy;\n            const waterDiv = document.getElementById('waterAnalogyContainer');\n            const btn = document.getElementById('toggleAnalogyBtn');\n\n            if (isWaterAnalogy) {\n                waterDiv.classList.remove('hidden');\n                waterDiv.classList.add('flex');\n                btn.classList.add('bg-indigo-600');\n            } else {\n                waterDiv.classList.add('hidden');\n                waterDiv.classList.remove('flex');\n                btn.classList.remove('bg-indigo-600');\n            }\n        }\n\n        function updateAllCalculations() {\n            const current = voltage / resistance; // Amperes\n            const power = current * current * resistance; // Watts\n\n            // Update Tab 1 Readouts\n            document.getElementById('displayU1').innerText = `${voltage.toFixed(1)} V`;\n            document.getElementById('displayR1').innerText = `${resistance} Ω`;\n            document.getElementById('displayI1').innerText = `${current.toFixed(2)} A`;\n            document.getElementById('displayP1').innerText = `${power.toFixed(2)} W`;\n\n            // Temperature gauge update\n            const temp = 25 + Math.min(power * 8, 85);\n            document.getElementById('tempValue').innerText = `${Math.round(temp)} °C`;\n            document.getElementById('tempBar').style.width = `${Math.min((temp - 20) * 1.1, 100)}%`;\n\n            // Update SVG Circuit (Tab 2)\n            document.getElementById('svgVoltmeterText').textContent = `${voltage.toFixed(1)} V`;\n            document.getElementById('svgResistorText').textContent = `R = ${resistance} Ω`;\n            document.getElementById('svgAmmeterText').textContent = switchOn ? `${current.toFixed(2)} A` : '0.00 A';\n\n            // Bulb Glow Effect\n            const bulbGlow = document.getElementById('bulbGlow');\n            if (switchOn) {\n                const glowOpacity = Math.min(current * 0.9, 1.0);\n                const glowRadius = 20 + current * 25;\n                bulbGlow.setAttribute('opacity', glowOpacity);\n                bulbGlow.setAttribute('r', glowRadius);\n            } else {\n                bulbGlow.setAttribute('opacity', '0');\n            }\n        }\n\n        function toggleSwitch() {\n            switchOn = !switchOn;\n            const btn = document.getElementById('switchBtn');\n            const arm = document.getElementById('switchArm');\n\n            if (switchOn) {\n                btn.className = 'px-3 py-1.5 text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg transition flex items-center gap-1.5';\n                btn.innerHTML = '\u003ci class=\"fa-solid fa-power-off\">\u003c/i> Kalit: YONIQ';\n                arm.setAttribute('x2', '23');\n                arm.setAttribute('y2', '0');\n            } else {\n                btn.className = 'px-3 py-1.5 text-xs font-bold bg-rose-600 hover:bg-rose-500 text-white rounded-lg transition flex items-center gap-1.5';\n                btn.innerHTML = '\u003ci class=\"fa-solid fa-power-off\">\u003c/i> Kalit: O\\'CHIQ';\n                arm.setAttribute('x2', '15');\n                arm.setAttribute('y2', '-25');\n            }\n            updateAllCalculations();\n        }\n\n        function setResistorPreset(rVal) {\n            resistance = rVal;\n            document.getElementById('resistanceSlider').value = rVal;\n            document.getElementById('resistanceVal').innerText = `${rVal} Ω`;\n            updateAllCalculations();\n        }\n\n        function recordDataRow() {\n            const current = (voltage / resistance).toFixed(2);\n            let brightness = 'O\\'rtacha';\n            if (current > 0.5) brightness = 'Juda Yorqin';\n            else if (current \u003c 0.1) brightness = 'Xira';\n\n            const tbody = document.getElementById('observationTableBody');\n            const newRow = document.createElement('tr');\n            newRow.className = 'border-b border-slate-800/40 text-slate-200 animate-fadeIn';\n            newRow.innerHTML = `\n                \u003ctd class=\"py-2 px-1 font-bold text-blue-400\">${resistance} Ω\u003c/td>\n                \u003ctd class=\"py-2 px-1 text-emerald-400\">${current} A\u003c/td>\n                \u003ctd class=\"py-2 px-1 text-amber-400\">${brightness}\u003c/td>\n            `;\n            tbody.prepend(newRow);\n        }\n\n        function setCompareMode(mode) {\n            compareMode = mode;\n            const rBtn = document.getElementById('modeRheostatBtn');\n            const pBtn = document.getElementById('modePotentiometerBtn');\n            const badge = document.getElementById('modeBadge');\n\n            if (mode === 'rheostat') {\n                rBtn.className = 'px-4 py-2 text-xs font-bold rounded-lg bg-blue-600 text-white transition';\n                pBtn.className = 'px-4 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition';\n                badge.className = 'px-3 py-1 text-xs font-bold bg-blue-500/20 text-blue-400 border border-blue-500/30 rounded-full';\n                badge.innerText = 'Reostat (Tokni boshqarish - 2 ta terminal)';\n            } else {\n                pBtn.className = 'px-4 py-2 text-xs font-bold rounded-lg bg-indigo-600 text-white transition';\n                rBtn.className = 'px-4 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition';\n                badge.className = 'px-3 py-1 text-xs font-bold bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 rounded-full';\n                badge.innerText = 'Potensiometr (Kuchlanish bo\\'lgich - 3 ta terminal)';\n            }\n\n            renderModeDescription();\n            updateRheostatVisuals();\n        }\n\n        function updateRheostatVisuals() {\n            const wiperGroup = document.getElementById('wiperGroup');\n            const activeRect = document.getElementById('activeCoilRect');\n            const lengthLine = document.getElementById('lengthLine');\n            const lengthText = document.getElementById('lengthText');\n            const glow = document.getElementById('rheoBulbGlow');\n\n            // Map wiperPos (0 - 100%) to SVG coordinates (80 to 420px)\n            const minX = 80;\n            const maxX = 420;\n            const currentX = minX + (wiperPos / 100) * (maxX - minX);\n\n            wiperGroup.setAttribute('transform', `translate(${currentX}, 0)`);\n            activeRect.setAttribute('width', currentX - minX);\n\n            lengthLine.setAttribute('x2', currentX);\n            lengthText.setAttribute('x', minX + (currentX - minX) / 2);\n            lengthText.textContent = `Uzunlik L = ${Math.round(wiperPos)}%`;\n\n            // Adjust glow intensity depending on mode\n            if (compareMode === 'rheostat') {\n                // Higher wiperPos = higher length = higher resistance = darker bulb\n                const rheoRes = (wiperPos / 100) * 100 + 10;\n                const rheoCurrent = 12 / rheoRes;\n                glow.setAttribute('opacity', Math.min(rheoCurrent, 1.0));\n            } else {\n                // Potentiometer mode: output voltage depends directly on position ratio\n                const vOut = (wiperPos / 100) * 12;\n                glow.setAttribute('opacity', vOut / 12);\n            }\n        }\n\n        function renderModeDescription() {\n            const container = document.getElementById('modeDescription');\n            if (compareMode === 'rheostat') {\n                container.innerHTML = `\n                    \u003ch4 class=\"font-bold text-blue-400 mb-1\">Reostat Ishlash Prinsipi (2-terminal):\u003c/h4>\n                    \u003cp class=\"leading-relaxed\">\n                        Reostat zanjirga ketma-ket ulanadi. Surgich harakatlanganda tok o'tayotgan simning uzunligi $L$ o'zgaradi:\n                        \u003cstrong class=\"text-amber-400\">$R = \\\\rho \\\\frac{L}{S}$\u003c/strong>.\n                        Uzunlik $L$ ortsa, qarshilik $R$ ortadi va zanjirdagi tok kuchi $I$ kamayadi.\n                    \u003c/p>\n                `;\n            } else {\n                container.innerHTML = `\n                    \u003ch4 class=\"font-bold text-indigo-400 mb-1\">Potensiometr Ishlash Prinsipi (3-terminal):\u003c/h4>\n                    \u003cp class=\"leading-relaxed\">\n                        Potensiometr 3 ta kontaktga ega va kuchlanish bo'lgich sifatida ishlaydi. Chiqish kuchlanishi:\n                        \u003cstrong class=\"text-emerald-400\">$U_{\\\\text{chiqish}} = U_{\\\\text{kirish}} \\\\times \\\\frac{R_1}{R_{\\\\text{umumiy}}}$\u003c/strong>.\n                        Surgich surilganda kuchlanish $0\\\\text{V}$ dan $12\\\\text{V}$ gacha silliq o'zgaradi!\n                    \u003c/p>\n                `;\n            }\n        }\n\n        function checkChallenge() {\n            const vInput = parseFloat(document.getElementById('quizVoltageInput').value);\n            const rInput = parseFloat(document.getElementById('quizResistorInput').value);\n            const feedback = document.getElementById('quizFeedback');\n\n            feedback.classList.remove('hidden', 'bg-emerald-950/60', 'border-emerald-500', 'bg-rose-950/60', 'border-rose-500');\n\n            if (vInput === 6 && rInput === 30) {\n                feedback.className = 'mt-3 p-3 rounded-xl text-xs bg-emerald-950/60 border border-emerald-500 text-emerald-200 block';\n                feedback.innerHTML = `\n                    \u003cdiv class=\"font-bold flex items-center gap-1.5 text-emerald-400\">\n                        \u003ci class=\"fa-solid fa-circle-check\">\u003c/i> Barakalla! To'g'ri javob!\n                    \u003c/div>\n                    \u003cp class=\"mt-1\">$U_R = 12\\\\text{V} - 6\\\\text{V} = 6\\\\text{V}$ va $R = \\\\frac{6\\\\text{V}}{0.2\\\\text{A}} = 30\\\\,\\\\Omega$. Siz LEDni yonib ketishdan saqlab qoldingiz!\u003c/p>\n                `;\n            } else {\n                feedback.className = 'mt-3 p-3 rounded-xl text-xs bg-rose-950/60 border border-rose-500 text-rose-200 block';\n                feedback.innerHTML = `\n                    \u003cdiv class=\"font-bold flex items-center gap-1.5 text-rose-400\">\n                        \u003ci class=\"fa-solid fa-circle-xmark\">\u003c/i> Xatolik bor! Qaytadan urinib ko'ring.\n                    \u003c/div>\n                    \u003cp class=\"mt-1\">Eslatma: Ortiqcha kuchlanish $12 - 6 = 6\\\\text{V}$. Rezistor $R = \\\\frac{6}{0.2} = 30\\\\,\\\\Omega$ bo'lishi kerak.\u003c/p>\n                `;\n            }\n        }\n\n        // Handle Window Resize for responsive Canvas\n        window.addEventListener('resize', () => {\n            const canvas = document.getElementById('electronCanvas');\n            if (canvas) {\n                canvas.width = canvas.parentElement.clientWidth;\n                canvas.height = canvas.parentElement.clientHeight;\n            }\n        });\n    \u003c/script>\n\u003c/body>\n\u003c/html>"}, {"title": "Zanjirning bir qismi uchun Om qonuni", "icon": "Ω", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Zanjirning bir qismi uchun Om qonuni\u003c/title>\n\u003cstyle>\n:root{--bg:#f6f8fb;--card:#fff;--fg:#14213d;--mut:#6b7a90;--bd:#d5dde8;--I:#e8590c;--U:#1c7ed6;--R:#2f9e44;--e:#7048e8;--ok:#2b8a3e;--bad:#c92a2a;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0e1621;--card:#17222f;--fg:#e8eef6;--mut:#92a3b8;--bd:#2c3b4d;--I:#ff922b;--U:#4dabf7;--R:#69db7c;--e:#b197fc;--ok:#69db7c;--bad:#ff8787}}\n:root[data-theme=\"dark\"]{--bg:#0e1621;--card:#17222f;--fg:#e8eef6;--mut:#92a3b8;--bd:#2c3b4d;--I:#ff922b;--U:#4dabf7;--R:#69db7c;--e:#b197fc;--ok:#69db7c;--bad:#ff8787}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--fg);font:18px/1.55 \"Trebuchet MS\",Verdana,sans-serif}\nheader{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:3px solid var(--I)}\nh1{font-size:1.4rem;margin:0}\nh2{margin:.2em 0 .4em}h3{margin:.3em 0}\nbutton{font:inherit;color:var(--fg);background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:8px 14px;min-height:46px;cursor:pointer}\nbutton:focus-visible,input:focus-visible{outline:3px solid var(--U);outline-offset:2px}\nnav{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px}\nnav button.on{background:var(--U);color:#fff;border-color:var(--U)}\nmain{max-width:1100px;margin:0 auto;padding:0 18px 40px}\n.sec{display:none}.sec.on{display:block}\n.card{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:14px 18px;margin:14px 0}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}\ncanvas{width:100%;height:auto;display:block;background:var(--bg);border-radius:10px}\ntable{border-collapse:collapse;width:100%;text-align:center}td,th{border:1px solid var(--bd);padding:2px 8px}\n.ci{color:var(--I)}.cu{color:var(--U)}.cr{color:var(--R)}\nlabel{display:block;margin-top:8px;font-weight:bold}\ninput[type=range]{width:100%;height:36px}\ninput[type=text]{font:inherit;padding:8px;width:8em;border:2px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}\n.big{font-size:1.5rem;text-align:center;margin:8px}\n.tri{display:flex;flex-direction:column;align-items:center;gap:4px}\n.tri div{display:flex;gap:10px;border-top:3px solid var(--fg);padding-top:6px}\n.tri button{width:64px;font-size:1.3rem;font-weight:bold}\n.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}\n.opt{display:block;width:100%;text-align:left;margin:6px 0}\n.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,transparent)}\n.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,transparent)}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\u003ch1>Zanjirning bir qismi uchun Om qonuni\u003c/h1>\n\u003cspan>\u003cbutton id=\"pz\">⏸ To‘xtatish\u003c/button> \u003cbutton id=\"th\">🌓 Rejim\u003c/button>\u003c/span>\u003c/header>\n\u003cnav id=\"tabs\">\u003cbutton data-t=\"s1\" class=\"on\">1. Mazmuni\u003c/button>\u003cbutton data-t=\"s2\">2. Bog‘lanish\u003c/button>\u003cbutton data-t=\"s3\">3. Masalalar\u003c/button>\u003cbutton data-t=\"s4\">Test\u003c/button>\u003c/nav>\n\u003cmain>\n\n\u003csection class=\"sec on\" id=\"s1\">\n\u003cdiv class=\"card\">\u003ch2>Om qonuning mazmuni\u003c/h2>\n\u003cp>Zanjir bo‘lagidagi \u003cb class=\"ci\">tok kuchi\u003c/b> shu bo‘lakka berilgan \u003cb class=\"cu\">kuchlanishga\u003c/b> to‘g‘ri proporsional va bo‘lakning \u003cb class=\"cr\">qarshiligiga\u003c/b> teskari proporsional.\u003c/p>\n\u003cp>\u003cb>Fizik ma’nosi:\u003c/b> kuchlanish elektronlarni haydaydi, qarshilik esa ularning harakatiga to‘sqinlik qiladi (elektronlar ion panjara bilan to‘qnashadi). Kuchlanish katta bo‘lsa elektronlar tezroq oqadi, qarshilik katta bo‘lsa sekinroq.\u003c/p>\n\u003cp>\u003cb>Georg Om\u003c/b> (1789–1854) – nemis fizigi. U 1826-yilda tok kuchi, kuchlanish va qarshilik orasidagi bog‘lanishni tajribada aniqladi. Qarshilik birligi uning nomi bilan Om (Ω) deb ataladi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ccanvas id=\"c1\" width=\"640\" height=\"300\">\u003c/canvas>\n\u003clabel>Kuchlanish U: \u003cb class=\"cu\" id=\"u1o\">\u003c/b>\u003cinput type=\"range\" id=\"u1\" min=\"0\" max=\"12\" step=\"1\" value=\"6\">\u003c/label>\n\u003clabel>Qarshilik R: \u003cb class=\"cr\" id=\"r1o\">\u003c/b>\u003cinput type=\"range\" id=\"r1\" min=\"1\" max=\"10\" step=\"1\" value=\"3\">\u003c/label>\n\u003cdiv class=\"big\" id=\"ro1\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s2\">\n\u003cdiv class=\"grid\">\n\u003cdiv class=\"card\">\u003ch3>A. R = 4 Ω o‘zgarmas, U o‘zgaradi\u003c/h3>\n\u003ccanvas id=\"cA\" width=\"640\" height=\"300\">\u003c/canvas>\n\u003clabel>U: \u003cb class=\"cu\" id=\"uao\">\u003c/b>\u003cinput type=\"range\" id=\"ua\" min=\"0\" max=\"12\" step=\"1\" value=\"4\">\u003c/label>\n\u003ccanvas id=\"gA\" width=\"640\" height=\"300\">\u003c/canvas>\u003ctable id=\"tA\">\u003c/table>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>B. U = 12 V o‘zgarmas, R o‘zgaradi\u003c/h3>\n\u003ccanvas id=\"cB\" width=\"640\" height=\"300\">\u003c/canvas>\n\u003clabel>R: \u003cb class=\"cr\" id=\"rbo\">\u003c/b>\u003cinput type=\"range\" id=\"rb\" min=\"1\" max=\"12\" step=\"1\" value=\"4\">\u003c/label>\n\u003ccanvas id=\"gB\" width=\"640\" height=\"300\">\u003c/canvas>\u003ctable id=\"tB\">\u003c/table>\u003c/div>\u003c/div>\n\u003cdiv class=\"card big\">\u003cb>U ortsa, I ortadi. R ortsa, I kamayadi.\u003c/b>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s3\">\n\u003cdiv class=\"card\">\u003ch2>Formula\u003c/h2>\n\u003cdiv class=\"big\">\u003cb class=\"ci\">I\u003c/b> = \u003cb class=\"cu\">U\u003c/b> / \u003cb class=\"cr\">R\u003c/b> &nbsp; → &nbsp; \u003cb class=\"cu\">U\u003c/b> = \u003cb class=\"ci\">I\u003c/b> · \u003cb class=\"cr\">R\u003c/b> &nbsp; → &nbsp; \u003cb class=\"cr\">R\u003c/b> = \u003cb class=\"cu\">U\u003c/b> / \u003cb class=\"ci\">I\u003c/b>\u003c/div>\n\u003cdiv class=\"grid\">\u003cdiv>\u003cp>Formula uchburchagi: kerakli kattalikni bosing.\u003c/p>\n\u003cdiv class=\"tri\">\u003cbutton data-k=\"U\" class=\"cu\">U\u003c/button>\u003cdiv>\u003cbutton data-k=\"I\" class=\"ci\">I\u003c/button>\u003cbutton data-k=\"R\" class=\"cr\">R\u003c/button>\u003c/div>\u003c/div>\n\u003cdiv class=\"big\" id=\"trf\">I = U / R\u003c/div>\u003c/div>\n\u003cdiv>\u003cp>\u003cb>Birliklar:\u003c/b> tok kuchi – amper (A), kuchlanish – volt (V), qarshilik – om (Ω).\u003c/p>\n\u003cp>1 mA = 0,001 A &nbsp; 1 kV = 1000 V &nbsp; 1 kΩ = 1000 Ω\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch2>Masala generatori\u003c/h2>\n\u003cp id=\"pt\" class=\"big\">\u003c/p>\n\u003cp>Javob: \u003cinput type=\"text\" id=\"ans\" inputmode=\"decimal\"> \u003cspan id=\"pu\">\u003c/span>\u003c/p>\n\u003cbutton id=\"chk\">Tekshirish\u003c/button> \u003cbutton id=\"gen\">Yangi masala\u003c/button>\n\u003cdiv id=\"sol\">\u003c/div>\u003c/div>\n\u003cdiv class=\"grid\">\n\u003cdiv class=\"card\">\u003ch3>Namuna 1: I ni topish\u003c/h3>\u003ccanvas id=\"e1\" width=\"640\" height=\"300\">\u003c/canvas>\n\u003cp>\u003cb>Berilgan:\u003c/b> U = 12 V, R = 6 Ω\u003cbr>\u003cb>Formula:\u003c/b> I = U / R\u003cbr>\u003cb>Hisoblash:\u003c/b> I = 12 / 6\u003cbr>\u003cb>Javob:\u003c/b> \u003cb class=\"ci\">I = 2 A\u003c/b>\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Namuna 2: R ni topish\u003c/h3>\u003ccanvas id=\"e2\" width=\"640\" height=\"300\">\u003c/canvas>\n\u003cp>\u003cb>Berilgan:\u003c/b> U = 20 V, I = 4 A\u003cbr>\u003cb>Formula:\u003c/b> R = U / I\u003cbr>\u003cb>Hisoblash:\u003c/b> R = 20 / 4\u003cbr>\u003cb>Javob:\u003c/b> \u003cb class=\"cr\">R = 5 Ω\u003c/b>\u003c/p>\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s4\">\u003cdiv id=\"test\">\u003c/div>\u003cdiv class=\"card big\" id=\"res\">\u003c/div>\u003c/section>\n\u003c/main>\n\n\u003cscript>\n// ===== Yordamchi =====\nconst $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];\nconst css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nconst v=id=>+$(id).value,f=x=>+(+x).toFixed(2),fs=x=>String(f(x)).replace('.',',');\nlet paused=false;const sims=[];\nconst mk=(id,get)=>sims.push({cv:$(id),get,ph:0});\n\n// ===== Zanjir chizish (elektronlar oqimi bilan) =====\nfunction pt(s,x0,y0,x1,y1){const w=x1-x0,h=y1-y0;let d=((s%1)+1)%1*2*(w+h);\n if(d\u003cw)return[x0+d,y0];d-=w;if(d\u003ch)return[x1,y0+d];d-=h;if(d\u003cw)return[x1-d,y1];d-=w;return[x0,y1-d];}\nfunction draw(s){\n const{U,R}=s.get(),I=U/R,c=s.cv.getContext('2d'),W=640,H=300;\n const x0=50,x1=W-50,y0=100,y1=H-30,cx=W/2,my=(y0+y1)/2,bg=css('--bg'),fg=css('--fg');\n c.clearRect(0,0,W,H);c.lineWidth=3;c.strokeStyle=fg;c.fillStyle=fg;c.font='bold 18px sans-serif';\n c.strokeRect(x0,y0,x1-x0,y1-y0);\n // voltmetr simlari\n c.beginPath();c.moveTo(cx-60,y0);c.lineTo(cx-60,40);c.lineTo(cx-20,40);c.moveTo(cx+60,y0);c.lineTo(cx+60,40);c.lineTo(cx+20,40);c.stroke();\n // elektronlar\n c.fillStyle=css('--e');\n for(let i=0;i\u003c24;i++){let[x,y]=pt(i/24+s.ph,x0,y0,x1,y1);\n  if(y===y0&&Math.abs(x-cx)\u003c60)y+=(Math.random()-.5)*R*1.3;\n  c.beginPath();c.arc(x,y,5,0,7);c.fill();}\n // batareya\n c.fillStyle=bg;c.fillRect(x0-20,my-22,40,44);c.strokeStyle=css('--U');c.lineWidth=4;\n c.beginPath();c.moveTo(x0-18,my-9);c.lineTo(x0+18,my-9);c.stroke();\n c.lineWidth=7;c.beginPath();c.moveTo(x0-9,my+9);c.lineTo(x0+9,my+9);c.stroke();\n c.fillStyle=css('--U');c.fillText('+',x0+24,my-8);c.fillText('U',x0+24,my+22);\n // rezistor\n c.strokeStyle=css('--R');c.lineWidth=4;c.strokeRect(cx-60,y0-18,120,36);\n c.fillStyle=css('--mut');const n=3+Math.round(R);\n for(let i=0;i\u003cn;i++){c.beginPath();c.arc(cx-50+i*100/(n-1)+(Math.random()-.5)*3,y0+(i%2?8:-8)+(Math.random()-.5)*3,4,0,7);c.fill();}\n c.fillStyle=css('--R');c.textAlign='center';c.fillText('R = '+fs(R)+' Ω',cx,y0+44);\n // ampermetr\n c.fillStyle=bg;c.strokeStyle=css('--I');c.beginPath();c.arc(x1,my,22,0,7);c.fill();c.stroke();\n c.fillStyle=css('--I');c.fillText('A',x1,my+6);c.textAlign='right';c.fillText(fs(I)+' A',x1-30,my+6);\n // voltmetr\n c.fillStyle=bg;c.strokeStyle=css('--U');c.beginPath();c.arc(cx,40,20,0,7);c.fill();c.stroke();\n c.fillStyle=css('--U');c.textAlign='center';c.fillText('V',cx,46);c.textAlign='left';c.fillText(fs(U)+' V',cx+28,46);\n c.textAlign='start';s.I=I;\n}\nmk('#c1',()=>({U:v('#u1'),R:v('#r1')}));\nmk('#cA',()=>({U:v('#ua'),R:4}));\nmk('#cB',()=>({U:12,R:v('#rb')}));\nmk('#e1',()=>({U:12,R:6}));\nmk('#e2',()=>({U:20,R:5}));\nlet last=0;\nfunction frame(t){const dt=Math.min((t-last)/1000,.1);last=t;\n sims.forEach(s=>{if(!s.cv.offsetParent)return;draw(s);if(!paused)s.ph-=.04*Math.min(s.I,10)*dt;});\n requestAnimationFrame(frame);}\n\n// ===== Grafik =====\nfunction chart(id,fn,a,x,xm,ym,xl,yl,col){\n const c=$(id).getContext('2d'),W=640,H=300,L=55,B=40,T=16,Rr=16;\n const X=q=>L+q/xm*(W-L-Rr),Y=q=>H-B-q/ym*(H-B-T);\n c.clearRect(0,0,W,H);c.strokeStyle=css('--mut');c.fillStyle=css('--fg');c.lineWidth=1;c.font='15px sans-serif';\n for(let i=0;i\u003c=4;i++){c.beginPath();c.moveTo(X(xm*i/4),T);c.lineTo(X(xm*i/4),H-B);c.moveTo(L,Y(ym*i/4));c.lineTo(W-Rr,Y(ym*i/4));c.globalAlpha=.3;c.stroke();c.globalAlpha=1;\n  c.fillText(f(xm*i/4),X(xm*i/4)-8,H-B+18);c.fillText(f(ym*i/4),8,Y(ym*i/4)+5);}\n c.lineWidth=2;c.beginPath();c.moveTo(L,T);c.lineTo(L,H-B);c.lineTo(W-Rr,H-B);c.stroke();\n c.fillText(xl,W-Rr-80,H-6);c.fillText(yl,L+6,T+12);\n const col2=css(col);c.strokeStyle=col2;\n [[xm,.25,2],[x,1,5]].forEach(([e,al,lw])=>{c.globalAlpha=al;c.lineWidth=lw;c.beginPath();\n  for(let q=a;q\u003c=e+1e-9;q+=.1)c[q===a?'moveTo':'lineTo'](X(q),Y(fn(q)));c.stroke();});\n c.globalAlpha=1;c.fillStyle=col2;c.beginPath();c.arc(X(x),Y(fn(x)),7,0,7);c.fill();\n}\nfunction tbl(id,h,rows){$(id).innerHTML='\u003ctr>\u003cth>'+h[0]+'\u003c/th>\u003cth>'+h[1]+'\u003c/th>\u003c/tr>'+rows.map((r,i)=>`\u003ctr${i==rows.length-1?' style=\"font-weight:bold\"':''}>\u003ctd>${r[0]}\u003c/td>\u003ctd>${fs(r[1])}\u003c/td>\u003c/tr>`).join('');}\nfunction refresh(){\n const u1=v('#u1'),r1=v('#r1');$('#u1o').textContent=u1+' V';$('#r1o').textContent=r1+' Ω';\n $('#ro1').innerHTML=`I = U / R = ${u1} / ${r1} = \u003cb class=\"ci\">${fs(u1/r1)} A\u003c/b>`;\n const ua=v('#ua'),rb=v('#rb');$('#uao').textContent=ua+' V';$('#rbo').textContent=rb+' Ω';\n let ra=[];for(let u=0;u\u003cua;u+=2)ra.push([u,u/4]);ra.push([ua,ua/4]);\n tbl('#tA',['U (V)','I (A)'],ra);\n let rr=[];[1,2,3,4,6,12].forEach(r=>{if(r\u003crb)rr.push([r,12/r])});rr.push([rb,12/rb]);\n tbl('#tB',['R (Ω)','I (A)'],rr);\n chart('#gA',u=>u/4,0,ua,12,3,'U, V','I, A','--I');\n chart('#gB',r=>12/r,1,rb,12,12,'R, Ω','I, A','--I');\n}\n$$('input[type=range]').forEach(e=>e.oninput=refresh);\n\n// ===== Boshqaruv =====\n$$('#tabs button').forEach(b=>b.onclick=()=>{$$('#tabs button').forEach(x=>x.classList.toggle('on',x==b));$$('.sec').forEach(s=>s.classList.toggle('on',s.id==b.dataset.t));});\n$('#pz').onclick=()=>{paused=!paused;$('#pz').textContent=paused?'▶ Davom ettirish':'⏸ To‘xtatish';};\n$('#th').onclick=()=>{const d=document.documentElement,dark=css('--bg')==='#0e1621';d.dataset.theme=dark?'light':'dark';refresh();};\n\n// ===== Formula uchburchagi =====\nconst tf={U:'U = I · R',I:'I = U / R',R:'R = U / I'};\n$$('.tri button').forEach(b=>b.onclick=()=>{$('#trf').textContent=tf[b.dataset.k];});\n\n// ===== Masala generatori =====\nlet P;const pick=a=>a[Math.floor(Math.random()*a.length)];\nfunction gen(){const R=pick([2,3,4,5,6,8,10]),I=pick([1,2,3,4,5,6]),U=I*R,t=pick(['I','U','R']);P={t,U,I,R};\n const g={I:`U = ${U} V, R = ${R} Ω. I = ?`,U:`I = ${I} A, R = ${R} Ω. U = ?`,R:`U = ${U} V, I = ${I} A. R = ?`};\n $('#pt').textContent=g[t];$('#pu').textContent={I:'A',U:'V',R:'Ω'}[t];$('#ans').value='';$('#sol').innerHTML='';}\n$('#gen').onclick=gen;\n$('#chk').onclick=()=>{const a=parseFloat($('#ans').value.replace(',','.')),{t,U,I,R}=P,ok=Math.abs(a-P[t])\u003c1e-6;\n const s={I:[`U = ${U} V, R = ${R} Ω`,'I = U / R',`I = ${U} / ${R}`,`I = ${I} A`],\n  U:[`I = ${I} A, R = ${R} Ω`,'U = I · R',`U = ${I} · ${R}`,`U = ${U} V`],\n  R:[`U = ${U} V, I = ${I} A`,'R = U / I',`R = ${U} / ${I}`,`R = ${R} Ω`]}[t];\n $('#sol').innerHTML=`\u003cp class=\"${ok?'ok':'bad'}\">${ok?'To‘g‘ri! ✔':'Noto‘g‘ri ✘'}\u003c/p>\u003cp>\u003cb>Berilgan:\u003c/b> ${s[0]}\u003cbr>\u003cb>Formula:\u003c/b> ${s[1]}\u003cbr>\u003cb>Hisoblash:\u003c/b> ${s[2]}\u003cbr>\u003cb>Javob:\u003c/b> ${s[3]}\u003c/p>`;};\n\n// ===== Test =====\nconst Q=[\n['Om qonuni formulasi qaysi?',['I = U · R','I = R / U','I = U / R','I = U + R'],2,'Tok kuchi kuchlanishga to‘g‘ri, qarshilikka teskari proporsional: I = U / R.'],\n['R o‘zgarmas bo‘lib, U ortsa, tok kuchi qanday o‘zgaradi?',['Ortadi','Kamayadi','O‘zgarmaydi','Nolga teng bo‘ladi'],0,'I = U / R, U ortsa I ham ortadi (I(U) – to‘g‘ri chiziq).'],\n['U o‘zgarmas, R 2 marta oshsa, tok kuchi...',['2 marta ortadi','2 marta kamayadi','o‘zgarmaydi','4 marta kamayadi'],1,'I = U / R, maxraj 2 marta oshsa, I 2 marta kamayadi.'],\n['I = 3 A, R = 4 Ω bo‘lsa, U nechaga teng?',['0,75 V','7 V','1,33 V','12 V'],3,'U = I · R = 3 · 4 = 12 V.'],\n['U = 24 V, I = 6 A bo‘lsa, R nechaga teng?',['4 Ω','144 Ω','0,25 Ω','18 Ω'],0,'R = U / I = 24 / 6 = 4 Ω.']];\nfunction renderTest(){let sc=0,dn=0;const T=$('#test');T.innerHTML='';$('#res').textContent='';\n Q.forEach((q,i)=>{const d=document.createElement('div');d.className='card';\n  d.innerHTML=`\u003ch3>${i+1}. ${q[0]}\u003c/h3>`+q[1].map((o,j)=>`\u003cbutton class=\"opt\" data-j=\"${j}\">${'ABCD'[j]}) ${o}\u003c/button>`).join('')+'\u003cp class=\"ex\">\u003c/p>';\n  d.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(d.dataset.d)return;d.dataset.d=1;dn++;const j=+b.dataset.j,ok=j==q[2];if(ok)sc++;\n   b.classList.add(ok?'right':'wrong');d.querySelectorAll('.opt')[q[2]].classList.add('right');\n   d.querySelector('.ex').innerHTML=`\u003cb class=\"${ok?'ok':'bad'}\">${ok?'To‘g‘ri!':'Noto‘g‘ri.'}\u003c/b> ${q[3]}`;\n   if(dn==Q.length)$('#res').innerHTML=`Natija: \u003cb>${sc} / ${Q.length}\u003c/b> \u003cbr>\u003cbutton id=\"rt\">Qayta boshlash\u003c/button>`,$('#rt').onclick=renderTest;});\n  T.appendChild(d);});}\nrenderTest();gen();refresh();requestAnimationFrame(frame);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}]</script>
<script>
(function(){
  var T=JSON.parse(document.getElementById('d').textContent);
  var stage=document.getElementById('stage'),home=document.getElementById('home');
  var list=document.getElementById('list'),cards=document.getElementById('cards');
  var side=document.getElementById('side'),shade=document.getElementById('shade'),burger=document.getElementById('burger');
  var frames={},btns=[];
  function item(icon,text,i){
    var b=document.createElement('button');
    var n=document.createElement('span');n.className='n';n.textContent=icon;
    var s=document.createElement('span');s.textContent=text;
    b.appendChild(n);b.appendChild(s);
    b.onclick=function(){go(i);toggle(false)};
    list.appendChild(b);btns[i]=b;
  }
  item('🏠','Bosh sahifa',0);
  T.forEach(function(t,k){
    item(t.icon,(k+1)+'. '+t.title,k+1);
    var c=document.createElement('button');c.className='card';
    c.innerHTML='<span class="e"></span><b></b><span></span>';
    c.children[0].textContent=t.icon;c.children[1].textContent=t.title;c.children[2].textContent=(k+1)+'-mavzu';
    c.onclick=function(){go(k+1)};cards.appendChild(c);
  });
  function toggle(open){
    side.classList.toggle('open',open);shade.classList.toggle('open',open);
    burger.setAttribute('aria-expanded',open);
  }
  burger.onclick=function(){toggle(true)};
  document.getElementById('close').onclick=function(){toggle(false)};
  shade.onclick=function(){toggle(false)};
  document.getElementById('brand').onclick=function(){go(0)};
  addEventListener('keydown',function(e){if(e.key==='Escape')toggle(false)});
  function go(i,noHash){
    if(i<0||i>T.length)i=0;
    if(i>0&&!frames[i]){
      var f=document.createElement('iframe');
      f.title=T[i-1].title;f.srcdoc=T[i-1].html;
      stage.appendChild(f);frames[i]=f;
    }
    home.classList.toggle('on',i===0);
    for(var k in frames)frames[k].classList.toggle('on',+k===i);
    btns.forEach(function(b,k){b.classList.toggle('on',k===i)});
    document.title=(i?T[i-1].title+' — ':'')+'Fizika 8-sinf';
    btns[i].scrollIntoView({block:'nearest'});
    if(!noHash)history.replaceState(null,'','#'+(i||'home'));
  }
  function fromHash(){var n=parseInt(location.hash.slice(1),10);return isNaN(n)?0:n}
  go(fromHash(),true);
  addEventListener('hashchange',function(){go(fromHash(),true)});
})();
</script>
