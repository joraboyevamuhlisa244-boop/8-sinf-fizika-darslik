 flex items-center gap-2\">\n                        \u003ci data-lucide=\"gauge\" class=\"w-4 h-4 text-emerald-400\">\u003c/i> Asboblar Ko'rsatgichi\n                    \u003c/h3>\n\n                    \u003cdiv class=\"grid grid-cols-2 gap-2 text-xs\">\n                        \u003c!-- Ampermetr Ko'rsatkichlari -->\n                        \u003cdiv class=\"bg-slate-900/80 p-2.5 rounded-xl border border-slate-700\">\n                            \u003cspan class=\"text-slate-400 block mb-0.5\">$I_{umumiy}$ (Umumiy tok)\u003c/span>\n                            \u003cspan id=\"read-i-total\" class=\"text-base font-bold text-emerald-400\">0.00 A\u003c/span>\n                        \u003c/div>\n                        \u003cdiv class=\"bg-slate-900/80 p-2.5 rounded-xl border border-slate-700\">\n                            \u003cspan class=\"text-slate-400 block mb-0.5\">$I_1$ (1-Tarmoq/L1)\u003c/span>\n                            \u003cspan id=\"read-i1\" class=\"text-base font-bold text-emerald-400\">0.00 A\u003c/span>\n                        \u003c/div>\n                        \u003cdiv class=\"bg-slate-900/80 p-2.5 rounded-xl border border-slate-700\">\n                            \u003cspan class=\"text-slate-400 block mb-0.5\">$I_2$ (2-Tarmoq/L2)\u003c/span>\n                            \u003cspan id=\"read-i2\" class=\"text-base font-bold text-emerald-400\">0.00 A\u003c/span>\n                        \u003c/div>\n                        \u003cdiv class=\"bg-slate-900/80 p-2.5 rounded-xl border border-slate-700\">\n                            \u003cspan class=\"text-slate-400 block mb-0.5\">$R_{umumiy}$ (Umumiy R)\u003c/span>\n                            \u003cspan id=\"read-r-total\" class=\"text-base font-bold text-amber-400\">20.0 Ω\u003c/span>\n                        \u003c/div>\n\n                        \u003c!-- Voltmetr Ko'rsatkichlari -->\n                        \u003cdiv class=\"bg-slate-900/80 p-2.5 rounded-xl border border-slate-700 col-span-2\">\n                            \u003cdiv class=\"flex justify-between items-center\">\n                                \u003cdiv>\n                                    \u003cspan class=\"text-slate-400 block\">$U_1$ (1-Lampochkadagi $U$)\u003c/span>\n                                    \u003cspan id=\"read-u1\" class=\"text-base font-bold text-cyan-400\">0.00 V\u003c/span>\n                                \u003c/div>\n                                \u003cdiv class=\"text-right\">\n                                    \u003cspan class=\"text-slate-400 block\">$U_2$ (2-Lampochkadagi $U$)\u003c/span>\n                                    \u003cspan id=\"read-u2\" class=\"text-base font-bold text-cyan-400\">0.00 V\u003c/span>\n                                \u003c/div>\n                            \u003c/div>\n                        \u003c/div>\n                    \u003c/div>\n\n                    \u003cdiv class=\"p-2.5 bg-amber-500/10 border border-amber-500/20 rounded-xl text-[11px] text-amber-300 leading-relaxed\">\n                        \u003ci data-lucide=\"info\" class=\"w-3.5 h-3.5 inline mr-1 -mt-0.5\">\u003c/i>\n                        Eslatma: Ampermetr o'lchash chegarasi \u003cstrong>3.0 A\u003c/strong>, Voltmetr o'lchash chegarasi \u003cstrong>15.0 V\u003c/strong>.\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n        \u003csection id=\"sec-guide\" class=\"hidden flex-1 space-y-6\">\n            \u003c!-- Mavzu va Maqsad -->\n            \u003cdiv class=\"bg-slate-800/60 rounded-2xl border border-slate-700/70 p-6 shadow-xl space-y-4\">\n                \u003cdiv class=\"flex items-center gap-3 border-b border-slate-700 pb-4\">\n                    \u003cdiv class=\"p-3 bg-indigo-500/20 text-indigo-400 rounded-xl\">\n                        \u003ci data-lucide=\"target\" class=\"w-6 h-6\">\u003c/i>\n                    \u003c/div>\n                    \u003cdiv>\n                        \u003ch2 class=\"text-xl font-bold text-white\">Laboratoriya Isbi: Ketma-ket va parallel ulangan elektr zanjirida tok kuchi hamda kuchlanishni o‘lchash\u003c/h2>\n                        \u003cp class=\"text-xs text-slate-400 mt-0.5\">8-sinf Fizika kuruynining elektr hodisalari bo'limi bo'yicha\u003c/p>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003cdiv class=\"grid md:grid-cols-2 gap-4 text-sm\">\n                    \u003cdiv class=\"bg-slate-900/60 p-4 rounded-xl border border-slate-700/60\">\n                        \u003ch4 class=\"font-semibold text-indigo-400 mb-2 flex items-center gap-1.5\">\n                            \u003ci data-lucide=\"flag\" class=\"w-4 h-4\">\u003c/i> Ishning maqsadi:\n                        \u003c/h4>\n                        \u003cp class=\"text-slate-300 text-xs leading-relaxed\">\n                            Elektr zanjirini yig‘ish ko‘nikmalarini shakllantirish. Ketma-ket va parallel ulangan zanjir qismlarida tok kuchi ($I$) hamda kuchlanish ($U$)ning taqsimlanish qonuniyatlarini tajribada tekshirish va Om qonunini amalda tasdiqlash.\n                        \u003c/p>\n                    \u003c/div>\n                    \u003cdiv class=\"bg-slate-900/60 p-4 rounded-xl border border-slate-700/60\">\n                        \u003ch4 class=\"font-semibold text-indigo-400 mb-2 flex items-center gap-1.5\">\n                            \u003ci data-lucide=\"box\" class=\"w-4 h-4\">\u003c/i> Kerakli jihoz va asboblar:\n                        \u003c/h4>\n                        \u003cp class=\"text-slate-300 text-xs leading-relaxed\">\n                            O‘zgarmas tok manbai (4.5–6 V), kalit, 2 ta har xil qarshilikka ega lampochka (yoki rezistorlar), laboratoriya ampermetri, laboratoriya voltmetri, ulagich simlar.\n                        \u003c/p>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n\n            \u003cdiv class=\"bg-slate-800/60 rounded-2xl border border-slate-700/70 p-6 shadow-xl space-y-4\">\n                \u003ch3 class=\"text-lg font-bold text-amber-400 flex items-center gap-2\">\n                    \u003ci data-lucide=\"shield-alert\" class=\"w-5 h-5\">\u003c/i> Laboratoriya ishini o‘tkazishning 10 ta asosiy sharti va xavfsizlik qoidalari\n                \u003c/h3>\n                \n                \u003cdiv class=\"grid md:grid-cols-2 gap-3 text-xs\">\n                    \u003cdiv class=\"flex gap-3 bg-slate-900/50 p-3 rounded-xl border border-slate-700/50\">\n                        \u003cspan class=\"w-6 h-6 rounded-lg bg-amber-500/20 text-amber-400 font-bold flex items-center justify-center shrink-0\">1\u003c/span>\n                        \u003cp class=\"text-slate-300\">Elektr zanjiri sxemasini to‘g‘ri tuzish va sxemadagi asboblarni belgilangan tartibda ulash.\u003c/p>\n                    \u003c/div>\n                    \u003cdiv class=\"flex gap-3 bg-slate-900/50 p-3 rounded-xl border border-slate-700/50\">\n                        \u003cspan class=\"w-6 h-6 rounded-lg bg-amber-500/20 text-amber-400 font-bold flex items-center justify-center shrink-0\">2\u003c/span>\n                        \u003cp class=\"text-slate-300\">Tok manbai, kalit, lampochka, ampermetr va voltmetr kabi asboblarni to'liq tayyorlab olish.\u003c/p>\n                    \u003c/div>\n                    \u003cdiv class=\"flex gap-3 bg-slate-900/50 p-3 rounded-xl border border-slate-700/50\">\n                        \u003cspan class=\"w-6 h-6 rounded-lg bg-amber-500/20 text-amber-400 font-bold flex items-center justify-center shrink-0\">3\u003c/span>\n                        \u003cp class=\"text-slate-300\">\u003cstrong class=\"text-white\">Ulash qoidasi:\u003c/strong> Ampermetrni zanjirga ketma-ket, voltmetrni esa o‘lchanayotgan qismga parallel ulash.\u003c/p>\n                    \u003c/div>\n                    \u003cdiv class=\"flex gap-3 bg-slate-900/50 p-3 rounded-xl border border-slate-700/50\">\n                        \u003cspan class=\"w-6 h-6 rounded-lg bg-amber-500/20 text-amber-400 font-bold flex items-center justify-center shrink-0\">4\u003c/span>\n                        \u003cp class=\"text-slate-300\">\u003cstrong class=\"text-white\">Xavfsizlik:\u003c/strong> Zanjirni yig‘ish va o‘zgartirishdan oldin kalitni albatta ochiq (o'chiq) holatda saqlash.\u003c/p>\n                    \u003c/div>\n                    \u003cdiv class=\"flex gap-3 bg-slate-900/50 p-3 rounded-xl border border-slate-700/50\">\n                        \u003cspan class=\"w-6 h-6 rounded-lg bg-amber-500/20 text-amber-400 font-bold flex items-center justify-center shrink-0\">5\u003c/span>\n                        \u003cp class=\"text-slate-300\">Zanjirning turli qismlaridagi tok kuchini ($I$) ampermetr yordamida navbati bilan o‘lchash.\u003c/p>\n                    \u003c/div>\n                    \u003cdiv class=\"flex gap-3 bg-slate-900/50 p-3 rounded-xl border border-slate-700/50\">\n                        \u003cspan class=\"w-6 h-6 rounded-lg bg-amber-500/20 text-amber-400 font-bold flex items-center justify-center shrink-0\">6\u003c/span>\n                        \u003cp class=\"text-slate-300\">Zanjirning turli qismlaridagi kuchlanishni ($U$) voltmetr yordamida anig'lik bilan o‘lchash.\u003c/p>\n                    \u003c/div>\n                    \u003cdiv class=\"flex gap-3 bg-slate-900/50 p-3 rounded-xl border border-slate-700/50\">\n                        \u003cspan class=\"w-6 h-6 rounded-lg bg-amber-500/20 text-amber-400 font-bold flex items-center justify-center shrink-0\">7\u003c/span>\n                        \u003cp class=\"text-slate-300\">O‘lchash natijalarini tartib bilan jadvalga yozib borish va ularni o‘zaro taqqoslash.\u003c/p>\n                    \u003c/div>\n                    \u003cdiv class=\"flex gap-3 bg-slate-900/50 p-3 rounded-xl border border-slate-700/50\">\n                        \u003cspan class=\"w-6 h-6 rounded-lg bg-amber-500/20 text-amber-400 font-bold flex items-center justify-center shrink-0\">8\u003c/span>\n                        \u003cp class=\"text-slate-300\">Tajriba davomida asboblarning o‘lchash chegarasidan (A va V) oshib ketmasligini nazorat qilish.\u003c/p>\n                    \u003c/div>\n                    \u003cdiv class=\"flex gap-3 bg-slate-900/50 p-3 rounded-xl border border-slate-700/50\">\n                        \u003cspan class=\"w-6 h-6 rounded-lg bg-amber-500/20 text-amber-400 font-bold flex items-center justify-center shrink-0\">9\u003c/span>\n                        \u003cp class=\"text-slate-300\">Ish yakunida olingan hisobiy natijalar va nazariy bilimlar asosida ilmiy xulosa chiqarish.\u003c/p>\n                    \u003c/div>\n                    \u003cdiv class=\"flex gap-3 bg-slate-900/50 p-3 rounded-xl border border-slate-700/50\">\n                        \u003cspan class=\"w-6 h-6 rounded-lg bg-amber-500/20 text-amber-400 font-bold flex items-center justify-center shrink-0\">10\u003c/span>\n                        \u003cp class=\"text-slate-300\">Laboratoriya ishini bajarishda elektr xavfsizligi qoidalariga qat’iy rioya qilish.\u003c/p>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Qadam-baqadam ko'rsatma -->\n            \u003cdiv class=\"bg-slate-800/60 rounded-2xl border border-slate-700/70 p-6 shadow-xl space-y-4\">\n                \u003ch3 class=\"text-lg font-bold text-white flex items-center gap-2\">\n                    \u003ci data-lucide=\"list-checks\" class=\"w-5 h-5 text-indigo-400\">\u003c/i> Ishni Bajarish Tartibi\n                \u003c/h3>\n\n                \u003cdiv class=\"space-y-4 text-xs text-slate-300\">\n                    \u003cdiv class=\"border-l-2 border-indigo-500 pl-4 py-1 space-y-1\">\n                        \u003ch4 class=\"font-bold text-slate-100 text-sm\">1-Qism: Ketma-ket ulashni tekshirish\u003c/h4>\n                        \u003col class=\"list-decimal list-inside space-y-1 text-slate-300\">\n                            \u003cli>Kalit ochiq holatda ikkita lampochkani ketma-ket ulash zanjirini yig‘ing.\u003c/li>\n                            \u003cli>Ampermetrni zanjirga ketma-ket ulab, $I_{um}$, $I_1$ va $I_2$ nuqtalardagi tok kuchini o'lchang.\u003c/li>\n                            \u003cli>Voltmetrni har bir lampochkaga parallel ulab, $U_1$ va $U_2$ kuchlanishlarni hamda umumiy $U_{um}$ kuchlanishni o'lchang.\u003c/li>\n                            \u003cli>$I_{um} = I_1 = I_2$ va $U_{um} = U_1 + U_2$ shart bajarilishini tekshiring.\u003c/li>\n                        \u003c/ol>\n                    \u003c/div>\n\n                    \u003cdiv class=\"border-l-2 border-emerald-500 pl-4 py-1 space-y-1\">\n                        \u003ch4 class=\"font-bold text-slate-100 text-sm\">2-Qism: Parallel ulashni tekshirish\u003c/h4>\n                        \u003col class=\"list-decimal list-inside space-y-1 text-slate-300\">\n                            \u003cli>Kalitni oching va zanjirni ikkita lampochka parallel ulanadigan qilib qayta yig'ing.\u003c/li>\n                            \u003cli>Voltmetr yordamida har bir tarmoq va umumiy zanjirning kuchlanishini o'lchang ($U_{um}, U_1, U_2$).\u003c/li>\n                            \u003cli>Ampermetrni asosiy tarmoqqa hamda har bir tarmoqqa ketma-ket ulab, $I_{um}, I_1, I_2$ tok kuchlarini aniqlang.\u003c/li>\n                            \u003cli>$U_{um} = U_1 = U_2$ va $I_{um} = I_1 + I_2$ munosabatni tasdiqlang.\u003c/li>\n                        \u003c/ol>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n        \u003csection id=\"sec-table\" class=\"hidden flex-1 space-y-6\">\n            \u003cdiv class=\"bg-slate-800/60 rounded-2xl border border-slate-700/70 p-6 shadow-xl space-y-6\">\n                \u003cdiv class=\"flex flex-wrap justify-between items-center gap-4\">\n                    \u003cdiv>\n                        \u003ch2 class=\"text-xl font-bold text-white\">O‘lchash Natijalari va Hisoblashlar\u003c/h2>\n                        \u003cp class=\"text-xs text-slate-400\">Simulyator ko'rsatkichlarini ushbu jadvalga kiriting va hisoblang\u003c/p>\n                    \u003c/div>\n                    \u003cbutton onclick=\"window.print()\" class=\"no-print flex items-center gap-2 px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-xs font-medium transition-all\">\n                        \u003ci data-lucide=\"printer\" class=\"w-4 h-4\">\u003c/i> Chop etish (Print)\n                    \u003c/button>\n                \u003c/div>\n\n                \u003c!-- 1-Jadval: Ketma-ket -->\n                \u003cdiv class=\"space-y-2\">\n                    \u003ch3 class=\"text-sm font-semibold text-indigo-400 flex items-center gap-2\">\n                        \u003ci data-lucide=\"git-commit\" class=\"w-4 h-4\">\u003c/i> 1-Jadval. Ketma-ket ulangan zanjir uchun\n                    \u003c/h3>\n                    \u003cdiv class=\"overflow-x-auto\">\n                        \u003ctable class=\"w-full text-xs text-left text-slate-300 border-collapse border border-slate-700\">\n                            \u003cthead class=\"bg-slate-900/80 text-slate-200\">\n                                \u003ctr>\n                                    \u003cth class=\"border border-slate-700 p-2.5 text-center\">T/r\u003c/th>\n                                    \u003cth class=\"border border-slate-700 p-2.5 text-center\">$U_{um}$ (V)\u003c/th>\n                                    \u003cth class=\"border border-slate-700 p-2.5 text-center\">$U_1$ (V)\u003c/th>\n                                    \u003cth class=\"border border-slate-700 p-2.5 text-center\">$U_2$ (V)\u003c/th>\n                                    \u003cth class=\"border border-slate-700 p-2.5 text-center\">$I_{um}$ (A)\u003c/th>\n                                    \u003cth class=\"border border-slate-700 p-2.5 text-center\">$R_1 = U_1/I$ (Ω)\u003c/th>\n                                    \u003cth class=\"border border-slate-700 p-2.5 text-center\">$R_2 = U_2/I$ (Ω)\u003c/th>\n                                    \u003cth class=\"border border-slate-700 p-2.5 text-center\">$R_{um} = R_1+R_2$\u003c/th>\n                                \u003c/tr>\n                            \u003c/thead>\n                            \u003ctbody>\n                                \u003ctr class=\"hover:bg-slate-700/30\">\n                                    \u003ctd class=\"border border-slate-700 p-2 text-center font-bold\">1\u003c/td>\n                                    \u003ctd class=\"border border-slate-700 p-2\">\u003cinput type=\"number\" placeholder=\"6.0\" class=\"w-full bg-transparent text-center outline-none text-indigo-300\">\u003c/td>\n                                    \u003ctd class=\"border border-slate-700 p-2\">\u003cinput type=\"number\" placeholder=\"3.0\" class=\"w-full bg-transparent text-center outline-none text-indigo-300\">\u003c/td>\n                                    \u003ctd class=\"border border-slate-700 p-2\">\u003cinput type=\"number\" placeholder=\"3.0\" class=\"w-full bg-transparent text-center outline-none text-indigo-300\">\u003c/td>\n                                    \u003ctd class=\"border border-slate-700 p-2\">\u003cinput type=\"number\" placeholder=\"0.30\" class=\"w-full bg-transparent text-center outline-none text-indigo-300\">\u003c/td>\n                                    \u003ctd class=\"border border-slate-700 p-2\">\u003cinput type=\"number\" placeholder=\"10\" class=\"w-full bg-transparent text-center outline-none text-indigo-300\">\u003c/td>\n                                    \u003ctd class=\"border border-slate-700 p-2\">\u003cinput type=\"number\" placeholder=\"10\" class=\"w-full bg-transparent text-center outline-none text-indigo-300\">\u003c/td>\n                                    \u003ctd class=\"border border-slate-700 p-2\">\u003cinput type=\"number\" placeholder=\"20\" class=\"w-full bg-transparent text-center outline-none text-indigo-300\">\u003c/td>\n                                \u003c/tr>\n                            \u003c/tbody>\n                        \u003c/table>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- 2-Jadval: Parallel -->\n                \u003cdiv class=\"space-y-2\">\n                    \u003ch3 class=\"text-sm font-semibold text-emerald-400 flex items-center gap-2\">\n                        \u003ci data-lucide=\"git-fork\" class=\"w-4 h-4\">\u003c/i> 2-Jadval. Parallel ulangan zanjir uchun\n                    \u003c/h3>\n                    \u003cdiv class=\"overflow-x-auto\">\n                        \u003ctable class=\"w-full text-xs text-left text-slate-300 border-collapse border border-slate-700\">\n                            \u003cthead class=\"bg-slate-900/80 text-slate-200\">\n                                \u003ctr>\n                                    \u003cth class=\"border border-slate-700 p-2.5 text-center\">T/r\u003c/th>\n                                    \u003cth class=\"border border-slate-700 p-2.5 text-center\">$U_{um}$ (V)\u003c/th>\n                                    \u003cth class=\"border border-slate-700 p-2.5 text-center\">$I_{um}$ (A)\u003c/th>\n                                    \u003cth class=\"border border-slate-700 p-2.5 text-center\">$I_1$ (A)\u003c/th>\n                                    \u003cth class=\"border border-slate-700 p-2.5 text-center\">$I_2$ (A)\u003c/th>\n                                    \u003cth class=\"border border-slate-700 p-2.5 text-center\">$R_1 = U/I_1$ (Ω)\u003c/th>\n                                    \u003cth class=\"border border-slate-700 p-2.5 text-center\">$R_2 = U/I_2$ (Ω)\u003c/th>\n                                    \u003cth class=\"border border-slate-700 p-2.5 text-center\">$R_{um}$ (Ω)\u003c/th>\n                                \u003c/tr>\n                            \u003c/thead>\n                            \u003ctbody>\n                                \u003ctr class=\"hover:bg-slate-700/30\">\n                                    \u003ctd class=\"border border-slate-700 p-2 text-center font-bold\">1\u003c/td>\n                                    \u003ctd class=\"border border-slate-700 p-2\">\u003cinput type=\"number\" placeholder=\"6.0\" class=\"w-full bg-transparent text-center outline-none text-emerald-300\">\u003c/td>\n                                    \u003ctd class=\"border border-slate-700 p-2\">\u003cinput type=\"number\" placeholder=\"1.20\" class=\"w-full bg-transparent text-center outline-none text-emerald-300\">\u003c/td>\n                                    \u003ctd class=\"border border-slate-700 p-2\">\u003cinput type=\"number\" placeholder=\"0.60\" class=\"w-full bg-transparent text-center outline-none text-emerald-300\">\u003c/td>\n                                    \u003ctd class=\"border border-slate-700 p-2\">\u003cinput type=\"number\" placeholder=\"0.60\" class=\"w-full bg-transparent text-center outline-none text-emerald-300\">\u003c/td>\n                                    \u003ctd class=\"border border-slate-700 p-2\">\u003cinput type=\"number\" placeholder=\"10\" class=\"w-full bg-transparent text-center outline-none text-emerald-300\">\u003c/td>\n                                    \u003ctd class=\"border border-slate-700 p-2\">\u003cinput type=\"number\" placeholder=\"10\" class=\"w-full bg-transparent text-center outline-none text-emerald-300\">\u003c/td>\n                                    \u003ctd class=\"border border-slate-700 p-2\">\u003cinput type=\"number\" placeholder=\"5\" class=\"w-full bg-transparent text-center outline-none text-emerald-300\">\u003c/td>\n                                \u003c/tr>\n                            \u003c/tbody>\n                        \u003c/table>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003cdiv class=\"space-y-3 pt-4 border-t border-slate-700\">\n                    \u003ch3 class=\"text-sm font-bold text-white flex items-center gap-2\">\n                        \u003ci data-lucide=\"help-circle\" class=\"w-4 h-4 text-amber-400\">\u003c/i> Hisoblash va Xulosa Chiqarish Savollari\n                    \u003c/h3>\n                    \u003cdiv class=\"space-y-3 text-xs\">\n                        \u003cdiv class=\"space-y-1\">\n                            \u003clabel class=\"block text-slate-300 font-medium\">1. Ketma-ket ulashda zanjirning umumiy kuchlanishi va har bir lampochkadagi kuchlanishlar orasida qanday munosabat o'rnatildi?\u003c/label>\n                            \u003ctextarea rows=\"2\" class=\"w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-200 outline-none focus:border-indigo-500\" placeholder=\"Javobingizni yozing...\">\u003c/textarea>\n                        \u003c/div>\n                        \u003cdiv class=\"space-y-1\">\n                            \u003clabel class=\"block text-slate-300 font-medium\">2. Parallel ulashda tarmoqlardagi tok kuchlarining yig'indisi umumiy tok kuchiga teng bo'ldimi?\u003c/label>\n                            \u003ctextarea rows=\"2\" class=\"w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-200 outline-none focus:border-indigo-500\" placeholder=\"Javobingizni yozing...\">\u003c/textarea>\n                        \u003c/div>\n                        \u003cdiv class=\"space-y-1\">\n                            \u003clabel class=\"block text-slate-300 font-medium\">3. Xulosa (Laboratoriya ishidan olingan asosiy ilmiy xulosangiz):\u003c/label>\n                            \u003ctextarea rows=\"3\" class=\"w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-200 outline-none focus:border-indigo-500\" placeholder=\"Laboratoriya ishi yakuni bo'yicha xulosangizni bayon eting...\">\u003c/textarea>\n                        \u003c/div>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n    \u003c/main>\n\n    \u003cscript>\n        // Lucide ikonkalarni faollashtirish\n        lucide.createIcons();\n\n        // Model va Holatlar State Variable-lari\n        const state = {\n            circuitType: 'series', // 'series' yoki 'parallel'\n            isClosed: false,       // Kalit holati\n            voltage: 6.0,          // Volt\n            r1: 10.0,              // Ohm\n            r2: 10.0,              // Ohm\n            // Hisobiy natijalar\n            iTotal: 0,\n            i1: 0,\n            i2: 0,\n            u1: 0,\n            u2: 0,\n            rTotal: 0,\n            isOverload: false\n        };\n\n        // Canvas elementlari va animatsiya kadrlar boshqaruvi\n        const canvas = document.getElementById('circuitCanvas');\n        const ctx = canvas.getContext('2d');\n        let electronParticles = [];\n        let animFrameId = null;\n\n        // Sahifa yuklanganda va ekran o'lchami o'zgarganda Canvasni moslashtirish\n        function resizeCanvas() {\n            const rect = canvas.parentElement.getBoundingClientRect();\n            canvas.width = rect.width;\n            canvas.height = rect.height;\n            initElectrons();\n        }\n\n        window.addEventListener('resize', resizeCanvas);\n\n        function initElectrons() {\n            electronParticles = [];\n            const count = 28;\n            for (let i = 0; i \u003c count; i++) {\n                electronParticles.push({\n                    progress: i / count,\n                    branch: i % 2 === 0 ? 1 : 2\n                });\n            }\n        }\n\n        // Tablarni almashtirish funksiyasi\n        function switchTab(tab) {\n            document.getElementById('sec-sim').classList.add('hidden');\n            document.getElementById('sec-guide').classList.add('hidden');\n            document.getElementById('sec-table').classList.add('hidden');\n\n            document.getElementById('tab-sim').className = \"flex items-center gap-2 px-4 py-2 rounded-lg font-medium transition-all text-slate-400 hover:text-slate-200\";\n            document.getElementById('tab-guide').className = \"flex items-center gap-2 px-4 py-2 rounded-lg font-medium transition-all text-slate-400 hover:text-slate-200\";\n            document.getElementById('tab-table').className = \"flex items-center gap-2 px-4 py-2 rounded-lg font-medium transition-all text-slate-400 hover:text-slate-200\";\n\n            if (tab === 'sim') {\n                document.getElementById('sec-sim').classList.remove('hidden');\n                document.getElementById('tab-sim').className = \"flex items-center gap-2 px-4 py-2 rounded-lg font-medium transition-all bg-indigo-600 text-white shadow-md\";\n                resizeCanvas();\n            } else if (tab === 'guide') {\n                document.getElementById('sec-guide').classList.remove('hidden');\n                document.getElementById('tab-guide').className = \"flex items-center gap-2 px-4 py-2 rounded-lg font-medium transition-all bg-indigo-600 text-white shadow-md\";\n            } else if (tab === 'table') {\n                document.getElementById('sec-table').classList.remove('hidden');\n                document.getElementById('tab-table').className = \"flex items-center gap-2 px-4 py-2 rounded-lg font-medium transition-all bg-indigo-600 text-white shadow-md\";\n            }\n        }\n\n        // Zanjir turini o'zgartirish\n        function setCircuitType(type) {\n            state.circuitType = type;\n            const btnSeries = document.getElementById('btn-series');\n            const btnParallel = document.getElementById('btn-parallel');\n\n            if (type === 'series') {\n                btnSeries.className = \"px-3 py-1 text-xs font-medium rounded-md bg-indigo-600 text-white transition-all\";\n                btnParallel.className = \"px-3 py-1 text-xs font-medium rounded-md text-slate-400 hover:text-white transition-all\";\n            } else {\n                btnParallel.className = \"px-3 py-1 text-xs font-medium rounded-md bg-indigo-600 text-white transition-all\";\n                btnSeries.className = \"px-3 py-1 text-xs font-medium rounded-md text-slate-400 hover:text-white transition-all\";\n            }\n            calculatePhysics();\n        }\n\n        // Kalitni ochiq/yopiq qilish\n        function toggleSwitch() {\n            state.isClosed = !state.isClosed;\n            const btnSwitch = document.getElementById('btn-switch');\n            const switchText = document.getElementById('switch-text');\n\n            if (state.isClosed) {\n                btnSwitch.className = \"flex items-center gap-2 px-4 py-1.5 rounded-lg text-xs font-bold transition-all bg-emerald-500 hover:bg-emerald-600 text-white shadow-lg shadow-emerald-500/20\";\n                switchText.innerText = \"Kalit Yopiq (Yoqilgan)\";\n            } else {\n                btnSwitch.className = \"flex items-center gap-2 px-4 py-1.5 rounded-lg text-xs font-bold transition-all bg-red-500 hover:bg-red-600 text-white shadow-lg shadow-red-500/20\";\n                switchText.innerText = \"Kalit Ochiq (O‘chiq)\";\n            }\n            calculatePhysics();\n        }\n\n        // Parametrlarni yangilash\n        function updateParameters() {\n            state.voltage = parseFloat(document.getElementById('input-voltage').value);\n            state.r1 = parseFloat(document.getElementById('input-r1').value);\n            state.r2 = parseFloat(document.getElementById('input-r2').value);\n\n            document.getElementById('val-voltage').innerText = state.voltage.toFixed(1) + \" V\";\n            document.getElementById('val-r1').innerText = state.r1.toFixed(0) + \" Ω\";\n            document.getElementById('val-r2').innerText = state.r2.toFixed(0) + \" Ω\";\n\n            calculatePhysics();\n        }\n\n        function calculatePhysics() {\n            if (!state.isClosed) {\n                state.iTotal = 0;\n                state.i1 = 0;\n                state.i2 = 0;\n                state.u1 = 0;\n                state.u2 = 0;\n                state.rTotal = state.circuitType === 'series' ? (state.r1 + state.r2) : (1 / (1/state.r1 + 1/state.r2));\n                state.isOverload = false;\n            } else {\n                if (state.circuitType === 'series') {\n                    state.rTotal = state.r1 + state.r2;\n                    state.iTotal = state.voltage / state.rTotal;\n                    state.i1 = state.iTotal;\n                    state.i2 = state.iTotal;\n                    state.u1 = state.iTotal * state.r1;\n                    state.u2 = state.iTotal * state.r2;\n                } else { // parallel\n                    state.rTotal = 1 / ((1 / state.r1) + (1 / state.r2));\n                    state.i1 = state.voltage / state.r1;\n                    state.i2 = state.voltage / state.r2;\n                    state.iTotal = state.i1 + state.i2;\n                    state.u1 = state.voltage;\n                    state.u2 = state.voltage;\n                }\n\n                // O'lchash chegarasidan oshish (Ampermetr max 3A)\n                state.isOverload = state.iTotal > 3.0 || state.voltage > 15.0;\n            }\n\n            // UI Displeylarini yangilash\n            document.getElementById('read-i-total').innerText = state.iTotal.toFixed(2) + \" A\";\n            document.getElementById('read-i1').innerText = state.i1.toFixed(2) + \" A\";\n            document.getElementById('read-i2').innerText = state.i2.toFixed(2) + \" A\";\n            document.getElementById('read-u1').innerText = state.u1.toFixed(2) + \" V\";\n            document.getElementById('read-u2').innerText = state.u2.toFixed(2) + \" V\";\n            document.getElementById('read-r-total').innerText = state.rTotal.toFixed(1) + \" Ω\";\n\n            // Xavfsizlik status ko'rsatgichi\n            const safetyEl = document.getElementById('safety-status');\n            if (state.isOverload) {\n                safetyEl.className = \"flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-red-500/20 text-red-400 border border-red-500/30 animate-pulse\";\n                safetyEl.innerHTML = `\u003ci data-lucide=\"alert-triangle\" class=\"w-4 h-4\">\u003c/i> \u003cspan>Diqqat: Tok kuchi chegaradan oshdi! (>3A)\u003c/span>`;\n            } else {\n                safetyEl.className = \"flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20\";\n                safetyEl.innerHTML = `\u003ci data-lucide=\"shield-check\" class=\"w-4 h-4\">\u003c/i> \u003cspan>Xavfsiz rejim\u003c/span>`;\n            }\n            lucide.createIcons();\n        }\n\n        function drawCircuit() {\n            const w = canvas.width;\n            const h = canvas.height;\n            ctx.clearRect(0, 0, w, h);\n\n            // Shina va chiziq koordinatalari\n            const paddingX = Math.max(60, w * 0.12);\n            const paddingY = Math.max(60, h * 0.15);\n            const left = paddingX;\n            const right = w - paddingX;\n            const top = paddingY;\n            const bottom = h - paddingY;\n            const midY = (top + bottom) / 2;\n\n            ctx.lineWidth = 4;\n            ctx.strokeStyle = state.isClosed ? \"#38bdf8\" : \"#64748b\";\n            ctx.lineCap = \"round\";\n\n            // Asosiy Ramka Wire Chizish\n            ctx.beginPath();\n            if (state.circuitType === 'series') {\n                // To'rtburchak ketma-ket kontur\n                ctx.rect(left, top, right - left, bottom - top);\n                ctx.stroke();\n            } else {\n                // Parallel kontur (ikkita tarmoq)\n                // Tashqi to'rtburchak\n                ctx.rect(left, top, right - left, bottom - top);\n                ctx.stroke();\n\n                // O'rta parallel tarmoq chizig'i\n                ctx.beginPath();\n                ctx.moveTo(left, midY);\n                ctx.lineTo(right, midY);\n                ctx.stroke();\n            }\n\n            \n            // 1. Tok Manbai (Chap tomonda)\n            const batteryY = midY;\n            ctx.fillStyle = \"#0f172a\";\n            ctx.fillRect(left - 12, batteryY - 30, 24, 60);\n\n            ctx.lineWidth = 3;\n            // Uzun tayoq (+)\n            ctx.strokeStyle = \"#ef4444\";\n            ctx.beginPath();\n            ctx.moveTo(left - 15, batteryY - 20);\n            ctx.lineTo(left + 15, batteryY - 20);\n            ctx.stroke();\n\n            // Qisqa qalin tayoq (-)\n            ctx.strokeStyle = \"#38bdf8\";\n            ctx.lineWidth = 6;\n            ctx.beginPath();\n            ctx.moveTo(left - 8, batteryY + 15);\n            ctx.lineTo(left + 8, batteryY + 15);\n            ctx.stroke();\n\n            ctx.fillStyle = \"#f8fafc\";\n            ctx.font = \"bold 12px Inter\";\n            ctx.fillText(\"+ DC -\", left - 18, batteryY - 32);\n\n            // 2. Kalit (Pastki tomonda)\n            const switchX = (left + right) / 2 - 40;\n            ctx.fillStyle = \"#0f172a\";\n            ctx.fillRect(switchX - 10, bottom - 10, 80, 20);\n\n            // Kalit kontakt nuqtalari\n            ctx.fillStyle = \"#f59e0b\";\n            ctx.beginPath();\n            ctx.arc(switchX, bottom, 5, 0, Math.PI * 2);\n            ctx.arc(switchX + 50, bottom, 5, 0, Math.PI * 2);\n            ctx.fill();\n\n            // Kalit pichog'i\n            ctx.strokeStyle = \"#f59e0b\";\n            ctx.lineWidth = 4;\n            ctx.beginPath();\n            ctx.moveTo(switchX, bottom);\n            if (state.isClosed) {\n                ctx.lineTo(switchX + 50, bottom);\n            } else {\n                ctx.lineTo(switchX + 40, bottom - 25);\n            }\n            ctx.stroke();\n            ctx.fillStyle = \"#cbd5e1\";\n            ctx.font = \"11px Inter\";\n            ctx.fillText(\"Kalit\", switchX + 15, bottom + 22);\n\n            // 3. Ampermetr (Ketma-ket ulanadi, Pastki chapda)\n            const ammeterX = left + (right - left) * 0.25;\n            ctx.fillStyle = \"#0f172a\";\n            ctx.beginPath();\n            ctx.arc(ammeterX, bottom, 18, 0, Math.PI * 2);\n            ctx.fill();\n            ctx.strokeStyle = \"#10b981\";\n            ctx.lineWidth = 3;\n            ctx.stroke();\n            ctx.fillStyle = \"#10b981\";\n            ctx.font = \"bold 14px Inter\";\n            ctx.fillText(\"A\", ammeterX - 5, bottom + 5);\n\n            // Lampochkalarni chizish\n            if (state.circuitType === 'series') {\n                // Yuqori tarmoqda 2 ta lampochka ketma-ket\n                const l1X = left + (right - left) * 0.35;\n                const l2X = left + (right - left) * 0.70;\n\n                drawBulb(l1X, top, state.u1, \"L1 (\" + state.r1 + \"Ω)\");\n                drawBulb(l2X, top, state.u2, \"L2 (\" + state.r2 + \"Ω)\");\n\n                // Voltmetr 1 (L1 ga parallel)\n                drawVoltmeter(l1X, top - 45, \"V1\");\n                // Voltmetr ulash simlari\n                ctx.strokeStyle = \"#64748b\";\n                ctx.lineWidth = 1.5;\n                ctx.setLineDash([3, 3]);\n                ctx.beginPath();\n                ctx.moveTo(l1X - 25, top);\n                ctx.lineTo(l1X - 25, top - 45);\n                ctx.lineTo(l1X - 15, top - 45);\n                ctx.moveTo(l1X + 25, top);\n                ctx.lineTo(l1X + 25, top - 45);\n                ctx.lineTo(l1X + 15, top - 45);\n                ctx.stroke();\n                ctx.setLineDash([]);\n            } else {\n                // Parallel: 1-lampochka top simida, 2-lampochka midY simida\n                const bulbX = (left + right) / 2;\n                drawBulb(bulbX, top, state.u1, \"L1 (\" + state.r1 + \"Ω)\");\n                drawBulb(bulbX, midY, state.u2, \"L2 (\" + state.r2 + \"Ω)\");\n\n                // Parallel voltmetr o'ng tomonda\n                drawVoltmeter(right + 35, (top + midY) / 2, \"V\");\n                ctx.strokeStyle = \"#64748b\";\n                ctx.lineWidth = 1.5;\n                ctx.setLineDash([3, 3]);\n                ctx.beginPath();\n                ctx.moveTo(right, top);\n                ctx.lineTo(right + 35, top);\n                ctx.lineTo(right + 35, (top + midY) / 2 - 15);\n                ctx.moveTo(right, midY);\n                ctx.lineTo(right + 35, midY);\n                ctx.lineTo(right + 35, (top + midY) / 2 + 15);\n                ctx.stroke();\n                ctx.setLineDash([]);\n            }\n\n            if (state.isClosed && state.iTotal > 0) {\n                const speed = Math.min(0.015, 0.002 + state.iTotal * 0.003);\n\n                electronParticles.forEach(p => {\n                    p.progress += speed;\n                    if (p.progress > 1) p.progress = 0;\n\n                    let pos = { x: 0, y: 0 };\n\n                    if (state.circuitType === 'series') {\n                        pos = getSeriesPoint(p.progress, left, right, top, bottom);\n                    } else {\n                        pos = getParallelPoint(p.progress, p.branch, left, right, top, bottom, midY);\n                    }\n\n                    // Elektronni ko'k doiracha shaklida chizish\n                    ctx.fillStyle = \"#38bdf8\";\n                    ctx.shadowColor = \"#0284c7\";\n                    ctx.shadowBlur = 8;\n                    ctx.beginPath();\n                    ctx.arc(pos.x, pos.y, 4, 0, Math.PI * 2);\n                    ctx.fill();\n                    ctx.shadowBlur = 0;\n                });\n            }\n\n            animFrameId = requestAnimationFrame(drawCircuit);\n        }\n\n        // Lampochkani vizual chizish va uning nurlanish samaradorligi\n        function drawBulb(x, y, voltage, label) {\n            ctx.fillStyle = \"#0f172a\";\n            ctx.beginPath();\n            ctx.arc(x, y, 20, 0, Math.PI * 2);\n            ctx.fill();\n\n            // Lampochka yonishi (Glow)\n            if (state.isClosed && voltage > 0) {\n                const intensity = Math.min(1, voltage / 10);\n                ctx.fillStyle = `rgba(251, 191, 36, ${0.2 + intensity * 0.7})`;\n                ctx.shadowColor = \"#f59e0b\";\n                ctx.shadowBlur = 25 * intensity;\n                ctx.beginPath();\n                ctx.arc(x, y, 18, 0, Math.PI * 2);\n                ctx.fill();\n                ctx.shadowBlur = 0;\n            }\n\n            ctx.strokeStyle = \"#cbd5e1\";\n            ctx.lineWidth = 2.5;\n            ctx.beginPath();\n            ctx.arc(x, y, 20, 0, Math.PI * 2);\n            ctx.stroke();\n\n            // Lampochka ichidagi spiral (X ko'rinishida)\n            ctx.strokeStyle = \"#94a3b8\";\n            ctx.lineWidth = 2;\n            ctx.beginPath();\n            ctx.moveTo(x - 10, y - 10);\n            ctx.lineTo(x + 10, y + 10);\n            ctx.moveTo(x + 10, y - 10);\n            ctx.lineTo(x - 10, y + 10);\n            ctx.stroke();\n\n            // Sarlavha\n            ctx.fillStyle = \"#e2e8f0\";\n            ctx.font = \"11px Inter\";\n            ctx.fillText(label, x - 25, y + 35);\n        }\n\n        // Voltmetr chizish\n        function drawVoltmeter(x, y, label) {\n            ctx.fillStyle = \"#0f172a\";\n            ctx.beginPath();\n            ctx.arc(x, y, 15, 0, Math.PI * 2);\n            ctx.fill();\n            ctx.strokeStyle = \"#06b6d4\";\n            ctx.lineWidth = 2.5;\n            ctx.stroke();\n            ctx.fillStyle = \"#06b6d4\";\n            ctx.font = \"bold 12px Inter\";\n            ctx.fillText(label, x - 5, y + 4);\n        }\n\n        // Ketma-ket zanjir traektoriya nuqtasi\n        function getSeriesPoint(prog, left, right, top, bottom) {\n            const perimeter = 2 * (right - left + bottom - top);\n            let dist = prog * perimeter;\n\n            // Soat mili bo'yicha harakat\n            if (dist \u003c= (right - left)) {\n                return { x: left + dist, y: top };\n            }\n            dist -= (right - left);\n            if (dist \u003c= (bottom - top)) {\n                return { x: right, y: top + dist };\n            }\n            dist -= (bottom - top);\n            if (dist \u003c= (right - left)) {\n                return { x: right - dist, y: bottom };\n            }\n            dist -= (right - left);\n            return { x: left, y: bottom - dist };\n        }\n\n        // Parallel zanjir traektoriya nuqtasi\n        function getParallelPoint(prog, branch, left, right, top, bottom, midY) {\n            const targetY = branch === 1 ? top : midY;\n            const perimeter = 2 * (right - left) + 2 * (bottom - top);\n            let dist = prog * perimeter;\n\n            if (dist \u003c= (right - left)) {\n                return { x: left + dist, y: targetY };\n            }\n            dist -= (right - left);\n            if (dist \u003c= (bottom - targetY)) {\n                return { x: right, y: targetY + dist };\n            }\n            dist -= (bottom - targetY);\n            if (dist \u003c= (right - left)) {\n                return { x: right - dist, y: bottom };\n            }\n            dist -= (right - left);\n            return { x: left, y: bottom - dist };\n        }\n\n        // Simulyatorni ishga tushirish (Window onload)\n        window.onload = function() {\n            resizeCanvas();\n            updateParameters();\n            drawCircuit();\n        };\n    \u003c/script>\n\u003c/body>\n\u003c/html>"}, {"title": "Elektr qarshilik", "icon": "🧱", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Elektr qarshilik — interaktiv simulyatsiyalar\u003c/title>\n\u003cstyle>\n:root{--blue:#2563eb;--light:#f8fafc;--border:#dbe3ef;--text:#172033;--muted:#64748b;--green:#16a34a;--orange:#f59e0b}\n*{box-sizing:border-box}\nbody{margin:0;font-family:Arial,system-ui,sans-serif;background:linear-gradient(135deg,#eef6ff,#f8fafc);color:var(--text)}\n.app{max-width:1050px;margin:auto;padding:22px}\nheader{text-align:center;margin-bottom:18px}\nh1{margin:0;font-size:30px} h2{font-size:22px} h3{margin-top:0}\n.subtitle{color:var(--muted)}\n.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}\n.tab{border:1px solid var(--border);background:white;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:bold}\n.tab.active{background:#dbeafe;border-color:var(--blue);color:var(--blue)}\n.panel{display:none}.panel.active{display:block}\n.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:15px}\n.card{background:white;border:1px solid var(--border);border-radius:16px;padding:17px;box-shadow:0 5px 18px #0000000a}\n.circuit{background:#f1f5f9;border-radius:12px;padding:10px}\n.row{display:grid;grid-template-columns:90px 1fr 65px;gap:8px;align-items:center;margin:13px 0}\n.row label{font-weight:bold}.slider{width:100%;accent-color:var(--blue)}\noutput{font-weight:bold;text-align:right}\n.formula{font-family:Georgia,serif;background:#f8fafc;border-radius:9px;padding:11px;text-align:center;font-size:21px;margin:12px 0}\n.result{font-size:28px;font-weight:800;margin:12px 0}\n.meter{height:12px;background:#e2e8f0;border-radius:20px;overflow:hidden}\n.meter i{display:block;height:100%;background:var(--green);transition:.2s}\n.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}\n.btn{border:1px solid var(--border);background:white;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:bold}\n.primary{background:var(--blue);color:white;border-color:var(--blue)}\n.question{margin-top:14px;padding:12px;border-left:4px solid var(--blue);background:#eff6ff;border-radius:7px}\n.feedback{font-weight:bold;margin-top:10px}\n.hint{color:var(--muted);font-size:14px}\n.bar{height:145px;display:flex;align-items:end;gap:13px;padding:10px;background:#f8fafc;border-radius:10px}\n.bar span{display:block;width:30px;background:var(--blue);border-radius:5px 5px 0 0;transition:.2s}\n.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.value{background:#f8fafc;border-radius:9px;text-align:center;padding:10px}\n.value b{font-size:19px}\n.wire{stroke:#334155;stroke-width:7;fill:none;stroke-linecap:round}\n.electron{fill:#2563eb}.electron2{fill:#16a34a}\n.moving{animation:move 1.7s linear infinite}.slow{animation-duration:3s}\n@keyframes move{to{transform:translateX(330px)}}\n.lamp{fill:#f8fafc;stroke:#475569;stroke-width:3}.lamp.on{fill:#fde68a;filter:drop-shadow(0 0 7px #f59e0b)}\n@media(max-width:700px){.app{padding:12px}h1{font-size:24px}.grid{grid-template-columns:1fr}.row{grid-template-columns:75px 1fr 58px}.mini{grid-template-columns:1fr}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"app\">\n\u003cheader>\n\u003ch1>⚡ ELEKTR QARSHILIK\u003c/h1>\n\u003cdiv class=\"subtitle\">8-sinf fizika • Animatsiya + interaktiv simulyatsiya\u003c/div>\n\u003c/header>\n\n\u003cdiv class=\"tabs\">\n\u003cbutton class=\"tab active\" data-tab=\"p1\">1. Qarshilik\u003c/button>\n\u003cbutton class=\"tab\" data-tab=\"p2\">2. Om qonuni\u003c/button>\n\u003cbutton class=\"tab\" data-tab=\"p3\">3. Ulanishlar\u003c/button>\n\u003c/div>\n\n\u003csection id=\"p1\" class=\"panel active\">\n\u003cdiv class=\"grid\">\n\u003cdiv class=\"card\">\n\u003ch3>🎞️ Animatsiya: elektronlarning harakati\u003c/h3>\n\u003cdiv class=\"circuit\">\n\u003csvg viewBox=\"0 0 520 150\" width=\"100%\">\n\u003cpath d=\"M45 75 H475\" class=\"wire\"/>\n\u003ccircle cx=\"75\" cy=\"75\" r=\"7\" class=\"electron moving\"/>\n\u003ccircle cx=\"120\" cy=\"75\" r=\"7\" class=\"electron slow moving\"/>\n\u003ccircle cx=\"165\" cy=\"75\" r=\"7\" class=\"electron moving\"/>\n\u003ccircle cx=\"210\" cy=\"75\" r=\"7\" class=\"electron slow moving\"/>\n\u003ctext x=\"42\" y=\"35\" font-size=\"16\">Elektronlar →\u003c/text>\n\u003ctext x=\"190\" y=\"125\" font-size=\"15\">O‘tkazgich\u003c/text>\n\u003c/svg>\n\u003c/div>\n\u003cp class=\"hint\">Elektronlar o‘tkazgich bo‘ylab harakatlanadi. Qarshilik ortganda ularning tartibli harakati qiyinlashadi.\u003c/p>\n\u003cdiv class=\"formula\">I = U / R\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"card\">\n\u003ch3>🎛️ Simulyatsiya\u003c/h3>\n\u003cdiv class=\"row\">\u003clabel>U (V)\u003c/label>\u003cinput id=\"u1\" class=\"slider\" type=\"range\" min=\"1\" max=\"24\" value=\"12\">\u003coutput id=\"u1o\">12 V\u003c/output>\u003c/div>\n\u003cdiv class=\"row\">\u003clabel>R (Ω)\u003c/label>\u003cinput id=\"r1\" class=\"slider\" type=\"range\" min=\"1\" max=\"24\" value=\"6\">\u003coutput id=\"r1o\">6 Ω\u003c/output>\u003c/div>\n\u003cdiv class=\"result\">I = \u003cspan id=\"i1\">2.00\u003c/span> A\u003c/div>\n\u003cdiv class=\"meter\">\u003ci id=\"m1\" style=\"width:8%\">\u003c/i>\u003c/div>\n\u003cdiv class=\"question\">❓ Qarshilikni 2 marta oshirsak, tok kuchi qanday o‘zgaradi?\u003c/div>\n\u003cdiv class=\"btns\">\u003cbutton class=\"btn primary\" id=\"check1\">Tekshirish\u003c/button>\u003cbutton class=\"btn\" id=\"reset1\">Tozalash\u003c/button>\u003c/div>\n\u003cdiv id=\"f1\" class=\"feedback\">\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"p2\" class=\"panel\">\n\u003cdiv class=\"grid\">\n\u003cdiv class=\"card\">\n\u003ch3>🎞️ Animatsiya: Om qonuni\u003c/h3>\n\u003cdiv class=\"circuit\">\n\u003csvg viewBox=\"0 0 520 180\" width=\"100%\">\n\u003crect x=\"40\" y=\"65\" width=\"75\" height=\"45\" rx=\"7\" fill=\"#e2e8f0\" stroke=\"#475569\" stroke-width=\"3\"/>\n\u003ctext x=\"57\" y=\"93\" font-size=\"17\">Batareya\u003c/text>\n\u003cpath d=\"M115 88 H430\" class=\"wire\"/>\n\u003ccircle cx=\"150\" cy=\"88\" r=\"7\" class=\"electron2 moving\"/>\n\u003ccircle cx=\"205\" cy=\"88\" r=\"7\" class=\"electron2 moving\"/>\n\u003ccircle cx=\"260\" cy=\"88\" r=\"7\" class=\"electron2 moving\"/>\n\u003ccircle cx=\"315\" cy=\"88\" r=\"7\" class=\"electron2 moving\"/>\n\u003crect x=\"365\" y=\"62\" width=\"65\" height=\"52\" rx=\"8\" fill=\"#fef3c7\" stroke=\"#92400e\" stroke-width=\"3\"/>\n\u003ctext x=\"383\" y=\"94\" font-size=\"18\">R\u003c/text>\n\u003ctext x=\"145\" y=\"145\" font-size=\"15\">U oshsa → I ham oshadi\u003c/text>\n\u003c/svg>\n\u003c/div>\n\u003cdiv class=\"bar\">\n\u003cspan id=\"bar1\" style=\"height:40%\">\u003c/span>\u003cspan id=\"bar2\" style=\"height:45%\">\u003c/span>\n\u003cspan id=\"bar3\" style=\"height:55%\">\u003c/span>\u003cspan id=\"bar4\" style=\"height:65%\">\u003c/span>\n\u003cspan id=\"bar5\" style=\"height:75%\">\u003c/span>\n\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"card\">\n\u003ch3>🎛️ U va R ni boshqaring\u003c/h3>\n\u003cdiv class=\"row\">\u003clabel>U (V)\u003c/label>\u003cinput id=\"u2\" class=\"slider\" type=\"range\" min=\"1\" max=\"30\" value=\"12\">\u003coutput id=\"u2o\">12 V\u003c/output>\u003c/div>\n\u003cdiv class=\"row\">\u003clabel>R (Ω)\u003c/label>\u003cinput id=\"r2\" class=\"slider\" type=\"range\" min=\"1\" max=\"30\" value=\"6\">\u003coutput id=\"r2o\">6 Ω\u003c/output>\u003c/div>\n\u003cdiv class=\"mini\">\n\u003cdiv class=\"value\">Tok kuchi\u003cbr>\u003cb id=\"i2\">2.00 A\u003c/b>\u003c/div>\n\u003cdiv class=\"value\">Formula\u003cbr>\u003cb>I = U/R\u003c/b>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"question\">Topshiriq: U = 18 V, R = 6 Ω bo‘lganda I ni toping.\u003c/div>\n\u003cdiv class=\"btns\">\u003cbutton class=\"btn primary\" id=\"check2\">Tekshirish\u003c/button>\u003cbutton class=\"btn\" id=\"reset2\">Tozalash\u003c/button>\u003c/div>\n\u003cdiv id=\"f2\" class=\"feedback\">\u003c/div>\n\u003cp class=\"hint\">\u003cb>R = ρl/S:\u003c/b> uzunlik oshsa R oshadi; kesim yuzi oshsa R kamayadi; material ham qarshilikka ta’sir qiladi.\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"p3\" class=\"panel\">\n\u003cdiv class=\"grid\">\n\u003cdiv class=\"card\">\n\u003ch3>🎞️ Animatsiya: ketma-ket va parallel ulash\u003c/h3>\n\u003cdiv class=\"mini\">\n\u003cdiv class=\"circuit\">\n\u003cb>Ketma-ket\u003c/b>\n\u003csvg viewBox=\"0 0 230 110\" width=\"100%\">\n\u003cpath d=\"M15 55 H65 M105 55 H125 M165 55 H215\" class=\"wire\"/>\n\u003ccircle cx=\"85\" cy=\"55\" r=\"19\" class=\"lamp on\"/>\n\u003ccircle cx=\"145\" cy=\"55\" r=\"19\" class=\"lamp on\"/>\n\u003c/svg>\n\u003cp class=\"hint\">Bitta lampochka uzilsa, zanjir uziladi.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"circuit\">\n\u003cb>Parallel\u003c/b>\n\u003csvg viewBox=\"0 0 230 130\" width=\"100%\">\n\u003cpath d=\"M25 25 H205 M25 105 H205 M25 25 V105 M205 25 V105 M25 65 H75 M155 65 H205\" class=\"wire\"/>\n\u003ccircle cx=\"115\" cy=\"35\" r=\"18\" class=\"lamp on\"/>\n\u003ccircle cx=\"115\" cy=\"95\" r=\"18\" class=\"lamp on\"/>\n\u003c/svg>\n\u003cp class=\"hint\">Bitta tarmoq uzilsa, ikkinchisi ishlashi mumkin.\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"card\">\n\u003ch3>🎛️ Umumiy qarshilik\u003c/h3>\n\u003cdiv class=\"row\">\u003clabel>R₁ (Ω)\u003c/label>\u003cinput id=\"ra\" class=\"slider\" type=\"range\" min=\"1\" max=\"30\" value=\"6\">\u003coutput id=\"rao\">6 Ω\u003c/output>\u003c/div>\n\u003cdiv class=\"row\">\u003clabel>R₂ (Ω)\u003c/label>\u003cinput id=\"rb\" class=\"slider\" type=\"range\" min=\"1\" max=\"30\" value=\"3\">\u003coutput id=\"rbo\">3 Ω\u003c/output>\u003c/div>\n\u003cdiv class=\"btns\">\u003cbutton class=\"btn primary\" id=\"series\">Ketma-ket\u003c/button>\u003cbutton class=\"btn\" id=\"parallel\">Parallel\u003c/button>\u003c/div>\n\u003cdiv class=\"formula\" id=\"formula3\">R = R₁ + R₂\u003c/div>\n\u003cdiv class=\"result\">Rᵤ = \u003cspan id=\"req\">9.00\u003c/span> Ω\u003c/div>\n\u003cdiv class=\"question\">❓ R₁ = 6 Ω va R₂ = 3 Ω bo‘lsa, parallel ulashda umumiy qarshilik qancha?\u003c/div>\n\u003cdiv class=\"btns\">\u003cbutton class=\"btn primary\" id=\"check3\">Tekshirish\u003c/button>\u003cbutton class=\"btn\" id=\"reset3\">Tozalash\u003c/button>\u003c/div>\n\u003cdiv id=\"f3\" class=\"feedback\">\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003c/div>\n\n\u003cscript>\nconst $=s=>document.querySelector(s);\ndocument.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{\n document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));\n document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));\n b.classList.add('active');$('#'+b.dataset.tab).classList.add('active');\n});\n\nfunction calc1(){\n let u=+$('#u1').value,r=+$('#r1').value,i=u/r;\n $('#u1o').textContent=u+' V';$('#r1o').textContent=r+' Ω';\n $('#i1').textContent=i.toFixed(2);\n $('#m1').style.width=Math.min(100,i/24*100)+'%';\n}\n['u1','r1'].forEach(id=>$('#'+id).oninput=calc1);\n$('#check1').onclick=()=>$('#f1').textContent='✅ To‘g‘ri: U o‘zgarmasa, R 2 marta oshsa, I 2 marta kamayadi.';\n$('#reset1').onclick=()=>{$('#u1').value=12;$('#r1').value=6;$('#f1').textContent='';calc1()};\n\nfunction calc2(){\n let u=+$('#u2').value,r=+$('#r2').value,i=u/r;\n $('#u2o').textContent=u+' V';$('#r2o').textContent=r+' Ω';$('#i2').textContent=i.toFixed(2)+' A';\n let p=Math.min(100,i/30*100);\n ['#bar1','#bar2','#bar3','#bar4','#bar5'].forEach((s,n)=>$(s).style.height=Math.max(12,p*(.55+n*.11))+'%');\n}\n['u2','r2'].forEach(id=>$('#'+id).oninput=calc2);\n$('#check2').onclick=()=>$('#f2').textContent='✅ To‘g‘ri javob: I = 18/6 = 3 A.';\n$('#reset2').onclick=()=>{$('#u2').value=12;$('#r2').value=6;$('#f2').textContent='';calc2()};\n\nlet mode='series';\nfunction calc3(){\n let a=+$('#ra').value,b=+$('#rb').value;\n let q=mode==='series'?a+b:(a*b)/(a+b);\n $('#rao').textContent=a+' Ω';$('#rbo').textContent=b+' Ω';\n $('#req').textContent=q.toFixed(2);\n $('#formula3').textContent=mode==='series'?'R = R₁ + R₂':'1/R = 1/R₁ + 1/R₂';\n}\n['ra','rb'].forEach(id=>$('#'+id).oninput=calc3);\n$('#series').onclick=()=>{mode='series';calc3()};\n$('#parallel').onclick=()=>{mode='parallel';calc3()};\n$('#check3').onclick=()=>$('#f3').textContent='✅ To‘g‘ri javob: R = (6×3)/(6+3) = 2 Ω.';\n$('#reset3').onclick=()=>{$('#ra').value=6;$('#rb').value=3;mode='series';$('#f3').textContent='';calc3()};\n\ncalc1();calc2();calc3();\n\u003c/script>\n\u003c/body>\n\u003c/html>"}, {"title": "Rezistorlar, reostatlar, potensiometrlar", "icon": "🎛️", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n    \u003cmeta charset=\"UTF-8\">\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    \u003ctitle>8-Sinf Fizika: Rezistorlar, Reostatlar va Potensiometrlar\u003c/title>\n    \u003c!-- Tailwind CSS for modern design -->\n    \u003cscript src=\"https://cdn.tailwindcss.com\">\u003c/script>\n    \u003c!-- FontAwesome icons -->\n    \u003clink rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css\">\n    \u003c!-- Google Fonts -->\n    \u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n    \u003cstyle>\n        body {\n            font-family: 'Inter', sans-serif;\n            background-color: #0f172a;\n            color: #f8fafc;\n        }\n        .tab-btn.active {\n            background-color: #3b82f6;\n            color: #ffffff;\n            box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.39);\n        }\n        .custom-slider::-webkit-slider-thumb {\n            -webkit-appearance: none;\n            appearance: none;\n            width: 20px;\n            height: 20px;\n            border-radius: 50%;\n            background: #3b82f6;\n            cursor: pointer;\n            border: 2px solid #ffffff;\n            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);\n        }\n        .glow-bulb {\n            transition: filter 0.2s ease, fill 0.2s ease;\n        }\n    \u003c/style>\n\u003c/head>\n\u003cbody class=\"min-h-screen flex flex-col justify-between bg-slate-900 text-slate-100\">\n\n    \u003c!-- Navigation / Header -->\n    \u003cheader class=\"border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50\">\n        \u003cdiv class=\"max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap justify-between items-center gap-4\">\n            \u003cdiv class=\"flex items-center gap-3\">\n                \u003cdiv class=\"p-2.5 bg-blue-600/20 text-blue-400 rounded-xl border border-blue-500/30\">\n                    \u003ci class=\"fa-solid fa-bolt text-2xl\">\u003c/i>\n                \u003c/div>\n                \u003cdiv>\n                    \u003ch1 class=\"text-xl font-extrabold tracking-tight bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent\">\n                        8-Sinf Fizika Interaktiv Laboratoriyasi\n                    \u003c/h1>\n                    \u003cp class=\"text-xs text-slate-400\">Mavzu: Rezistorlar, Reostatlar va Potensiometrlar\u003c/p>\n                \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Navigation Tabs -->\n            \u003cnav class=\"flex bg-slate-900 p-1 rounded-xl border border-slate-800 text-sm font-medium\">\n                \u003cbutton onclick=\"switchTab('tab1')\" id=\"btn-tab1\" class=\"tab-btn active px-4 py-2 rounded-lg transition-all flex items-center gap-2\">\n                    \u003ci class=\"fa-solid fa-atom\">\u003c/i>\n                    \u003cspan>1. Rezistor & Elektronlar\u003c/span>\n                \u003c/button>\n                \u003cbutton onclick=\"switchTab('tab2')\" id=\"btn-tab2\" class=\"tab-btn px-4 py-2 rounded-lg transition-all flex items-center gap-2\">\n                    \u003ci class=\"fa-solid fa-microchip\">\u003c/i>\n                    \u003cspan>2. Virtual Zanjir\u003c/span>\n                \u003c/button>\n                \u003cbutton onclick=\"switchTab('tab3')\" id=\"btn-tab3\" class=\"tab-btn px-4 py-2 rounded-lg transition-all flex items-center gap-2\">\n                    \u003ci class=\"fa-solid fa-sliders\">\u003c/i>\n                    \u003cspan>3. Reostat vs Potensiometr\u003c/span>\n                \u003c/button>\n            \u003c/nav>\n        \u003c/div>\n    \u003c/header>\n\n    \u003c!-- Main Content Area -->\n    \u003cmain class=\"max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow w-full\">\n\n        \u003c!-- SECTION 1: Rezistor va Elektronlar Harakati -->\n        \u003csection id=\"tab1\" class=\"tab-content block space-y-6\">\n            \u003cdiv class=\"grid grid-cols-1 lg:grid-cols-3 gap-6\">\n                \u003c!-- Simulation Canvas Container -->\n                \u003cdiv class=\"lg:col-span-2 bg-slate-950 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between shadow-2xl relative overflow-hidden\">\n                    \u003cdiv class=\"flex justify-between items-center mb-3\">\n                        \u003cdiv class=\"flex items-center gap-2\">\n                            \u003cspan class=\"inline-block w-3 h-3 rounded-full bg-blue-500 animate-pulse\">\u003c/span>\n                            \u003ch2 class=\"font-bold text-lg text-slate-200\">Elektronlarning Rezistorda Harakati (Mikroskopik Ko'rinish)\u003c/h2>\n                        \u003c/div>\n                        \u003cbutton id=\"toggleAnalogyBtn\" onclick=\"toggleWaterAnalogy()\" class=\"px-3 py-1.5 text-xs bg-indigo-600/30 hover:bg-indigo-600/50 border border-indigo-500/40 text-indigo-300 rounded-lg transition flex items-center gap-1.5\">\n                            \u003ci class=\"fa-solid fa-water\">\u003c/i> Suv Quvuri Analogiyasi\n                        \u003c/button>\n                    \u003c/div>\n\n                    \u003c!-- Main Canvas -->\n                    \u003cdiv class=\"relative w-full h-[320px] bg-slate-900 rounded-xl overflow-hidden border border-slate-800 flex items-center justify-center\">\n                        \u003ccanvas id=\"electronCanvas\" class=\"w-full h-full block\">\u003c/c
