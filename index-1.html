<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fizika 8-sinf — Elektr hodisalari</title>
<style>
:root{--bg:#0b1226;--nav:#111b3a;--nav2:#18254d;--ink:#e8eeff;--soft:#9fb0d6;--acc:#ffc93c;--acc-ink:#14213d;--line:#263666;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* Telefon uchun yuqori panel */
#top{display:none;flex:none;align-items:center;justify-content:space-between;background:var(--nav);border-bottom:3px solid var(--acc);
padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;z-index:20}
#brand{border:0;background:none;font-weight:800;font-size:1.05rem;padding:6px 4px}
#burger{border:1px solid var(--line);background:var(--nav2);border-radius:10px;width:42px;height:40px;font-size:1.3rem;line-height:1}

#app{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;min-width:0}
iframe,#home{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
iframe.on{display:block}
#home{background:var(--bg);overflow-y:auto;padding:28px 22px 40px}
#home.on{display:block}
.wrap{max-width:900px;margin:0 auto}
#home h1{font-size:clamp(1.5rem,4vw,2.3rem);margin:8px 0;line-height:1.2}
#home p.lead{color:var(--soft);margin:0 0 24px;max-width:60ch;line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{text-align:left;background:var(--nav);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--acc);transform:translateY(-2px)}
.card .e{font-size:1.9rem}
.card b{font-size:.98rem;line-height:1.3}
.card span{color:var(--soft);font-size:.82rem}

/* O'ng tomondagi menyu */
#side{flex:none;width:310px;background:var(--nav);border-left:3px solid var(--acc);display:flex;flex-direction:column;
padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#side header{display:flex;justify-content:space-between;align-items:center;padding:18px 18px 10px;font-weight:800;font-size:1.05rem}
#side header small{display:block;font-weight:500;color:var(--soft);font-size:.78rem;margin-top:3px}
#close{display:none;border:0;background:none;font-size:1.3rem;padding:6px 10px}
#list{display:flex;flex-direction:column;gap:3px;padding:4px 10px 16px;overflow-y:auto}
#list button{border:0;background:none;text-align:left;display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:10px;font-size:.92rem;line-height:1.3;color:var(--ink)}
#list button .n{flex:none;width:1.7rem;text-align:center;font-size:1.2rem}
#list button:hover{background:var(--nav2)}
#list button.on{background:var(--acc);color:var(--acc-ink);font-weight:700}
#shade{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#shade.open{opacity:1;pointer-events:auto}

@media (max-width:820px){
 #top{display:flex}
 #close{display:block}
 #side{position:fixed;top:0;bottom:0;right:0;width:min(320px,86vw);z-index:31;border-left:3px solid var(--acc);
  transform:translateX(100%);transition:transform .22s}
 #side.open{transform:none}
}
@media (prefers-reduced-motion:reduce){#side,#shade,.card{transition:none}}
</style>
</head>
<body>
<header id="top">
  <button id="brand">⚡ Fizika 8-sinf</button>
  <button id="burger" aria-label="Mavzular ro'yxatini ochish" aria-expanded="false">☰</button>
</header>
<div id="shade"></div>
<div id="app">
  <main id="stage">
    <section id="home">
      <div class="wrap">
        <h1>Elektr hodisalari: interaktiv darslar</h1>
        <p class="lead">Kerakli mavzuni o'ng tomondagi ro'yxatdan (telefonda ☰ tugmasi orqali) yoki quyidagi kartochkalardan tanlang.</p>
        <div class="grid" id="cards"></div>
      </div>
    </section>
  </main>
  <aside id="side" aria-label="Mavzular ro'yxati">
    <header><div>Mavzular<small>Bosib tezda o'ting</small></div><button id="close" aria-label="Yopish">✕</button></header>
    <nav id="list"></nav>
  </aside>
</div>

sh zaryadlanib, tukni o‘ziga tortadi.\u003c/div>\n\u003ccanvas id=\"c1\">\u003c/canvas>\n\u003cdiv class=\"bar\">\u003cbutton data-a=\"go\" data-i=\"1\">▶ Boshlash\u003c/button>\u003cbutton data-a=\"st\" data-i=\"1\">⏸ To‘xtatish\u003c/button>\u003cbutton data-a=\"rs\" data-i=\"1\">↺ Qayta boshlash\u003c/button>\u003c/div>\n\u003cdiv class=\"bar\">\u003cbutton data-e=\"-1\">– Elektron olish\u003c/button>\u003cbutton data-e=\"1\">+ Elektron qo‘shish\u003c/button>\u003c/div>\n\u003cdiv class=\"info\" id=\"i1\">\u003c/div>\n\u003cdiv id=\"q1\" class=\"note\">\u003c/div>\n\u003c/section>\n\n\u003csection id=\"s2\" class=\"sec card\">\n\u003ch2>2. Jismlarning zaryadlanish usullari\u003c/h2>\n\u003cdiv class=\"note\">\u003cb>Ishqalanish:\u003c/b> bir jism elektron beradi (+), ikkinchisi oladi (–) — ishoralar qarama-qarshi.\u003cbr>\u003cb>Tegizish:\u003c/b> elektronlar o‘tadi — ikkala jism bir xil ishorali bo‘ladi.\u003cbr>\u003cb>Induksiya:\u003c/b> jism \u003cb>tegmasdan\u003c/b> yaqinlashadi — o‘tkazgichdagi zaryadlar qayta taqsimlanadi.\u003cbr>\u003cb>Zaryadning saqlanish qonuni:\u003c/b> zaryad yo‘qolmaydi, faqat bir jismdan boshqasiga o‘tadi.\u003c/div>\n\u003cdiv class=\"bar\">\u003cbutton data-m=\"f\" class=\"on\">Ishqalanish\u003c/button>\u003cbutton data-m=\"t\">Tegizish\u003c/button>\u003cbutton data-m=\"i\">Induksiya\u003c/button>\u003c/div>\n\u003cdiv class=\"bar\" id=\"sub-f\">\u003cbutton data-pr=\"1\">Shisha + ipak\u003c/button>\u003cbutton data-pr=\"-1\">Ebonit + jun\u003c/button>\u003c/div>\n\u003cdiv class=\"bar hid\" id=\"sub-i\">\u003cbutton data-is=\"1\">Musbat jism\u003c/button>\u003cbutton data-is=\"-1\">Manfiy jism\u003c/button>\u003c/div>\n\u003ccanvas id=\"c2\">\u003c/canvas>\n\u003cdiv class=\"row\">\u003cspan class=\"sg\">Jarayon\u003c/span>\u003cinput type=\"range\" id=\"sl2\" min=\"0\" max=\"100\" value=\"0\" aria-label=\"Jarayon\">\u003c/div>\n\u003cdiv class=\"bar\">\u003cbutton data-a=\"go\" data-i=\"2\">▶ Boshlash\u003c/button>\u003cbut head>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>8-sinf fizika — Elektr zaryad\u003c/title>\n\u003cstyle>\n*{box-sizing:border-box}\nbody{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff}\nheader{padding:24px 16px;text-align:center;background:rgba(0,0,0,.25)}\nheader h1{margin:0;font-size:clamp(25px,6vw,40px)}\n.container{max-width:1000px;margin:auto;padding:18px}\n.lesson{display:none;background:#fff;color:#172033;border-radius:22px;padding:22px;box-shadow:0 12px 35px rgba(0,0,0,.25)}\n.lesson.active{display:block}\n.card{background:#f1f5f9;border-radius:16px;padding:16px;margin:14px 0}\nbutton{border:0;border-radius:12px;padding:12px 17px;margin:5px;cursor:pointer;background:#2563eb;color:#fff;font-size:16px}\nbutton.secondary{background:#e2e8f0;color:#172033}\nbutton:disabled{opacity:.5;cursor:not-allowed}\n.nav{display:flex;justify-content:space-between;gap:10px;margin:18px 0}\n.badge{display:inline-block;padding:7px 12px;border-radius:20px;background:#dbeafe;margin:4px}\n.stage{background:#eef2ff;border-radius:18px;padding:18px;text-align:center;overflow:hidden}\n.ball{width:76px;height:76px;border-radius:50%;background:#ef4444;margin:22px auto;display:flex;align-items:center;justify-content:center;font-size:30px;transition:transform .8s}\n.paper{display:inline-flex;width:42px;height:30px;background:#fde68a;border-radius:6px;align-items:center;justify-content:center;margin:5px;transition:transform .8s}\n.paper.pulled{transform:translateX(65px) rotate(-8deg)}\n.electron-box{position:relative;height:150px;background:#dbeafe;border-radius:14px;overflow:hidden}\n.electron{position:absolute;width:14px;height:14px;border-radius:50%;background:#2563eb;animation:move 3s linear infinite}\n@keyframes move{from{left:-20px}to{left:100%}}\n.quiz-option{display:block;width:100%;text-align:left;background:#e2e8f0;color:#172033}\n.correct{background:#86efac!important}\n.wrong{background:#fca5a5!important}\n.score{font-size:22px;font-weight:bold;text-align:center}\nsvg{max-width:100%;height:auto}\n@media(max-width:600px){.lesson{padding:16px}button{width:100%;margin:5px 0}.nav button{width:48%}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cheader>\n\u003ch1>⚡ ELEKTR ZARYAD\u003c/h1>\n\u003cp>8-sinf fizika • Interaktiv HTML5 dars\u003c/p>\n\u003c/header>\n\n\u003cmain class=\"container\">\n\n\u003csection class=\"lesson active\">\n\u003ch2>🎯 1-modul: Elektr hodisasi\u003c/h2>\n\u003cdiv class=\"card\">\n\u003ch3>🔮 “Sehrli shar” simulyatsiyasi\u003c/h3>\n\u003cp>Sharni sochga ishqalang. Keyin qog‘ozlarga yaqinlashtiring.\u003c/p>\n\u003cdiv class=\"stage\">\n\u003cdiv id=\"ball\" class=\"ball\">🎈\u003c/div>\n\u003cdiv>\n\u003cspan class=\"paper\">📄\u003c/span>\u003cspan class=\"paper\">📄\u003c/span>\n\u003cspan class=\"paper\">📄\u003c/span>\u003cspan class=\"paper\">📄\u003c/span>\n\u003c/div>\n\u003cbutton onclick=\"rubBall()\">⚡ Ishqalash\u003c/button>\n\u003cbutton class=\"secondary\" onclick=\"resetBall()\">↻ Qayta\u003c/button>\n\u003cp id=\"ballText\">\u003cb>Kuzatish:\u003c/b> avval sharni ishqalang.\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003cdiv class=\"card\">\n\u003cb>💡 Xulosa:\u003c/b> Ishqalanish natijasida elektronlar bir jismdan ikkinchisiga o‘tishi mumkin. Jism zaryadlanadi.\n\u003c/div>\n\u003cdiv class=\"card\">\n\u003cspan class=\"badge\">+ Musbat\u003c/span>\n\u003cspan class=\"badge\">− Manfiy\u003c/span>\n\u003cp>\u003cb>Elektron\u003c/b> — manfiy zaryadli. \u003cb>Proton\u003c/b> — musbat zaryadli.\u003c/p>\n\u003cp>Bir xil zaryadlar — \u003cb>itarishadi\u003c/b>. Har xil zaryadlar — \u003cb>tortishadi\u003c/b>.\u003c/p>\n\u003c/div>\n\u003c/section>\n\n\u003csection class=\"lesson\">\n\u003ch2>⚡ 2-modul: Elektronlarning ko‘chishi\u003c/h2>\n\u003cdiv class=\"card\">\n\u003cp>Ishqalanish vaqtida elektronlar bir jismdan ikkinchisiga ko‘chishi mumkin.\u003c/p>\n\u003cdiv class=\"stage\">\n\u003csvg viewBox=\"0 0 700 230\" aria-label=\"Elektronlarning bir jismdan ikkinchisiga ko‘chishi\">\n\u003crect x=\"20\" y=\"50\" width=\"250\" height=\"130\" rx=\"20\" fill=\"#dbeafe\" stroke=\"#64748b\"/>\n\u003crect x=\"430\" y=\"50\" width=\"250\" height=\"130\" rx=\"20\" fill=\"#dbeafe\" stroke=\"#64748b\"/>\n\u003ctext x=\"145\" y=\"35\" text-anchor=\"middle\" font-weight=\"bold\">Jism A\u003c/text>\n\u003ctext x=\"555\" y=\"35\" text-anchor=\"middle\" font-weight=\"bold\">Jism B\u003c/text>\n\u003ctext x=\"350\" y=\"125\" text-anchor=\"middle\" font-size=\"35\">→\u003c/text>\n\u003ccircle cx=\"100\" cy=\"90\" r=\"9\" fill=\"#2563eb\"/>\n\u003ccircle cx=\"160\" cy=\"140\" r=\"9\" fill=\"#2563eb\"/>\n\u003ccircle cx=\"225\" cy=\"95\" r=\"9\" fill=\"#2563eb\"/>\n\u003ccircle cx=\"485\" cy=\"105\" r=\"9\" fill=\"#2563eb\"/>\n\u003ccircle cx=\"550\" cy=\"145\" r=\"9\" fill=\"#2563eb\"/>\n\u003ccircle id=\"movingElectron\" cx=\"235\" cy=\"135\" r=\"10\" fill=\"#16a34a\"/>\n\u003c/svg>\n\u003cbutton onclick=\"transferElectron()\">⚡ Elektronni ko‘chirish\u003c/button>\n\u003cp id=\"transferText\">Elektron harakatini kuzating.\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003cdiv class=\"card\">\n\u003ch3>🧠 Eslab qoling\u003c/h3>\n\u003cp>Elektron olsa → \u003cb>manfiy zaryadlanadi\u003c/b>.\u003c/p>\n\u003cp>Elektron yo‘qotsa → \u003cb>musbat zaryadlanadi\u003c/b>.\u003c/p>\n\u003c/div>\n\u003c/section>\n\n\u003csection class=\"lesson\">\n\u003ch2>🔌 3-modul: Elektr o‘tkazgichlar\u003c/h2>\n\u003cdiv class=\"card\">\n\u003cp>Elektr zaryadlarining nisbatan oson harakatlanishiga imkon beradigan moddalar \u003cb>elektr o‘tkazgichlar\u003c/b> deyiladi.\u003c/p>\n\u003cp>\u003cb>Mis, alyuminiy, temir, kumush, grafit\u003c/b> — o‘tkazgichlarga misol.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"stage\">\n\u003ch3>🔵 Metall ichidagi erkin elektronlar\u003c/h3>\n\u003cdiv class=\"electron-box\">\n\u003cspan class=\"electron\" style=\"top:20px\">\u003c/span>\n\u003cspan class=\"electron\" style=\"top:60px;animation-delay:.7s\">\u003c/span>\n\u003cspan class=\"electron\" style=\"top:100px;animation-delay:1.4s\">\u003c/span>\n\u003cspan class=\"electron\" style=\"top:35px;animation-delay:2s\">\u003c/span>\n\u003c/div>\n\u003cp>🔵 Elektronlar metall ichida harakatlana oladi.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"card\">\n\u003cb>❓ Savol:\u003c/b> Elektr toki metall ichida nima sababdan oson harakatlanadi?\u003cbr>\u003cbr>\n\u003cb>Javob:\u003c/b> Metallarda erkin elektronlar mavjud.\n\u003c/div>\n\u003c/section>\n\n\u003csection class=\"lesson\">\n\u003ch2>🧱 4-modul: O‘tkazgich va dielektrik\u003c/h2>\n\u003cdiv class=\"card\">\n\u003ctable style=\"width:100%;border-collapse:collapse\">\n\u003ctr>\u003cth style=\"padding:10px;border:1px solid #94a3b8\">🟢 O‘tkazgichlar\u003c/th>\u003cth style=\"padding:10px;border:1px solid #94a3b8\">🔴 Dielektriklar\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:10px;border:1px solid #94a3b8\">Mis\u003c/td>\u003ctd style=\"padding:10px;border:1px solid #94a3b8\">Rezina\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:10px;border:1px solid #94a3b8\">Alyuminiy\u003c/td>\u003ctd style=\"padding:10px;border:1px solid #94a3b8\">Plastmassa\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:10px;border:1px solid #94a3b8\">Temir\u003c/td>\u003ctd style=\"padding:10px;border:1px solid #94a3b8\">Shisha\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:10px;border:1px solid #94a3b8\">Kumush\u003c/td>\u003ctd style=\"padding:10px;border:1px solid #94a3b8\">Quruq yog‘och\u003c/td>\u003c/tr>\n\u003c/table>\n\u003c/div>\n\u003cdiv class=\"card\">\n\u003ch3>💡 Nega elektr simining ichi metall, tashqarisi plastmassa?\u003c/h3>\n\u003cp>Metall qism elektr tokini o‘tkazadi. Plastmassa yoki rezina esa izolyatsiya va himoya vazifasini bajaradi.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"card\">\n\u003ch3>🎮 “O‘tkazgichmi yoki dielektrikmi?”\u003c/h3>\n\u003ch2 id=\"material\" style=\"text-align:center\">MIS\u003c/h2>\n\u003cbutton onclick=\"materialAnswer('o')\">🟢 O‘tkazgich\u003c/button>\n\u003cbutton class=\"secondary\" onclick=\"materialAnswer('d')\">🔴 Dielektrik\u003c/button>\n\u003cp id=\"materialResult\" style=\"text-align:center;font-weight:bold\">\u003c/p>\n\u003cp id=\"materialScore\" style=\"text-align:center\">Ball: 0\u003c/p>\n\u003c/div>\n\u003c/section>\n\n\u003csection class=\"lesson\">\n\u003ch2>📝 5-modul: Mini-test\u003c/h2>\n\u003cdiv id=\"quiz\">\u003c/div>\n\u003cdiv id=\"quizScore\" class=\"score\">\u003c/div>\n\u003c/section>\n\n\u003csection class=\"lesson\">\n\u003ch2>🏆 Dars yakuni\u003c/h2>\n\u003cdiv class=\"card\">\n\u003ch3>Bugun nimalarni bilib oldik?\u003c/h3>\n\u003cul>\n\u003cli>Elektr zaryadi musbat va manfiy bo‘ladi.\u003c/li>\n\u003cli>Elektron manfiy, proton musbat zaryadli.\u003c/li>\n\u003cli>Bir xil zaryadlar itarishadi.\u003c/li>\n\u003cli>Har xil zaryadlar tortishadi.\u003c/li>\n\u003cli>Metallarda erkin elektronlar mavjud.\u003c/li>\n\u003cli>O‘tkazgichlar tokni yaxshi o‘tkazadi.\u003c/li>\n\u003cli>Dielektriklar tokni yomon o‘tkazadi.\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003cdiv class=\"card\">\n\u003ch3>🏠 Uyga vazifa\u003c/h3>\n\u003cp>Uyda elektr o‘tkazgich va dielektriklardan foydalaniladigan 10 ta buyumni topib, jadval tuzing.\u003c/p>\n\u003c/div>\n\u003c/section>\n\n\u003cdiv class=\"nav\">\n\u003cbutton id=\"prev\" class=\"secondary\" onclick=\"prevLesson()\">⬅ Orqaga\u003c/button>\n\u003cbutton id=\"next\" onclick=\"nextLesson()\">Keyingi ➡\u003c/button>\n\u003c/div>\n\u003cp id=\"pageInfo\" style=\"text-align:center\">\u003c/p>\n\n\u003c/main>\n\n\u003cscript>\nlet current=0;\nconst lessons=document.querySelectorAll('.lesson');\n\nfunction showLesson(){\n  lessons.forEach((x,i)=>x.classList.toggle('active',i===current));\n  document.getElementById('prev').disabled=current===0;\n  document.getElementById('next').disabled=current===lessons.length-1;\n  document.getElementById('pageInfo').textContent=`Bo‘lim ${current+1} / ${lessons.length}`;\n  window.scrollTo({top:0,behavior:'smooth'});\n}\nfunction nextLesson(){if(current\u003clessons.length-1){current++;showLesson();}}\nfunction prevLesson(){if(current>0){current--;showLesson();}}\n\nfunction rubBall(){\n  document.querySelectorAll('.paper').forEach((p,i)=>setTimeout(()=>p.classList.add('pulled'),i*120));\n  document.getElementById('ball').style.transform='scale(1.08)';\n  document.getElementById('ballText').innerHTML='⚡ \u003cb>Natija:\u003c/b> shar zaryadlandi va qog‘ozlarni tortmoqda!';\n}\nfunction resetBall(){\n  document.querySelectorAll('.paper').forEach(p=>p.classList.remove('pulled'));\n  document.getElementById('ball').style.transform='';\n  document.getElementById('ballText').textContent='Avval “Ishqalash” tugmasini bosing.';\n}\nfunction transferElectron(){\n  const e=document.getElementById('movingElectron');\n  e.animate([{cx:'235px'},{cx:'470px'}],{duration:1000,fill:'forwards'});\n  document.getElementById('transferText').textContent='⚡ Elektron A jismdan B jismga ko‘chdi!';\n}\n\nconst materials=[\n['MIS','o'],['REZINA','d'],['ALYUMINIY','o'],['SHISHA','d'],\n['TEMIR','o'],['PLASTMASSA','d'],['KUMUSH','o'],['GRAFIT','o'],\n['QURUQ YOG‘OCH','d'],['TUZLI SUV','o'],['KERAMIKA','d'],\n['MIS SIM','o'],['REZINA QO‘LQOP','d'],['ALYUMINIY FOLGA','o'],\n['PLASTMASSA LINEYKA','d']\n];\nlet mi=0,ms=0;\nfunction materialAnswer(ans){\n  if(mi>=materials.length)return;\n  if(ans===materials[mi][1]){\n    ms++;\n    document.getElementById('materialResult').textContent='✅ To‘g‘ri!';\n  }else{\n    document.getElementById('materialResult').textContent='❌ Noto‘g‘ri!';\n  }\n  document.getElementById('materialScore').textContent=`Ball: ${ms}`;\n  mi++;\n  if(mi\u003cmaterials.length)document.getElementById('material').textContent=materials[mi][0];\n  else{\n    document.getElementById('material').textContent='🎉 O‘yin tugadi!';\n    document.querySelectorAll('[onclick^=\"materialAnswer\"]').forEach(b=>b.disabled=true);\n  }\n}\n\nconst questions=[\n['Elektr zaryadining nechta turi mavjud?',['1','2','3','4'],1],\n['Elektron qanday zaryadlangan?',['Musbat','Manfiy','Zaryadsiz'],1],\n['Proton qanday zaryadga ega?',['Musbat','Manfiy','Zaryadsiz'],0],\n['Bir xil zaryadlar qanday ta’sirlashadi?',['Tortishadi','Itarishadi','Ta’sirlashmaydi'],1],\n['Har xil zaryadlar qanday ta’sirlashadi?',['Itarishadi','Tortishadi','Yo‘qoladi'],1],\n['Qaysi biri o‘tkazgich?',['Rezina','Shisha','Mis','Plastmassa'],2],\n['Qaysi biri dielektrik?',['Mis','Kumush','Rezina','Temir'],2],\n['Metallarda elektr tokini tashuvchi zarrachalardan biri nima?',['Proton','Elektron','Neytron'],1],\n['Elektr zaryadining SI birligi nima?',['Volt','Amper','Kulon'],2],\n['Simning plastmassa qoplamasi nima uchun kerak?',['Tokni kuchaytirish','Himoya va izolyatsiya','Tok ishlab chiqarish'],1]\n];\n\nlet qScore=0;\nconst quiz=document.getElementById('quiz');\nquestions.forEach((q,i)=>{\n  const box=document.createElement('div');\n  box.className='card';\n  const title=document.createElement('h3');\n  title.textContent=`${i+1}. ${q[0]}`;\n  box.appendChild(title);\n  q[1].forEach((opt,j)=>{\n    const b=document.createElement('button');\n    b.className='quiz-option';\n    b.textContent=opt;\n    b.onclick=()=>{\n      box.querySelectorAll('button').forEach(x=>x.disabled=true);\n      if(j===q[2]){b.classList.add('correct');qScore++}\n      else{b.classList.add('wrong');box.querySelectorAll('button')[q[2]].classList.add('correct')}\n      document.getElementById('quizScore').textContent=`Natija: ${qScore} / ${questions.length}`;\n    };\n    box.appendChild(b);\n  });\n  quiz.appendChild(box);\n});\n\nshowLesson();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"title": "Zaryadlarning o'zaro ta'siri. Kulon qonuni", "icon": "🧲", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Kulon qonuni — HTML5 interaktiv simulyatsiya\u003c/title>\n\u003cstyle>\n*{box-sizing:border-box}\nbody{\n    margin:0;\n    font-family:Arial,Helvetica,sans-serif;\n    background:linear-gradient(135deg,#eaf4ff,#f8fbff);\n    color:#17324d;\n}\n.container{\n    max-width:1000px;\n    margin:0 auto;\n    padding:20px;\n}\nh1{text-align:center;color:#0b4f8a;margin:5px 0 8px}\n.subtitle{text-align:center;margin-bottom:20px;color:#52697d}\n.card{\n    background:white;\n    border-radius:18px;\n    padding:20px;\n    margin:16px 0;\n    box-shadow:0 6px 22px rgba(0,0,0,.10);\n}\n.controls{\n    display:grid;\n    grid-template-columns:1fr 1fr;\n    gap:15px;\n}\n.control-box{\n    border:1px solid #d6e4f0;\n    border-radius:14px;\n    padding:15px;\n}\nbutton{\n    border:0;\n    border-radius:10px;\n    padding:12px 18px;\n    margin:5px;\n    cursor:pointer;\n    font-size:16px;\n    font-weight:bold;\n}\n.rep{background:#d9ecff;color:#07528e}\n.att{background:#ffe1e1;color:#9a2222}\n.reset{background:#e8e8e8;color:#333}\ninput[type=range]{width:100%}\n.value{\n    font-size:20px;\n    font-weight:bold;\n    color:#0b5d9d;\n}\n.formula{\n    background:#f0f7ff;\n    border-left:5px solid #1976d2;\n    padding:15px;\n    border-radius:10px;\n    font-size:22px;\n    text-align:center;\n}\n#scene{\n    width:100%;\n    height:360px;\n    border-radius:16px;\n    background:radial-gradient(circle at center,#ffffff,#edf6ff);\n}\n.info{\n    display:grid;\n    grid-template-columns:repeat(3,1fr);\n    gap:12px;\n}\n.info div{\n    background:#f6f9fc;\n    padding:14px;\n    border-radius:12px;\n    text-align:center;\n}\n.info strong{display:block;font-size:20px;color:#0b5d9d;margin-bottom:5px}\nul{line-height:1.8}\n.note{\n    background:#fff8d8;\n    border-left:5px solid #e3b400;\n    padding:14px;\n    border-radius:10px;\n}\n@media(max-width:700px){\n    .controls,.info{grid-template-columns:1fr}\n    #scene{height:300px}\n}\n\u003c/style>\n\u003c/head>\n\n\u003cbody>\n\u003cdiv class=\"container\">\n\n\u003ch1>⚡ Zaryadlarning o‘zaro ta’siri\u003c/h1>\n\u003cdiv class=\"subtitle\">8-sinf Fizika — Kulon qonuni | Interaktiv HTML5 simulyatsiya\u003c/div>\n\n\u003cdiv class=\"card\">\n\u003ch2>📐 Kulon qonuni\u003c/h2>\n\u003cdiv class=\"formula\">\nF = k · |q₁ · q₂| / r²\n\u003c/div>\n\u003cp>\u003cb>F\u003c/b> — elektr kuchi (N)\u003c/p>\n\u003cp>\u003cb>q₁, q₂\u003c/b> — elektr zaryadlari (C)\u003c/p>\n\u003cp>\u003cb>r\u003c/b> — zaryadlar orasidagi masofa (m)\u003c/p>\n\u003cp>\u003cb>k = 9 × 10⁹ N·m²/C²\u003c/b> — Kulon doimiysi\u003c/p>\n\u003c/div>\n\n\u003cdiv class=\"card\">\n\u003ch2>🎛️ Simulyatsiya boshqaruvi\u003c/h2>\n\n\u003cdiv class=\"controls\">\n\u003cdiv class=\"control-box\">\n\u003ch3>Masofa: \u003cspan id=\"distanceText\" class=\"value\">3.0 m\u003c/span>\u003c/h3>\n\u003cinput id=\"distance\" type=\"range\" min=\"1\" max=\"5\" step=\"0.1\" value=\"3\">\n\u003cp>Masofa oshsa, elektr kuchi \u003cb>kamayadi\u003c/b>.\u003c/p>\n\u003c/div>\n\n\u003cdiv class=\"control-box\">\n\u003ch3>Zaryadlarning turi\u003c/h3>\n\u003cbutton class=\"rep\" onclick=\"setType('repulsion')\">＋ ＋ Itarilish\u003c/button>\n\u003cbutton class=\"att\" onclick=\"setType('attraction')\">＋ − Tortishish\u003c/button>\n\u003cbutton class=\"reset\" onclick=\"resetSim()\">🔄 Qayta boshlash\u003c/button>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"card\">\n\u003ch2>🔬 Jonli simulyatsiya\u003c/h2>\n\n\u003csvg id=\"scene\" viewBox=\"0 0 900 360\" xmlns=\"http://www.w3.org/2000/svg\">\n\n\u003cdefs>\n\u003cmarker id=\"arrowBlue\" markerWidth=\"12\" markerHeight=\"12\" refX=\"9\" refY=\"4\" orient=\"auto\">\n\u003cpath d=\"M0,0 L10,4 L0,8 Z\" fill=\"#1976d2\"/>\n\u003c/marker>\n\u003cmarker id=\"arrowRed\" markerWidth=\"12\" markerHeight=\"12\" refX=\"9\" refY=\"4\" orient=\"auto\">\n\u003cpath d=\"M0,0 L10,4 L0,8 Z\" fill=\"#d32f2f\"/>\n\u003c/marker>\n\u003c/defs>\n\n\u003cline x1=\"450\" y1=\"55\" x2=\"450\" y2=\"305\" stroke=\"#b9c9d8\" stroke-width=\"2\" stroke-dasharray=\"8 8\"/>\n\n\u003cline id=\"distanceLine\" x1=\"180\" y1=\"265\" x2=\"720\" y2=\"265\"\n      stroke=\"#607d8b\" stroke-width=\"3\"/>\n\u003ctext id=\"distanceSvg\" x=\"450\" y=\"295\" text-anchor=\"middle\"\n      font-size=\"20\" fill=\"#455a64\">r = 3.0 m\u003c/text>\n\n\u003ccircle id=\"charge1\" cx=\"270\" cy=\"160\" r=\"55\" fill=\"#1976d2\"/>\n\u003ccircle id=\"charge2\" cx=\"630\" cy=\"160\" r=\"55\" fill=\"#d32f2f\"/>\n\n\u003ctext id=\"q1Text\" x=\"270\" y=\"173\" text-anchor=\"middle\"\n      font-size=\"48\" font-weight=\"bold\" fill=\"white\">+\u003c/text>\n\u003ctext id=\"q2Text\" x=\"630\" y=\"173\" text-anchor=\"middle\"\n      font-size=\"48\" font-weight=\"bold\" fill=\"white\">+\u003c/text>\n\n\u003ctext x=\"270\" y=\"90\" text-anchor=\"middle\" font-size=\"20\">q₁ = +2 μC\u003c/text>\n\u003ctext x=\"630\" y=\"90\" text-anchor=\"middle\" font-size=\"20\">q₂ = +3 μC\u003c/text>\n\n\u003cline id=\"force1\" x1=\"210\" y1=\"160\" x2=\"130\" y2=\"160\"\n      stroke=\"#1976d2\" stroke-width=\"7\" marker-end=\"url(#arrowBlue)\"/>\n\u003cline id=\"force2\" x1=\"690\" y1=\"160\" x2=\"770\" y2=\"160\"\n      stroke=\"#d32f2f\" stroke-width=\"7\" marker-end=\"url(#arrowRed)\"/>\n\n\u003ctext id=\"stateText\" x=\"450\" y=\"335\" text-anchor=\"middle\"\n      font-size=\"22\" font-weight=\"bold\">Zaryadlar bir-birini itaradi\u003c/text>\n\n\u003c/svg>\n\n\u003cdiv class=\"info\">\n\u003cdiv>\n\u003cstrong id=\"forceValue\">0.0060 N\u003c/strong>\nElektr kuchi F\n\u003c/div>\n\u003cdiv>\n\u003cstrong id=\"distanceValue\">3.0 m\u003c/strong>\nMasofa r\n\u003c/div>\n\u003cdiv>\n\u003cstrong id=\"typeValue\">Itarilish\u003c/strong>\nTa’sir turi\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"card\">\n\u003ch2>📚 Tajriba mazmuni\u003c/h2>\n\u003cp>\nCharlz-Ogyusten Kulon burama tarozi yordamida elektr zaryadlari orasidagi\no‘zaro ta’sir kuchini tajribada o‘rgangan.\n\u003c/p>\n\u003cul>\n\u003cli>Zaryadlar bir xil ishorali bo‘lsa — \u003cb>itarishadi\u003c/b>.\u003c/li>\n\u003cli>Zaryadlar qarama-qarshi ishorali bo‘lsa — \u003cb>tortishadi\u003c/b>.\u003c/li>\n\u003cli>Zaryad miqdori oshsa, kuch ham oshadi.\u003c/li>\n\u003cli>Masofa 2 marta oshsa, kuch 4 marta kamayadi.\u003c/li>\n\u003cli>Masofa 3 marta oshsa, kuch 9 marta kamayadi.\u003c/li>\n\u003c/ul>\n\u003c/div>\n\n\u003cdiv class=\"card\">\n\u003ch2>🧠 Eslab qoling!\u003c/h2>\n\u003cdiv class=\"note\">\n\u003cb>Kulon qonuni:\u003c/b> ikki nuqtaviy zaryad orasidagi o‘zaro ta’sir kuchi\nzaryadlar ko‘paytmasiga to‘g‘ri, ular orasidagi masofaning kvadratiga\nteskari proporsional.\n\u003c/div>\n\u003c/div>\n\n\u003c/div>\n\n\u003cscript>\nconst k = 9e9;\nconst q1 = 2e-6;\nconst q2 = 3e-6;\n\nlet type = \"repulsion\";\n\nconst distanceSlider = document.getElementById(\"distance\");\nconst distanceText = document.getElementById(\"distanceText\");\nconst distanceValue = document.getElementById(\"distanceValue\");\nconst forceValue = document.getElementById(\"forceValue\");\nconst typeValue = document.getElementById(\"typeValue\");\nconst distanceSvg = document.getElementById(\"distanceSvg\");\nconst charge1 = document.getElementById(\"charge1\");\nconst charge2 = document.getElementById(\"charge2\");\nconst q2Text = document.getElementById(\"q2Text\");\nconst force1 = document.getElementById(\"force1\");\nconst force2 = document.getElementById(\"force2\");\nconst stateText = document.getElementById(\"stateText\");\n\nfunction update(){\n    const r = parseFloat(distanceSlider.value);\n\n    const F = k * Math.abs(q1*q2) / (r*r);\n\n    distanceText.textContent = r.toFixed(1) + \" m\";\n    distanceValue.textContent = r.toFixed(1) + \" m\";\n    distanceSvg.textContent = \"r = \" + r.toFixed(1) + \" m\";\n    forceValue.textContent = F.toFixed(4) + \" N\";\n\n    // Zaryadlarning ekrandagi joylashuvi masofaga mos ravishda o'zgaradi\n    const center = 450;\n    const half = 100 + (r-1)*65;\n    const x1 = center - half;\n    const x2 = center + half;\n\n    charge1.setAttribute(\"cx\", x1);\n    charge2.setAttribute(\"cx\", x2);\n\n    document.querySelector('text[x=\"270\"]').setAttribute(\"x\",x1);\n    document.querySelector('text[x=\"630\"]').setAttribute(\"x\",x2);\n\n    document.getElementById(\"q1Text\").setAttribute(\"x\",x1);\n    q2Text.setAttribute(\"x\",x2);\n\n    // Kuch strelkalari\n    if(type === \"repulsion\"){\n        force1.setAttribute(\"x1\",x1-55);\n        force1.setAttribute(\"x2\",x1-120);\n        force2.setAttribute(\"x1\",x2+55);\n        force2.setAttribute(\"x2\",x2+120);\n    }else{\n        force1.setAttribute(\"x1\",x1-55);\n        force1.setAttribute(\"x2\",x1+25);\n        force2.setAttribute(\"x1\",x2+55);\n        force2.setAttribute(\"x2\",x2-25);\n    }\n}\n\nfunction setType(newType){\n    type = newType;\n\n    if(type === \"repulsion\"){\n        q2Text.textContent = \"+\";\n        charge2.setAttribute(\"fill\",\"#d32f2f\");\n        typeValue.textContent = \"Itarilish\";\n        stateText.textContent = \"Zaryadlar bir-birini itaradi\";\n        stateText.setAttribute(\"fill\",\"#1976d2\");\n    }else{\n        q2Text.textContent = \"−\";\n        charge2.setAttribute(\"fill\",\"#8e44ad\");\n        typeValue.textContent = \"Tortishish\";\n        stateText.textContent = \"Zaryadlar bir-birini tortadi\";\n        stateText.setAttribute(\"fill\",\"#8e44ad\");\n    }\n\n    update();\n}\n\nfunction resetSim(){\n    distanceSlider.value = 3;\n    setType(\"repulsion\");\n}\n\ndistanceSlider.addEventListener(\"input\", update);\n\nupdate();\n\u003c/script>\n\n\u003c/body>\n\u003c/html>\n"}, {"title": "Elektr maydon", "icon": "🌐", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Elektr maydon — 8-sinf fizika\u003c/title>\n\u003cstyle>\n:root{--bg:#f1f5f9;--c:#fff;--t:#0f172a;--m:#475569;--a:#2563eb;--b:#cbd5e1}\n@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1220;--c:#16213a;--t:#f1f5f9;--m:#a9b6cc;--a:#60a5fa;--b:#2c3b5a}}\n:root[data-theme=dark]{--bg:#0b1220;--c:#16213a;--t:#f1f5f9;--m:#a9b6cc;--a:#60a5fa;--b:#2c3b5a}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;font-size:clamp(17px,1.2vw + 11px,24px);line-height:1.4}\nheader{display:flex;align-items:center;gap:12px;padding:10px 14px}\nh1{font-size:1.4em;margin:0;flex:1}\nbutton{font:inherit;color:var(--t);background:var(--c);border:2px solid var(--b);border-radius:12px;padding:.5em .9em;min-height:48px;cursor:pointer;touch-action:manipulation}\nbutton.on{background:var(--a);border-color:var(--a);color:#fff;font-weight:700}\nnav,.modes{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 10px}\nnav button{flex:1 1 200px}\nmain{display:grid;grid-template-columns:minmax(0,2fr) minmax(270px,1fr);gap:14px;padding:0 14px 14px}\n@media(max-width:820px){main{grid-template-columns:1fr}}\ncanvas{width:100%;height:58vh;min-height:300px;display:block;border-radius:14px;touch-action:none;background:#0b1220}\naside{display:flex;flex-direction:column;gap:10px}\n.box{background:var(--c);border:2px solid var(--b);border-radius:14px;padding:12px 14px}\n#cap{font-weight:700;color:var(--a)}\n#ctl{display:flex;flex-direction:column;gap:8px}\n#ctl input{width:100%;height:32px;accent-color:var(--a)}\n#read{white-space:pre-line;font-weight:600}\n#sum{border-color:var(--a)}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\u003ch1>⚡ Elektr maydon\u003c/h1>\u003cbutton id=\"th\" onclick=\"theme()\">🌓 Rejim\u003c/button>\u003c/header>\n\u003cnav id=\"tabs\">\n\u003cbutton onclick=\"go(0)\">1. Maydon tushunchasi\u003c/button>\n\u003cbutton onclick=\"go(1)\">2. Kuchlanganlik va kuch chiziqlari\u003c/button>\n\u003cbutton onclick=\"go(2)\">3. Maydonning zaryadga ta'siri\u003c/button>\n\u003c/nav>\n\u003cdiv class=\"modes\" id=\"modes\">\u003cbutton onclick=\"go(null,0)\">▶ Animatsiya\u003c/button>\u003cbutton onclick=\"go(null,1)\">🧪 Simulyatsiya\u003c/button>\u003c/div>\n\u003cmain>\n\u003ccanvas id=\"cv\">\u003c/canvas>\n\u003caside>\n\u003cdiv class=\"box\" id=\"cap\">\u003c/div>\n\u003cdiv class=\"box\" id=\"ctl\">\u003c/div>\n\u003cdiv class=\"box\" id=\"read\">\u003c/div>\n\u003cdiv class=\"box\" id=\"sum\">\u003c/div>\n\u003c/aside>\n\u003c/main>\n\u003cscript>\nconst $=s=>document.querySelector(s),cv=$('#cv'),cx=cv.getContext('2d');\nlet W,H,sec=0,sim=0,t=0,ci=-1,L2=[],tp=null,pr=null,ch1=[],pick=1,A1=1,run=1,B=[],rt=0,drag=null;\nconst P={q1:3,q2:-3,qs:3,E:5,sg:1};\nconst SUM=[\"Xulosa: elektr maydon zaryadni o'rab turadi. U moddiy, ko'zga ko'rinmaydi, lekin boshqa zaryadga kuch bilan ta'sir qiladi. Zaryaddan uzoqlashgan sari maydon susayadi.\",\n\"Xulosa: kuchlanganlik E = F / q. Birligi: 1 N/Kl. Kuch chiziqlari musbat zaryaddan chiqib, manfiy zaryadga kiradi. Chiziqlar zich joyda maydon kuchli.\",\n\"Xulosa: maydondagi zaryadga F = q·E kuch ta'sir qiladi. Musbat zaryadga kuch maydon yo'nalishida, manfiy zaryadga unga qarama-qarshi. Maydon kuchaysa, kuch ham ortadi.\"];\nconst CAP=[[\"Zaryad atrofida maydon paydo bo'ladi va to'lqinday yoyiladi.\",\"Maydon — materiyaning bir turi: ko'rinmaydi, lekin haqiqatan mavjud.\",\"Zaryaddan uzoqlashgan sari maydon susayadi (ustunlar pasayadi).\"],\n[\"Kuch chiziqlari musbat (qizil) zaryaddan chiqadi.\",\"Kuch chiziqlari manfiy (ko'k) zaryadga kiradi.\",\"Chiziqlar zich joyda maydon kuchli, siyrak joyda kuchsiz.\"],\n[\"Musbat zaryad maydon yo'nalishida (pastga) harakatlanadi.\",\"Manfiy zaryad maydonga qarama-qarshi (yuqoriga) harakatlanadi.\",\"Kuch yo'nalishi zaryad ishorasiga bog'liq.\"]];\nconst SU='⁰¹²³⁴⁵⁶⁷⁸⁹';\nfunction fm(v){v=Math.abs(v);if(!v)return'0';let e=Math.floor(Math.log10(v)),m=v/10**e;if(m>=9.95){m=1;e++}\nconst s=(''+e).replace('-','⁻').replace(/\\d/g,d=>SU[d]);return m.toFixed(1).replace('.',',')+(e?'·10'+s:'')}\nfunction fit(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);rebuild()}\nfunction cs2(){if(!sim)return[{x:W*.3,y:H/2,q:3},{x:W*.7,y:H/2,q:-3}];\nreturn(P.q2==0?[{x:W/2,y:H/2,q:P.q1}]:[{x:W*.3,y:H/2,q:P.q1},{x:W*.7,y:H/2,q:P.q2}]).filter(c=>c.q)}\nfunction rebuild(){L2=lines(cs2());if(!tp||tp.x>W)tp={x:W*.75,y:H*.3};if(!pr||pr.x>W)pr={x:W/2,y:H*.25};resetB()}\nfunction Evec(p,cs){let x=0,y=0;for(const c of cs){const dx=p.x-c.x,dy=p.y-c.y,r2=Math.max(dx*dx+dy*dy,100),r=Math.sqrt(r2),m=9e9*c.q/r2;x+=m*dx/r;y+=m*dy/r}return{x,y}}\nfunction lines(cs){const L=[];for(const c of cs){if(!c.q)continue;const n=Math.round(6*Math.abs(c.q)),s=c.q>0?1:-1;\nfor(let i=0;i\u003cn;i++){const a=2*Math.PI*(i+.5)/n;let p={x:c.x+10*Math.cos(a),y:c.y+10*Math.sin(a)};const pts=[p];let end=null;\nfor(let k=0;k\u003c900;k++){const e=Evec(p,cs),m=Math.hypot(e.x,e.y)||1;p={x:p.x+s*4*e.x/m,y:p.y+s*4*e.y/m};pts.push(p);\nif(p.x\u003c-20||p.x>W+20||p.y\u003c-20||p.y>H+20)break;\nconst h=cs.find(d=>d!==c&&Math.hypot(p.x-d.x,p.y-d.y)\u003c9);if(h){end=h;break}}\nif(c.q\u003c0){if(end&&end.q>0)continue;pts.reverse()}L.push(pts)}}return L}\nfunction head(a,b,col,hd){const an=Math.atan2(b.y-a.y,b.x-a.x);cx.fillStyle=col;cx.beginPath();cx.moveTo(b.x,b.y);\ncx.lineTo(b.x-hd*Math.cos(an-.45),b.y-hd*Math.sin(an-.45));cx.lineTo(b.x-hd*Math.cos(an+.45),b.y-hd*Math.sin(an+.45));cx.fill()}\nfunction arr(a,b,col,w,hd){cx.setLineDash([]);cx.strokeStyle=col;cx.lineWidth=w;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke();head(a,b,col,hd)}\nfunction drawLines(L){cx.lineWidth=2;for(const pts of L){cx.strokeStyle='#fde68a';cx.setLineDash([12,10]);cx.lineDashOffset=-t*40;\ncx.beginPath();pts.forEach((p,i)=>i?cx.lineTo(p.x,p.y):cx.moveTo(p.x,p.y));cx.stroke();cx.setLineDash([]);\nif(pts.length>24){const m=pts.length>>1;head(pts[m-1],pts[m],'#fde68a',10)}}}\nfunction glow(c,R){const g=cx.createRadialGradient(c.x,c.y,0,c.x,c.y,R),k=c.q>0?'239,68,68':'59,130,246';\ng.addColorStop(0,`rgba(${k},.5)`);g.addColorStop(1,`rgba(${k},0)`);cx.fillStyle=g;cx.fillRect(c.x-R,c.y-R,2*R,2*R)}\nfunction chg(c,r){cx.beginPath();cx.arc(c.x,c.y,r,0,7);cx.fillStyle=c.q>0?'#ef4444':'#3b82f6';cx.fill();cx.strokeStyle='#fff';cx.lineWidth=2;cx.stroke();\ncx.fillStyle='#fff';cx.font='bold 24px sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(c.q>0?'+':'−',c.x,c.y+1)}\nfunction txt(s,x,y,col,sz){cx.fillStyle=col||'#fff';cx.font=`bold ${sz||16}px sans-serif`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(s,x,y)}\nfunction say(s){const r=$('#read');if(r.textContent!==s)r.textContent=s}\n\nfunction d1a(){const c={x:W/2,y:H/2-20,q:A1*3},R=Math.min(W,H)*.5;glow(c,R*1.1);\nfor(let i=0;i\u003c4;i++){const f=(t*.35+i/4)%1;cx.strokeStyle=`rgba(253,230,138,${(1-f)**2*.9})`;cx.lineWidth=3;cx.beginPath();cx.arc(c.x,c.y,18+f*R*1.6,0,7);cx.stroke()}\nchg(c,18);const u=Math.min(W/2-30,240)/3.2,by=c.y+70,E1=9e9*3/(u*u);\n[1,2,3].forEach(k=>{const d=k*u,x=c.x+d,E=9e9*3/(d*d),h=90*E/E1;cx.fillStyle='#fde68a';cx.fillRect(x-8,by-h,16,h);\ncx.beginPath();cx.arc(x,by+8,6,0,7);cx.fillStyle='#fff';cx.fill();txt(fm(E),x,by-h-10,'#fde68a',14)});\ntxt(\"Ustun balandligi — maydon kuchi (N/Kl)\",W/2,H-16,'#cbd5e1',15);\nsay(\"Zaryaddan masofa ortsa, maydon kuchi kamayadi.\\nTugma bilan zaryad ishorasini almashtiring.\")}\nfunction d1s(){for(const c of ch1)glow(c,150);ch1.forEach(c=>chg(c,18));\nconst E=Evec(tp,ch1),m=Math.hypot(E.x,E.y),F=m*1e-3;\nif(m>1){const len=15+25*Math.log10(1+F);arr(tp,{x:tp.x+len*E.x/m,y:tp.y+len*E.y/m},'#22c55e',5,14)}\ncx.beginPath();cx.arc(tp.x,tp.y,11,0,7);cx.fillStyle='#fff';cx.fill();cx.lineWidth=4;cx.strokeStyle='#facc15';cx.stroke();txt('q₀',tp.x,tp.y-26,'#facc15',16);\nsay((ch1.length?`Sinov zaryadiga ta'sir kuchi: ${fm(F)} µN\\nDemak, bu nuqtada elektr maydon bor!`:\"Maydon yo'q: sinov zaryadiga kuch ta'sir qilmayapti.\\nEkranga bosib zaryad qo'ying.\")+`\\nTanlangan: ${pick>0?'musbat':'manfiy'} zaryad (eng ko'pi 4 ta)`)}\nfunction d2(){const cs=cs2();cs.forEach(c=>glow(c,130));drawLines(L2);cs.forEach(c=>chg(c,18));\nif(!sim)return say(\"Rangli doiralar: zaryadlar.\\nSariq chiziqlar yo'nalishi: + dan − ga.\");\nconst E=Evec(pr,cs),m=Math.hypot(E.x,E.y);\nif(m>1){const len=30+22*Math.log10(1+m/1e4);arr(pr,{x:pr.x+len*E.x/m,y:pr.y+len*E.y/m},'#fff',5,14);txt('E',pr.x+(len+16)*E.x/m,pr.y+(len+16)*E.y/m,'#fff',20)}\ncx.beginPath();cx.arc(pr.x,pr.y,8,0,7);cx.fillStyle='#22c55e';cx.fill();cx.strokeStyle='#fff';cx.lineWidth=2;cx.stroke();\nsay(`Sinov zaryadi q₀ = 1 nKl\\nF = ${fm(m*1e-9)} N\\nE = F / q₀ = ${fm(m)} N/Kl`)}\nfunction resetB(){rt=0;const mid=(H*.14+H*.86)/2;B=sim?[{s:P.sg,x:W/2,y:mid,v:0}]:[{s:1,x:W/3,y:mid,v:0},{s:-1,x:2*W/3,y:mid,v:0}]}\nfunction d3(dt){const top=H*.14,bot=H*.86,x0=W*.06,x1=W*.94,qv=sim?P.qs:3,Ev=sim?P.E:5,F=qv*Ev;\ncx.fillStyle='#ef4444';cx.fillRect(x0,top-12,x1-x0,12);cx.fillStyle='#3b82f6';cx.fillRect(x0,bot,x1-x0,12);\nfor(let x=x0+20;x\u003cx1;x+=44){txt('+',x,top-26,'#ef4444',22);txt('−',x,bot+28,'#3b82f6',22)}\nconst n=3+Ev;for(let i=0;i\u003cn;i++){const x=x0+(i+.5)*(x1-x0)/n;cx.strokeStyle='#fde68a';cx.lineWidth=2;cx.setLineDash([10,8]);cx.lineDashOffset=-t*40;\ncx.beginPath();cx.moveTo(x,top);cx.lineTo(x,bot);cx.stroke();cx.setLineDash([]);head({x,y:top},{x,y:(top+bot)/2+50},'#fde68a',10)}\ntxt('E ↓',x1-24,(top+bot)/2,'#fde68a',20);\nfor(const b of B){if(!b.done&&(run||!sim)){b.v+=b.s*F*6*dt;b.y+=b.v*dt;const lo=top+18,hi=bot-18;if(b.y\u003c=lo){b.y=lo;b.done=1}if(b.y>=hi){b.y=hi;b.done=1}}\nchg({x:b.x,y:b.y,q:b.s},17);if(!b.done){const len=Math.min(90,15+F*2);arr({x:b.x,y:b.y+b.s*22},{x:b.x,y:b.y+b.s*(22+len)},'#22c55e',5,14);txt('F',b.x+18,b.y+b.s*(22+len/2),'#22c55e',20)}}\nif(!sim&&B.every(b=>b.done)&&(rt+=dt)>1.5)resetB();\nsay(sim?`F = q·E = ${qv} nKl × ${Ev} kN/Kl = ${qv*Ev} µN\\n${P.sg>0?\"Musbat zaryad: kuch maydon yo'nalishida (pastga)\":\"Manfiy zaryad: kuch maydonga qarama-qarshi (yuqoriga)\"}\\n${run?'Harakat davom etmoqda':'To\\'xtatilgan'}`:`F = q·E = 3 nKl × 5 kN/Kl = 15 µN\\nYashil strelka — zaryadga ta'sir etuvchi kuch.`)}\nfunction tick(ms){const dt=Math.min(.05,(ms-tick.l)/1000||0);tick.l=ms;t+=dt;cx.fillStyle='#0b1220';cx.fillRect(0,0,W,H);\nif(sec==0)sim?d1s():d1a();else if(sec==1)d2();else d3(dt);\nif(!sim){const i=Math.floor(t/4)%3;if(i!=ci){ci=i;$('#cap').textContent=CAP[sec][i]}}\nrequestAnimationFrame(tick)}\nconst Bt=(js,l)=>`\u003cbutton onclick=\"${js}\">${l}\u003c/button>`;\nconst Sl=(id,l,a,b,v,u)=>`\u003clabel>${l}: \u003cb id=\"o_${id}\">${v}\u003c/b> ${u}\u003c/label>\u003cinput type=\"range\" min=\"${a}\" max=\"${b}\" step=\"1\" value=\"${v}\" oninput=\"P['${id}']=+this.value;$('#o_${id}').textContent=this.value;if(sec==1)L2=lines(cs2())\">`;\nfunction ui(){let h='',c='';\nif(sec==0){h=sim?Bt('pick=1','＋ Musbat zaryad')+Bt('pick=-1','− Manfiy zaryad')+Bt('ch1=[]','Tozalash'):Bt('A1=-A1','Zaryad ishorini almashtirish');if(sim)c=\"Ekranga bosib zaryad qo'ying. Sariq sinov zaryadini barmoq bilan suring.\"}\nif(sec==1&&sim){h=Bt('pre(3,0)','Bitta zaryad')+Bt('pre(3,-3)','Ikki xil ishorali')+Bt('pre(3,3)','Ikki bir xil ishorali')+Sl('q1','1-zaryad',-5,5,P.q1,'µKl')+Sl('q2','2-zaryad',-5,5,P.q2,'µKl');c=\"Ekranga bosib (yoki surib) kuchlanganlikni o'lchaydigan nuqtani tanlang.\"}\nif(sec==2&&sim){h=Bt('P.sg=1;resetB()','＋ Musbat zaryad')+Bt('P.sg=-1;resetB()','− Manfiy zaryad')+Sl('qs','Zaryad miqdori',1,5,P.qs,'nKl')+Sl('E','Maydon kuchlanganligi',1,10,P.E,'kN/Kl')+Bt('run=1','▶ Boshlash')+Bt(\"run=0\",\"⏸ To'xtatish\")+Bt('resetB();run=0','↺ Qayta boshlash');c=\"Parametrlarni tanlang va «Boshlash» tugmasini bosing.\"}\n$('#ctl').innerHTML=h;$('#ctl').style.display=h?'':'none';if(c)$('#cap').textContent=c}\nfunction pre(a,b){P.q1=a;P.q2=b;ui();rebuild()}\nfunction go(s,m){if(s!=null)sec=s;if(m!=null)sim=m;ci=-1;run=!sim;\ndocument.querySelectorAll('#tabs button').forEach((b,i)=>b.classList.toggle('on',i==sec));\ndocument.querySelectorAll('#modes button').forEach((b,i)=>b.classList.toggle('on',i==sim));\n$('#sum').textContent=SUM[sec];ui();if(W)rebuild()}\nfunction theme(){const d=document.documentElement,dk=d.dataset.theme?d.dataset.theme=='dark':matchMedia('(prefers-color-scheme: dark)').matches;d.dataset.theme=dk?'light':'dark'}\nconst pp=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};\ncv.onpointerdown=e=>{if(!sim)return;const p=pp(e);cv.setPointerCapture(e.pointerId);\nif(sec==0){if(Math.hypot(p.x-tp.x,p.y-tp.y)\u003c40)drag='t';else if(ch1.length\u003c4)ch1.push({x:p.x,y:p.y,q:3*pick})}\nif(sec==1){pr=p;drag='p'}};\ncv.onpointermove=e=>{if(!drag)return;const p=pp(e);if(drag=='t')tp=p;else pr=p};\ncv.onpointerup=cv.onpointercancel=()=>drag=null;\naddEventListener('resize',fit);\ngo(0,0);fit();requestAnimationFrame(tick);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"title": "O'tkazgichlarda zaryadlarning taqsimlanishi", "icon": "🛡️", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>8-sinf fizika — O‘tkazgichlarda elektr zaryadlarining taqsimlanishi\u003c/title>\n\u003cstyle>\n:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--accent:#2563eb;--accent2:#0ea5e9;--good:#16a34a;--warn:#f59e0b}\n*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}\nheader{background:linear-gradient(135deg,#1d4ed8,#0ea5e9);color:white;padding:38px 20px;text-align:center}\nheader h1{margin:0 0 8px;font-size:clamp(28px,5vw,48px)} header p{margin:6px auto;max-width:850px}\nnav{position:sticky;top:0;z-index:5;background:#0f172a;padding:10px;display:flex;gap:8px;overflow:auto}\nnav a{color:white;text-decoration:none;padding:8px 12px;border-radius:8px;white-space:nowrap;font-size:14px}nav a:hover{background:#334155}\nmain{max-width:1100px;margin:auto;padding:24px 16px}.card{background:var(--card);border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 5px 20px #0000000d}\nh2{color:#1d4ed8;border-bottom:2px solid #dbeafe;padding-bottom:8px}h3{color:#0369a1}\nstrong{color:#0f172a}.badge{display:inline-block;background:#dbeafe;color:#1d4ed8;padding:4px 10px;border-radius:20px;font-weight:bold}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.box{background:#f8fafc;border-left:5px solid var(--accent);padding:15px;border-radius:10px}\n.formula{background:#eff6ff;border:1px solid #bfdbfe;padding:16px;border-radius:12px;font-size:20px;text-align:center;margin:12px 0}\ntable{width:100%;border-collapse:collapse;margin:12px 0}th,td{border:1px solid #cbd5e1;padding:10px;text-align:left}th{background:#e0f2fe}\n.anim{border:2px dashed #60a5fa;border-radius:16px;padding:20px;background:#f8fbff}\nbutton{border:0;border-radius:10px;background:#2563eb;color:white;padding:10px 16px;cursor:pointer;font-weight:bold;margin:4px}button:hover{background:#1d4ed8}\n.sim{height:190px;background:#0f172a;border-radius:14px;position:relative;overflow:hidden;margin:15px 0}\n.wire{position:absolute;left:8%;right:8%;top:75px;height:45px;border:4px solid #94a3b8;border-radius:30px;background:#475569}\n.electron{position:absolute;width:10px;height:10px;border-radius:50%;background:#38bdf8;box-shadow:0 0 10px #38bdf8}\n.surface{position:absolute;inset:35px;border:4px solid #94a3b8;border-radius:50%;top:30px;width:130px;height:130px;left:calc(50% - 65px)}\n.field{position:absolute;inset:20px;border-radius:50%;border:2px dashed #facc15;animation:pulse 1.6s infinite}\n@keyframes pulse{50%{transform:scale(1.05);opacity:.45}}\n.question{padding:14px;background:#f8fafc;border-radius:12px;margin:10px 0}.answer{display:none;margin-top:8px;color:var(--good);font-weight:bold}\n.prompt{background:#111827;color:#e5e7eb;padding:14px;border-radius:10px;white-space:pre-wrap}\nfooter{text-align:center;padding:30px;color:#64748b}\n@media print{nav,button{display:none}.card{box-shadow:none;break-inside:avoid}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\n  \u003cdiv class=\"badge\">8-SINF FIZIKA\u003c/div>\n  \u003ch1>O‘tkazgichlarda elektr zaryadlarining taqsimlanishi\u003c/h1>\n  \u003cp>Zamonaviy, interaktiv va o‘qituvchi foydalanishiga tayyor dars materiali\u003c/p>\n\u003c/header>\n\n\u003cnav>\n\u003ca href=\"#maqsad\">Maqsad\u003c/a>\u003ca href=\"#tushuncha\">Tushunchalar\u003c/a>\u003ca href=\"#1\">1-bo‘lim\u003c/a>\n\u003ca href=\"#2\">2-bo‘lim\u003c/a>\u003ca href=\"#3\">3-bo‘lim\u003c/a>\u003ca href=\"#savollar\">Savollar\u003c/a>\n\u003ca href=\"#test\">Test\u003c/a>\u003ca href=\"#masala\">Masalalar\u003c/a>\u003ca href=\"#uy\">Uyga vazifa\u003c/a>\n\u003c/nav>\n\n\u003cmain>\n\u003csection id=\"maqsad\" class=\"card\">\n\u003ch2>1. Mavzuning maqsadi 🎯\u003c/h2>\n\u003cdiv class=\"grid\">\n\u003cdiv class=\"box\">\u003cb>Ta’limiy:\u003c/b> o‘tkazgich, erkin elektronlar, zaryadlarning taqsimlanishi va elektr maydonni tushuntirish.\u003c/div>\n\u003cdiv class=\"box\">\u003cb>Rivojlantiruvchi:\u003c/b> kuzatish, sabab–oqibatni aniqlash va fizik xulosa chiqarish.\u003c/div>\n\u003cdiv class=\"box\">\u003cb>Tarbiyaviy:\u003c/b> elektr hodisalaridan xavfsiz va ongli foydalanish madaniyatini shakllantirish.\u003c/div>\n\u003c/div>\n\u003ch2>Kutiladigan natijalar\u003c/h2>\n\u003cp>O‘quvchi o‘tkazgichni ta’riflaydi, erkin elektronlarni tushuntiradi, zaryadlarning sirt bo‘ylab taqsimlanishini izohlaydi, o‘tkir uchlarda zaryad zichligi kattaroq bo‘lishini tushuntiradi va elektr maydon kuch chiziqlarini tasvirlay oladi.\u003c/p>\n\u003c/section>\n\n\u003csection id=\"tushuncha\" class=\"card\">\n\u003ch2>2. Asosiy tushunchalar va ta’riflar\u003c/h2>\n\u003ctable>\u003ctr>\u003cth>Tushuncha\u003c/th>\u003cth>Ta’rif\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>O‘tkazgich\u003c/td>\u003ctd>Elektr zaryadlari, ayniqsa erkin zaryad tashuvchilar, nisbatan erkin harakatlana oladigan modda yoki jism.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Erkin elektron\u003c/td>\u003ctd>Metall tarkibida kristall panjaraga kuchsizroq bog‘langan va jism bo‘ylab harakatlana oladigan elektron.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Elektr zaryadi\u003c/td>\u003ctd>Jismlarning elektr ta’sirlashuvini belgilovchi fizik kattalik. SI birligi — kulon (C).\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Elektr maydon\u003c/td>\u003ctd>Zaryadlar atrofida mavjud bo‘lib, boshqa zaryadlarga elektr kuchi bilan ta’sir qiladigan maydon.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Kuch chiziqlari\u003c/td>\u003ctd>Elektr maydon yo‘nalishini tasvirlash uchun ishlatiladigan shartli chiziqlar.\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>\u003cb>Musbat (+) va manfiy (−) zaryadlar:\u003c/b> bir xil ishorali zaryadlar itarishadi, har xil ishorali zaryadlar tortishadi.\u003c/p>\n\u003c/section>\n\n\u003csection id=\"1\" class=\"card\">\n\u003ch2>3. 1-reja — O‘tkazgichlar va elektr zaryadlari ⚡\u003c/h2>\n\u003cp>Mis, alyuminiy, temir, kumush va grafit kabi moddalar elektr tokini o‘tkazadi. Metallarda elektr tokini asosan \u003cb>erkin elektronlarning tartibli harakati\u003c/b> hosil qiladi.\u003c/p>\n\u003cdiv class=\"box\">\u003cb>Hayotiy misol:\u003c/b> telefon zaryadlagichining metall simlari elektr zaryadlarini uzatishga xizmat qiladi.\u003c/div>\n\u003cp>Metall ichida elektronlar elektr maydon bo‘lmaganda tartibsiz harakat qiladi. Elektr maydon ta’sirida esa ularning tartibsiz harakatiga umumiy yo‘nalgan siljish qo‘shiladi.\u003c/p>\n\n\u003cdiv class=\"anim\">\u003ch3>🎬 Animatsiya 1: O‘tkazgich ichidagi elektronlar\u003c/h3>\n\u003cp>\u003cb>Boshlang‘ich:\u003c/b> mis sim va uning ichida tartibsiz harakatlanuvchi elektronlar.\u003c/p>\n\u003cdiv class=\"sim\" id=\"sim1\">\u003cdiv class=\"wire\">\u003c/div>\u003c/div>\n\u003cbutton onclick=\"startElectrons()\">▶ Animatsiyani boshlash\u003c/button>\n\u003cbutton onclick=\"stopElectrons()\">■ To‘xtatish\u003c/button>\n\u003cp>\u003cb>Bosqichlar:\u003c/b> 1) elektronlar tartibsiz harakat qiladi; 2) elektr maydon paydo bo‘ladi; 3) elektronlarning umumiy siljishi maydon yo‘nalishiga qarama-qarshi bo‘ladi.\u003c/p>\n\u003cp>\u003cb>Kuzatish:\u003c/b> elektronlar bir zumda to‘g‘ri chiziqda ketmaydi; ular tartibsiz harakat bilan birga yo‘nalgan siljishga ega.\u003c/p>\n\u003cp>\u003cb>Xulosa:\u003c/b> metallarning elektr o‘tkazuvchanligi erkin elektronlar bilan bog‘liq.\u003c/p>\u003c/div>\n\u003c/section>\n\n\u003csection id=\"2\" class=\"card\">\n\u003ch2>4. 2-reja — O‘tkazgich uchlarida zaryadlarning to‘planishi\u003c/h2>\n\u003cp>Bir xil ishorali zaryadlar o‘zaro itariladi. Elektrostatik muvozanatda ortiqcha zaryad o‘tkazgichning \u003cb>tashqi yuzasida\u003c/b> joylashadi.\u003c/p>\n\u003cp>O‘tkazgich shakli notekis bo‘lsa, zaryad zichligi bir xil bo‘lmaydi. \u003cb>O‘tkir uchlar va egrilik radiusi kichik joylarda sirt zaryad zichligi kattaroq bo‘ladi.\u003c/b>\u003c/p>\n\n\u003cdiv class=\"anim\">\u003ch3>🎬 Animatsiya 2: Zaryadlarning sirtga taqsimlanishi\u003c/h3>\n\u003cp>\u003cb>Boshlang‘ich:\u003c/b> neytral metall shar.\u003c/p>\n\u003cdiv class=\"sim\" id=\"sim2\">\u003cdiv class=\"surface\">\u003c/div>\u003c/div>\n\u003cbutton onclick=\"chargeSurface()\">⚡ Zaryad berish\u003c/button>\n\u003cp>\u003cb>Bosqichlar:\u003c/b> zaryadlar bir-birini itaradi → tashqi yuzaga siljiydi → o‘tkir uchli shaklda uchlar atrofida zichlik ortadi.\u003c/p>\n\u003cp>\u003cb>Kuzatish:\u003c/b> zaryadlar o‘tkazgich ichida “yig‘ilib qolmaydi”; muvozanatda ortiqcha zaryad sirt bo‘ylab taqsimlanadi.\u003c/p>\n\u003cp>\u003cb>Xulosa:\u003c/b> “zaryad faqat uchda” emas, balki butun tashqi sirt bo‘ylab taqsimlanadi; o‘tkir uchlarda zichlik kattaroq.\u003c/p>\u003c/div>\n\u003c/section>\n\n\u003csection id=\"3\" class=\"card\">\n\u003ch2>5. 3-reja — O‘tkazgich atrofidagi elektr maydon ⚡\u003c/h2>\n\u003cp>Zaryadlangan jism atrofida boshqa zaryadlarga kuch bilan ta’sir qiluvchi \u003cb>elektr maydon\u003c/b> mavjud bo‘ladi.\u003c/p>\n\u003cp>\u003cb>Elektr maydon kuch chiziqlari\u003c/b> maydon yo‘nalishini tasvirlash uchun ishlatiladi. Musbat zaryaddan chiziqlar tashqariga, manfiy zaryadga esa tomon yo‘naladi.\u003c/p>\n\u003cdiv class=\"grid\">\n\u003cdiv class=\"box\">\u003cb>+\u003c/b>\u003cbr>Kuch chiziqlari musbat zaryaddan tashqariga yo‘naladi.\u003c/div>\n\u003cdiv class=\"box\">\u003cb>−\u003c/b>\u003cbr>Kuch chiziqlari manfiy zaryad tomon yo‘naladi.\u003c/div>\n\u003c/div>\n\u003cdiv class=\"anim\">\u003ch3>🎬 Animatsiya 3: Elektr maydon kuch chiziqlari\u003c/h3>\n\u003cdiv class=\"sim\">\u003cdiv class=\"surface\">\u003c/div>\u003cdiv class=\"field\">\u003c/div>\u003cdiv style=\"position:absolute;left:47%;top:82px;color:#facc15;font-size:28px\">+\u003c/div>\u003c/div>\n\u003cbutton onclick=\"toggleField()\">⚡ Maydonni ko‘rsat/yashir\u003c/button>\n\u003cp>\u003cb>Bosqichlar:\u003c/b> zaryadlangan shar → kuch chiziqlari paydo bo‘ladi → o‘tkir uchli shaklda chiziqlar zichlashadi.\u003c/p>\n\u003cp>\u003cb>Kuzatish:\u003c/b> kuch chiziqlari zichroq tasvirlangan joyda elektr maydon kuchliroq deb tasavvur qilinadi.\u003c/p>\n\u003cp>\u003cb>Xulosa:\u003c/b> zaryad zichligi katta bo‘lgan o‘tkazgich qismlarida elektr maydon kuchliroq bo‘lishi mumkin.\u003c/p>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"card\">\n\u003ch2>6. Hayotiy misollar 🏠\u003c/h2>\n\u003cul>\n\u003cli>\u003cb>Avtomobil kuzovi:\u003c/b> metall kuzov elektr zaryadlarining harakatlanishi bilan bog‘liq hodisalarda o‘tkazgich sifatida qaraladi.\u003c/li>\n\u003cli>\u003cb>Yashin qaytargich:\u003c/b> baland va uchli qismlar atrofidagi elektr maydoni kuchliroq bo‘lishi mumkin.\u003c/li>\n\u003cli>\u003cb>Metall shar:\u003c/b> zaryadlangan metall sharda ortiqcha zaryad tashqi yuzada joylashadi.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\n\u003csection class=\"card\">\n\u003ch2>7. Rasm/diagramma yaratish uchun AI promptlar 🎨\u003c/h2>\n\u003cdiv class=\"prompt\">8-sinf fizika darsi uchun ilmiy jihatdan to‘g‘ri ta’limiy diagramma. Metall mis simning ichki tuzilishi, metall kristall panjarasi va erkin elektronlar ko‘rsatilgan. Elektronlar kichik nuqtalar bilan, elektr maydon yo‘nalishi va elektronlarning umumiy drift yo‘nalishi qarama-qarshi strelkalar bilan ko‘rsatilgan. Oq fon, sodda, zamonaviy, maktab darsligiga mos infografika.\u003c/div>\n\u003cbr>\n\u003cdiv class=\"prompt\">8-sinf fizika uchun zaryadlangan metall o‘tkazgich diagrammasi. Silliq metall shar va o‘tkir uchli metall o‘tkazgichni yonma-yon taqqoslash. Ortiqcha elektr zaryadlari tashqi yuzada joylashgan. O‘tkir uchlarda zaryadlar zichroq ko‘rsatilgan. Ilmiy aniq, sodda, o‘quvchiga tushunarli.\u003c/div>\n\u003cbr>\n\u003cdiv class=\"prompt\">8-sinf fizika darsi uchun zaryadlangan metall shar atrofidagi elektr maydon kuch chiziqlarini ko‘rsatuvchi ilmiy diagramma. Musbat zaryad, undan tashqariga yo‘nalgan radial kuch chiziqlari, strelkalar bilan yo‘nalish ko‘rsatilgan. O‘quv darsligiga mos, minimalistik va aniq.\u003c/div>\n\u003c/section>\n\n\u003csection id=\"savollar\" class=\"card\">\n\u003ch2>8. Interaktiv savollar 💡\u003c/h2>\n\u003cdiv class=\"question\">1. Nima sababdan mis sim elektr tokini yaxshi o‘tkazadi?\u003cbutton onclick=\"showAnswer(0)\">Javob\u003c/button>\u003cdiv class=\"answer\">Unda elektr zaryadlarini tashuvchi erkin elektronlar mavjud.\u003c/div>\u003c/div>\n\u003cdiv class=\"question\">2. Bir xil ishorali zaryadlar qanday ta’sirlashadi?\u003cbutton onclick=\"showAnswer(1)\">Javob\u003c/button>\u003cdiv class=\"answer\">Itarishadi.\u003c/div>\u003c/div>\n\u003cdiv class=\"question\">3. Ortiqcha zaryadlangan metall jismning ichida elektrostatik maydon qanday?\u003c/div>\n\u003cdiv class=\"question\">4. Nima uchun o‘tkir uchlarda elektr maydon kuchliroq?\u003c/div>\n\u003cdiv class=\"question\">5. Musbat zaryadning kuch chiziqlari qaysi tomonga yo‘naladi?\u003c/div>\n\u003c/section>\n\n\u003csection id=\"test\" class=\"card\">\n\u003ch2>9. 5 ta test 📝\u003c/h2>\n\u003col>\n\u003cli>Qaysi modda yaxshi elektr o‘tkazgich? \u003cb>A)\u003c/b> Rezina \u003cb>B)\u003c/b> Shisha \u003cb>C)\u003c/b> Mis \u003cb>D)\u003c/b> Plastmassa\u003c/li>\n\u003cli>Metallarda elektr tokini asosan nima tashiydi? \u003cb>A)\u003c/b> Protonlar \u003cb>B)\u003c/b> Neytronlar \u003cb>C)\u003c/b> Erkin elektronlar \u003cb>D)\u003c/b> Yadrolar\u003c/li>\n\u003cli>Bir xil ishorali zaryadlar... \u003cb>A)\u003c/b> tortishadi \u003cb>B)\u003c/b> itarishadi \u003cb>C)\u003c/b> ta’sirlashmaydi \u003cb>D)\u003c/b> yo‘qoladi\u003c/li>\n\u003cli>Ortiqcha zaryadlangan o‘tkazgichda zaryad asosan qayerda? \u003cb>A)\u003c/b> markazda \u003cb>B)\u003c/b> tashqi yuzada \u003cb>C)\u003c/b> faqat ichkarida \u003cb>D)\u003c/b> faqat markazda\u003c/li>\n\u003cli>O‘tkir uchlarda zaryad zichligi qanday? \u003cb>A)\u003c/b> kichikroq \u003cb>B)\u003c/b> nol \u003cb>C)\u003c/b> kattaroq \u003cb>D)\u003c/b> o‘zgarmaydi\u003c/li>\n\u003c/ol>\n\u003cdetails>\u003csummary>\u003cb>Javoblarni ko‘rish\u003c/b>\u003c/summary>\u003cp>1–C, 2–C, 3–B, 4–B, 5–C\u003c/p>\u003c/details>\n\u003c/section>\n\n\u003csection id=\"masala\" class=\"card\">\n\u003ch2>10. Sodda masalalar 🧮\u003c/h2>\n\u003cdiv class=\"box\">\u003cb>1-masala.\u003c/b> O‘tkazgichdagi elektr zaryadi 6 C. Uning bir qismi 2 C bo‘lsa, qolgan qismi qancha?\u003cdiv class=\"formula\">q₂ = q − q₁ = 6 − 2 = \u003cb>4 C\u003c/b>\u003c/div>\u003c/div>\n\u003cdiv class=\"box\">\u003cb>2-masala.\u003c/b> E = 200 N/C bo‘lgan maydonga q = 0,02 C zaryad qo‘yildi. Kuchni toping.\u003cdiv class=\"formula\">F = qE = 0,02 × 200 = \u003cb>4 N\u003c/b>\u003c/div>\u003cp>F — kuch (N), q — zaryad (C), E — maydon kuchlanganligi (N/C).\u003c/p>\u003c/div>\n\u003cdiv class=\"box\">\u003cb>3-masala.\u003c/b> E = 500 N/C, q = 0,01 C. Kuchni toping.\u003cdiv class=\"formula\">F = qE = 0,01 × 500 = \u003cb>5 N\u003c/b>\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"card\">\n\u003ch2>11. “Bilimingni sinab ko‘r” 🧠\u003c/h2>\n\u003col>\u003cli>O‘tkazgich deb nimaga aytiladi?\u003c/li>\u003cli>Metallarda elektr tokini qaysi zarralar tashiydi?\u003c/li>\u003cli>Erkin elektronlar nima?\u003c/li>\u003cli>Bir xil zaryadlar qanday ta’sirlashadi?\u003c/li>\u003cli>Ortiqcha zaryadlangan o‘tkazgichda zaryadlar qayerda joylashadi?\u003c/li>\u003cli>Nima uchun o‘tkir uchlarda zaryad zichligi katta?\u003c/li>\u003cli>Elektr maydon nima?\u003c/li>\u003cli>Kuch chiziqlari nima uchun kerak?\u003c/li>\u003cli>Musbat zaryadning kuch chiziqlari qaysi tomonga yo‘naladi?\u003c/li>\u003cli>Zaryad zichligi ortsa, elektr maydon qanday o‘zgaradi?\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Bir jumlada:\u003c/b> Nima uchun o‘tkir uchli metall jism atrofida elektr maydon kuchliroq bo‘ladi?\u003c/p>\n\u003c/section>\n\n\u003csection id=\"uy\" class=\"card\">\n\u003ch2>12. Uyga vazifa 🏠\u003c/h2>\n\u003col>\u003cli>Mavzuni o‘qish va asosiy tushunchalarni yozish.\u003c/li>\u003cli>Musbat va manfiy zaryadning kuch chiziqlarini chizish.\u003c/li>\u003cli>“Agar elektr zaryadlari o‘tkazgichda taqsimlanmasa, kundalik hayotimizda nimalar o‘zgarardi?” mavzusida 5–7 gap yozish.\u003c/li>\u003cli>Uyda uchraydigan 5 ta o‘tkazgich va 5 ta izolyatorni jadvalga yozish.\u003c/li>\u003c/ol>\n\u003cp>⚠️ Elektr rozetkasi, ochiq sim yoki boshqa xavfli qurilmalarni tajriba uchun ishlatmang.\u003c/p>\n\u003c/section>\n\n\u003csection class=\"card\">\n\u003ch2>13. 45 daqiqalik qisqa dars ssenariysi 🎓\u003c/h2>\n\u003ctable>\u003ctr>\u003cth>Vaqt\u003c/th>\u003cth>O‘qituvchi\u003c/th>\u003cth>O‘quvchi\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>0–3 daq.\u003c/td>\u003ctd>Salomlashish, mavzuga kirish\u003c/td>\u003ctd>Tayyorlanadi\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3–7\u003c/td>\u003ctd>“Nima uchun mis sim elektrni o‘tkazadi?”\u003c/td>\u003ctd>Taxmin qiladi\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>7–15\u003c/td>\u003ctd>O‘tkazgich va erkin elektronlar\u003c/td>\u003ctd>Tinglaydi\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>15–22\u003c/td>\u003ctd>1-animatsiya\u003c/td>\u003ctd>Kuzatadi\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>22–29\u003c/td>\u003ctd>Zaryadlarning sirtga taqsimlanishi\u003c/td>\u003ctd>Xulosa qiladi\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>29–34\u003c/td>\u003ctd>2-animatsiya\u003c/td>\u003ctd>O‘tkir uchlarni tahlil qiladi\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>34–39\u003c/td>\u003ctd>Elektr maydon va kuch chiziqlari\u003c/td>\u003ctd>Chizma bajaradi\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>39–42\u003c/td>\u003ctd>Interaktiv savol va test\u003c/td>\u003ctd>Javob beradi\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>42–44\u003c/td>\u003ctd>Bilimingni sinab ko‘r\u003c/td>\u003ctd>Mustaqil ishlaydi\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>44–45\u003c/td>\u003ctd>Xulosa va uyga vazifa\u003c/td>\u003ctd>Yozib oladi\u003c/td>\u003c/tr>\n\u003c/table>\n\u003c/section>\n\n\u003csection class=\"card\">\n\u003ch2>14. Eng muhim xulosalar ⭐\u003c/h2>\n\u003cp>⚡ \u003cb>Metallarda erkin elektronlar mavjud.\u003c/b>\u003c/p>\n\u003cp>⚡ \u003cb>Elektrostatik muvozanatda ortiqcha zaryad o‘tkazgichning tashqi yuzasida taqsimlanadi.\u003c/b>\u003c/p>\n\u003cp>⚡ \u003cb>O‘tkir uchlarda sirt zaryad zichligi kattaroq bo‘ladi.\u003c/b>\u003c/p>\n\u003cp>⚡ \u003cb>Zaryadlangan o‘tkazgich atrofida elektr maydon mavjud.\u003c/b>\u003c/p>\n\u003cp>⚡ \u003cb>Musbat zaryaddan kuch chiziqlari tashqariga, manfiy zaryadga esa tomon yo‘naladi.\u003c/b>\u003c/p>\n\u003c/section>\n\u003c/main>\n\u003cfooter>8-sinf fizika • 6-mavzu • Interaktiv HTML5 dars materiali\u003c/footer>\n\n\u003cscript>\nlet timer=null;\nfunction startElectrons(){\n const sim=document.getElementById('sim1');\n document.querySelectorAll('#sim1 .electron').forEach(e=>e.remove());\n for(let i=0;i\u003c18;i++){\n  const e=document.createElement('div'); e.className='electron';\n  e.style.top=(65+Math.random()*25)+'px'; e.style.left=(10+Math.random()*78)+'%'; sim.appendChild(e);\n }\n let shift=0;\n clearInterval(timer);\n timer=setInterval(()=>{\n  shift+=1;\n  document.querySelectorAll('#sim1 .electron').forEach((e,i)=>{\n   let x=parseFloat(e.style.left); x+=0.08+(i%3)*0.02; if(x>88)x=9;\n   e.style.left=x+'%';\n  });\n },30);\n}\nfunction stopElectrons(){clearInterval(timer)}\nfunction chargeSurface(){\n const sim=document.getElementById('sim2');\n document.querySelectorAll('#sim2 .electron').forEach(e=>e.remove());\n for(let i=0;i\u003c28;i++){\n  const e=document.createElement('div');e.className='electron';\n  const a=Math.random()*Math.PI*2, r=55+Math.random()*7;\n  e.style.left=(50+Math.cos(a)*r/1.3)+'%'; e.style.top=(50+Math.sin(a)*r/1.3)+'%';\n  sim.appendChild(e);\n }\n}\nfunction toggleField(){\n document.querySelector('.field').style.display =\n document.querySelector('.field').style.display==='none'?'block':'none';\n}\nfunction showAnswer(i){document.querySelectorAll('.answer')[i].style.display='block'}\n\u003c/script>\n\u003c/body>\n\u003c/html>"}, {"title": "Tabiatdagi elektr hodisalari", "icon": "🌩️", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>8-sinf Fizika — Tabiatdagi elektr hodisalari\u003c/title>\n\u003cstyle>\n*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef4ff;color:#17233c;line-height:1.55}\nheader{background:linear-gradient(135deg,#142b63,#1976d2);color:white;padding:30px 20px;text-align:center}\nheader h1{margin:0 0 8px;font-size:clamp(28px,5vw,48px)} header p{margin:4px}\nnav{position:sticky;top:0;z-index:5;background:#fff;padding:10px;display:flex;gap:8px;overflow:auto;box-shadow:0 2px 10px #0002}\nnav a{white-space:nowrap;text-decoration:none;background:#e8f0ff;color:#174ea6;padding:8px 12px;border-radius:20px;font-weight:bold}\nmain{max-width:1200px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 5px 20px #183b6b18}\nh2{color:#1455a0}h3{color:#0b6b75}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}\n.note{background:#eef8ff;border-left:5px solid #1976d2;padding:12px;border-radius:8px}.warn{background:#fff4e5;border-left:5px solid #ff9800;padding:12px;border-radius:8px}\nbutton{border:0;border-radius:10px;padding:10px 15px;background:#1769aa;color:#fff;cursor:pointer;margin:4px;font-weight:bold}button:hover{filter:brightness(1.08)}\nbutton.secondary{background:#607d8b}.output{margin-top:10px;padding:12px;border-radius:10px;background:#f2f6fa;min-height:35px}\n.sim{background:#0b1833;color:#fff;border-radius:15px;padding:18px;overflow:hidden}\ncanvas{display:block;width:100%;height:280px;background:linear-gradient(#19345d,#7aa8d8 62%,#487b45 62%);border-radius:12px}\nlabel{display:block;margin:8px 0;font-weight:bold}input[type=range]{width:100%}\n.pill{display:inline-block;background:#dff6ff;padding:5px 9px;border-radius:15px;margin:3px}\ntable{width:100%;border-collapse:collapse}th,td{border:1px solid #ccd6e4;padding:9px;text-align:left}th{background:#e8f0ff}\n.quiz label{font-weight:normal;background:#f7f9fc;padding:8px;border-radius:8px}.score{font-size:22px;font-weight:bold;color:#1455a0}\nfooter{text-align:center;padding:30px;color:#546}\n.hide{display:none}.ok{color:#087443;font-weight:bold}.bad{color:#b42318;font-weight:bold}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\n\u003ch1>⚡ Tabiatdagi elektr hodisalari\u003c/h1>\n\u003cp>8-sinf Fizika • Interaktiv elektron dars\u003c/p>\n\u003cp>Animatsiya • Simulyatsiya • Virtual tajriba • Test • Mustahkamlash\u003c/p>\n\u003c/header>\n\u003cnav>\n\u003ca href=\"#intro\">Kirish\u003c/a>\u003ca href=\"#lightning\">1. Chaqmoq\u003c/a>\u003ca href=\"#bio\">2. Biologik elektr\u003c/a>\u003ca href=\"#static\">3. Statik elektr\u003c/a>\u003ca href=\"#earth\">Yer magnit maydoni\u003c/a>\u003ca href=\"#tasks\">Topshiriqlar\u003c/a>\u003ca href=\"#test\">Test\u003c/a>\u003ca href=\"#final\">Xulosa\u003c/a>\n\u003c/nav>\n\n\u003cmain>\n\u003csection id=\"intro\" class=\"card\">\n\u003ch2>🎯 Dars maqsadi\u003c/h2>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003ch3>Bilim\u003c/h3>\u003cp>O‘quvchi tabiatdagi elektr hodisalarini, chaqmoq, biologik elektr, statik elektr va Yer magnit maydonini tushuntira oladi.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch3>Ko‘nikma\u003c/h3>\u003cp>Interaktiv modellar orqali zaryad, elektr maydoni va magnit maydoni bilan bog‘liq jarayonlarni kuzatadi.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch3>Kompetensiya\u003c/h3>\u003cp>Fizik hodisalarni kundalik hayot bilan bog‘laydi, xavfsizlik qoidalariga amal qiladi.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"note\">\u003cb>Qiziqarli savol:\u003c/b> Nega chaqmoqni avval ko‘ramiz, momaqaldiroqni esa keyin eshitamiz?\u003c/div>\n\u003c/section>\n\n\u003csection id=\"lightning\" class=\"card\">\n\u003ch2>⚡ 1. Chaqmoq va momaqaldiroq\u003c/h2>\n\u003ch3>Qisqa nazariya\u003c/h3>\n\u003cp>\u003cb>Chaqmoq\u003c/b> — bulutlar orasida yoki bulut bilan Yer orasida yuz beradigan kuchli elektr razryadi. Bulut ichidagi muz kristallari, suv tomchilari va havo oqimlarining harakati natijasida zaryadlar ajraladi. Ko‘pincha bulutning yuqori qismi nisbatan musbat, pastki qismi esa manfiy zaryadlanadi.\u003c/p>\n\u003cp>Bulutning manfiy qismi Yer yuzasidagi zaryadlarning qayta taqsimlanishiga sabab bo‘ladi. Elektr maydoni yetarlicha kuchayganda havoning izolyatorlik xususiyati buzilib, kuchli razryad — chaqmoq paydo bo‘ladi.\u003c/p>\n\u003cp>\u003cb>Momaqaldiroq\u003c/b> — chaqmoq kanali atrofidagi havoning juda tez qizib-kengayishi natijasida hosil bo‘ladigan tovush hodisasidir.\u003c/p>\n\u003cp>Yorug‘lik havoda tovushdan juda tez tarqaladi. Shuning uchun chaqmoqni deyarli darhol ko‘ramiz, momaqaldiroqni esa biroz kechroq eshitamiz.\u003c/p>\n\n\u003cdiv class=\"sim\">\n\u003ch3>🌩️ Interaktiv chaqmoq simulyatsiyasi\u003c/h3>\n\u003ccanvas id=\"storm\">\u003c/canvas>\n\u003cbutton onclick=\"stormStep(1)\">1. Zaryadlarni ajratish\u003c/button>\n\u003cbutton onclick=\"stormStep(2)\">2. Elektr maydonini kuchaytirish\u003c/button>\n\u003cbutton onclick=\"stormStep(3)\">3. Chaqmoqni hosil qilish\u003c/button>\n\u003cbutton class=\"secondary\" onclick=\"stormStep(0)\">🔄 Qayta boshlash\u003c/button>\n\u003cdiv id=\"stormText\" class=\"output\">Boshlash uchun tugmalardan foydalaning.\u003c/div>\n\u003c/div>\n\n\u003ch3>🧪 Virtual tajriba: chaqmoqni ko‘rish va eshitish\u003c/h3>\n\u003cp>Quyidagi tugma yorug‘lik va tovushning kelish vaqti farqini model qiladi.\u003c/p>\n\u003cbutton onclick=\"lightningSound()\">Chaqmoqni kuzatish\u003c/button>\n\u003cdiv id=\"soundOut\" class=\"output\">\u003c/div>\n\n\u003cdiv class=\"warn\">\u003cb>⚠️ Xavfsizlik:\u003c/b> Momaqaldiroq paytida ochiq maydon, baland yakka daraxt, metall konstruksiya va suv havzalaridan uzoqlashing. Bino ichida qolish va elektr jihozlaridan ehtiyot bo‘lish xavfsizroq.\u003c/div>\n\u003c/section>\n\n\u003csection id=\"bio\" class=\"card\">\n\u003ch2>🐟 2. Tirik tabiatdagi biologik elektr\u003c/h2>\n\u003cp>Tirik organizmlarda hujayra membranalari bo‘ylab ionlarning taqsimlanishi elektr potensiallari hosil bo‘lishiga olib keladi. Nerv hujayralari elektr impulslarini uzatadi, mushaklar esa elektr boshqaruv signallariga javob beradi. Yurak faoliyati ham elektr jarayonlari bilan chambarchas bog‘liq.\u003c/p>\n\u003cp>\u003cb>Elektr organlari\u003c/b> ayrim hayvonlarda maxsus hujayralardan tashkil topgan bo‘lib, ular elektr razryadi hosil qilishi mumkin. Masalan, elektr ilonbaliq, elektr skat va ayrim elektr laqqa baliqlari.\u003c/p>\n\n\u003cdiv class=\"sim\">\n\u003ch3>🐍 Elektr ilonbaliq modeli\u003c/h3>\n\u003ccanvas id=\"eel\">\u003c/canvas>\n\u003cbutton onclick=\"eelAction('organs')\">Elektr organlarini ko‘rsatish\u003c/button>\n\u003cbutton onclick=\"eelAction('shock')\">⚡ Razryad hosil qilish\u003c/button>\n\u003cbutton onclick=\"eelAction('field')\">Suvdagi elektr maydoni\u003c/button>\n\u003cdiv id=\"eelText\" class=\"output\">Tugmalardan birini tanlang.\u003c/div>\n\u003c/div>\n\u003cdiv class=\"note\">\u003cb>Hayotiy aloqa:\u003c/b> Nerv impulslari va hayvonlarning elektr organlari bir xil ma’nodagi “katta tok” emas. Biologik elektr hujayra va to‘qimalardagi ionlar harakati bilan bog‘liq.\u003c/div>\n\u003c/section>\n\n\u003csection id=\"static\" class=\"card\">\n\u003ch2>🎈 3. Statik elektr\u003c/h2>\n\u003cp>\u003cb>Statik elektr\u003c/b> — jismlarda elektr zaryadlarining muvozanat holatida to‘planishi bilan bog‘liq hodisalar majmuasi. Ishqalanishda elektronlarning bir jismdan boshqasiga o‘tishi mumkin.\u003c/p>\n\u003cp>Masalan, sharni sochga ishqalaganda shar zaryadlanadi va yengil qog‘oz bo‘laklarini tortishi mumkin. Kiyimlarning yopishishi ham statik elektrga misoldir.\u003c/p>\n\n\u003cdiv class=\"sim\">\n\u003ch3>🎈 Statik elektr simulyatsiyasi\u003c/h3>\n\u003ccanvas id=\"staticCanvas\">\u003c/canvas>\n\u003clabel>Ishqalanish soni: \u003cspan id=\"rubVal\">5\u003c/span>\u003c/label>\n\u003cinput id=\"rub\" type=\"range\" min=\"0\" max=\"20\" value=\"5\" oninput=\"staticSim()\">\n\u003cbutton onclick=\"staticSim()\">Natijani ko‘rsatish\u003c/button>\n\u003cdiv id=\"staticText\" class=\"output\">\u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"earth\" class=\"card\">\n\u003ch2>🌍 Yerning magnit maydoni va qutb yog‘dusi\u003c/h2>\n\u003cp>Yer atrofida magnit maydon mavjud. Kompas strelkasi Yerning magnit maydoni ta’sirida ma’lum yo‘nalishga keladi. Magnit maydon Yer atrofidagi fazoda maydon chiziqlari bilan tasvirlanishi mumkin.\u003c/p>\n\u003cp>Ayrim hayvonlar, jumladan ko‘chib yuruvchi qushlar, Yer magnit maydonidan yo‘nalishni aniqlashda foydalanishi mumkin.\u003c/p>\n\n\u003cdiv class=\"sim\">\n\u003ch3>🧭 Kompas simulyatsiyasi\u003c/h3>\n\u003ccanvas id=\"compass\">\u003c/canvas>\n\u003clabel>Joylashuv: \u003cspan id=\"posVal\">50\u003c/span>%\u003c/label>\n\u003cinput id=\"pos\" type=\"range\" min=\"0\" max=\"100\" value=\"50\" oninput=\"compassSim()\">\n\u003cdiv id=\"compassText\" class=\"output\">\u003c/div>\n\u003c/div>\n\n\u003ch3>🌌 Qutb yog‘dusi (Aurora)\u003c/h3>\n\u003cp>Quyoshdan keladigan zaryadlangan zarrachalar Yer magnit maydoni bilan o‘zaro ta’sirlashadi. Ularning bir qismi qutb hududlariga yo‘nalib, yuqori atmosferadagi zarrachalar bilan to‘qnashadi. Natijada qutb yog‘dusi — aurora yuzaga kelishi mumkin.\u003c/p>\n\u003cdiv class=\"sim\">\n\u003ccanvas id=\"aurora\">\u003c/canvas>\n\u003cbutton onclick=\"auroraStart()\">▶ Aurora animatsiyasi\u003c/button>\n\u003cbutton class=\"secondary\" onclick=\"auroraStop()\">⏹ To‘xtatish\u003c/button>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"tasks\" class=\"card\">\n\u003ch2>🧩 Interaktiv topshiriqlar\u003c/h2>\n\n\u003ch3>To‘g‘ri / Noto‘g‘ri\u003c/h3>\n\u003cdiv id=\"tf\">\n\u003cp>1. Chaqmoq elektr razryadidir. \u003cbutton onclick=\"tf(this,true)\">To‘g‘ri\u003c/button>\u003cbutton onclick=\"tf(this,false)\">Noto‘g‘ri\u003c/button>\u003c/p>\n\u003cp>2. Momaqaldiroq yorug‘lik hodisasidir. \u003cbutton onclick=\"tf(this,false)\">To‘g‘ri\u003c/button>\u003cbutton onclick=\"tf(this,true)\">Noto‘g‘ri\u003c/button>\u003c/p>\n\u003cp>3. Ishqalanish natijasida jismlar zaryadlanishi mumkin. \u003cbutton onclick=\"tf(this,true)\">To‘g‘ri\u003c/button>\u003cbutton onclick=\"tf(this,false)\">Noto‘g‘ri\u003c/button>\u003c/p>\n\u003c/div>\n\n\u003ch3>Bo‘sh joyni to‘ldiring\u003c/h3>\n\u003col>\n\u003cli>Chaqmoq — kuchli elektr \u003cinput id=\"fill1\">.\u003c/li>\n\u003cli>Yer atrofida \u003cinput id=\"fill2\"> maydon mavjud.\u003c/li>\n\u003cli>Kompasning strelkasi \u003cinput id=\"fill3\"> maydoni ta’sirida yo‘naladi.\u003c/li>\n\u003c/ol>\n\u003cbutton onclick=\"checkFill()\">Tekshirish\u003c/button>\u003cdiv id=\"fillOut\" class=\"output\">\u003c/div>\n\n\u003ch3>Vaziyatli savollar\u003c/h3>\n\u003cdiv class=\"note\">\u003cb>1-vaziyat:\u003c/b> Momaqaldiroq boshlandi. Ochiq maydonda turibsiz. Nima qilasiz?\u003c/div>\n\u003cp>Javob: ochiq joydan xavfsiz bino yoki avtomobilga kirish, baland yakka daraxt va suvdan uzoqlashish.\u003c/p>\n\u003cdiv class=\"note\">\u003cb>2-vaziyat:\u003c/b> Sharni sochga ishqalaganda u qog‘ozni tortdi. Nima sabab?\u003c/div>\n\u003cp>Javob: ishqalanish natijasida elektr zaryadlanish va elektrostatik ta’sir yuz berdi.\u003c/p>\n\u003cdiv class=\"note\">\u003cb>3-vaziyat:\u003c/b> Kompasni magnit maydonga olib kirsangiz nima kuzatiladi?\u003c/div>\n\u003cp>Javob: kompas strelkasi maydon yo‘nalishiga mos ravishda buriladi.\u003c/p>\n\n\u003ch3>🔗 Moslashtirish\u003c/h3>\n\u003ctable>\u003ctr>\u003cth>Hodisa\u003c/th>\u003cth>Mos tushuncha\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1. Chaqmoq\u003c/td>\u003ctd>A. Elektr razryadi\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2. Momaqaldiroq\u003c/td>\u003ctd>B. Tovush hodisasi\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3. Aurora\u003c/td>\u003ctd>C. Atmosferadagi zarrachalar bilan o‘zaro ta’sir\u003c/td>\u003c/tr>\u003c/table>\n\u003c/section>\n\n\u003csection id=\"test\" class=\"card quiz\">\n\u003ch2>📝 10 ta test\u003c/h2>\n\u003cform id=\"quizForm\">\n\u003cdiv class=\"q\">\u003cb>1. Chaqmoq nima?\u003c/b>\u003clabel>\u003cinput type=\"radio\" name=\"q1\" value=\"a\"> A) Elektr razryadi\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q1\" value=\"b\"> B) Oddiy shamol\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q1\" value=\"c\"> C) Suv bug‘i\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q1\" value=\"d\"> D) Magnit\u003c/label>\u003c/div>\n\u003cdiv class=\"q\">\u003cb>2. Momaqaldiroqning asosiy sababi nima?\u003c/b>\u003clabel>\u003cinput type=\"radio\" name=\"q2\" value=\"a\"> A) Havoning chaqmoq kanali atrofida tez qizib-kengayishi\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q2\" value=\"b\"> B) Yer aylanishi\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q2\" value=\"c\"> C) Quyosh chiqishi\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q2\" value=\"d\"> D) Shamolning yo‘nalishi\u003c/label>\u003c/div>\n\u003cdiv class=\"q\">\u003cb>3. Nega chaqmoq avval ko‘rinadi?\u003c/b>\u003clabel>\u003cinput type=\"radio\" name=\"q3\" value=\"a\"> A) Yorug‘lik tovushdan tez tarqaladi\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q3\" value=\"b\"> B) Tovush yorug‘likdan tez\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q3\" value=\"c\"> C) Chunki chaqmoq jim\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q3\" value=\"d\"> D) Havo tovushni yutadi\u003c/label>\u003c/div>\n\u003cdiv class=\"q\">\u003cb>4. Statik elektr nima bilan bog‘liq?\u003c/b>\u003clabel>\u003cinput type=\"radio\" name=\"q4\" value=\"a\"> A) Zaryadlarning to‘planishi\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q4\" value=\"b\"> B) Faqat magnitlar\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q4\" value=\"c\"> C) Faqat issiqlik\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q4\" value=\"d\"> D) Faqat tovush\u003c/label>\u003c/div>\n\u003cdiv class=\"q\">\u003cb>5. Ishqalanishda asosan qaysi zarracha ko‘chishi mumkin?\u003c/b>\u003clabel>\u003cinput type=\"radio\" name=\"q5\" value=\"a\"> A) Elektron\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q5\" value=\"b\"> B) Protonning yadrosi\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q5\" value=\"c\"> C) Neytron\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q5\" value=\"d\"> D) Atom yadrosi\u003c/label>\u003c/div>\n\u003cdiv class=\"q\">\u003cb>6. Elektr ilonbaliq nimaga ega?\u003c/b>\u003clabel>\u003cinput type=\"radio\" name=\"q6\" value=\"a\"> A) Elektr organlariga\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q6\" value=\"b\"> B) Oddiy batareyaga\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q6\" value=\"c\"> C) Kompasga\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"q6\" value=\"d\"> D) Generatorga\u003c/label>\u003c/div>\n\u003cdiv class=\"q\">\u003cb>7. Kompas nimaga yo‘naladi?\u003c/b>\u003clabel>\u003cinput type=\"radio\" name=\"q7\" value=\"a\"> A) Yer magnit maydoniga\u003c/label>\u003clabel>\u003cinput
